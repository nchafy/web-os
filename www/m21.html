    && src.effects[0].target === run.dstWin
  /* READ IMMEDIATELY AFTER THE COPY AND NOT AT THE END, because the source is rewritten between the
   * two drops for the clause three below. The `stat` at the end is the other half: the file is still
   * there, whatever its bytes now are. */
  drag.theCopysSourceIsStillPresent = isExactly(run.copyFs.source)
    && fs.afterDrags.ctrlSource.exit === 0
  drag.theCopyLandedInTheTarget = isExactly(run.copyFs.landed)
    && dst.dropped.some((d) => d.name === CTRL_ME && d.into === DST)
  /* AND NOTHING WAS BINNED FOR IT. A COPY source ignores the receipt, so a `bin.binned` entry for
   * this row would be a copy that also removed the original. */
  drag.theCopyBinnedNothing = !src.bin.binned.some((b) => b.name === CTRL_ME)
    && !src.movedOut.includes(CTRL_ME)

  /* ---- THE SAME ROW AGAIN, ONTO A NAME THE TARGET HOLDS: EEXIST, FROM A DROP --------------- */
  const dropRefusal = refusalFor(dst, CTRL_ME)
  drag.theSecondDropSaysEEXIST = Boolean(dropRefusal) && dropRefusal.errno === 'EEXIST'
  /* THE TARGET'S OWN `dropWhere` ROW FOR THE SECOND DROP: one entry per drop in gesture order, so
   * `[1]` is this one, and `landed: 0` of `of: 1` is the refusal seen as arithmetic rather than as
   * the absence of a `dropped` entry. */
  drag.theSecondDropLandedNothing = dst.dropsIn === 3
    && dst.dropped.filter((d) => d.name === CTRL_ME).length === 1
    && (dst.dropWhere[1] || {}).landed === 0 && (dst.dropWhere[1] || {}).of === 1
  /* AND THE TARGET'S OWN COPY IS STILL THE FIRST DROP'S, byte for byte, WHILE THE SOURCE IS NOT.
   * Both conjuncts: the source was rewritten before the second drop precisely so that a clobber is
   * visible as DIFFERENT bytes — without that, `--paste-clobbers` replaced the file with an
   * identical copy and this clause stayed green over the world it names (`CTRL2_TEXT`). */
  drag.theTargetsCopySurvivedTheSecondDrop = isExactly(fs.afterDrags.ctrlLanded)
    && isExactly(fs.afterDrags.ctrlSourceRewritten)
    && run.rewrote.exit === 0

  /* ---- NO MODIFIER, INSIDE THE SESSION TREE: A MOVE, COMPLETED INTO THE BIN --------------- */
  const offeredMove = src.effectsOffered.find((e) => e.name === MOVE_ME) || null
  drag.thePlainDragOfferedAMove = Boolean(offeredMove)
    && offeredMove.effect === DOBJ_EFFECT_MOVE
  drag.theKernelAnsweredMove = Boolean(src.effects[2])
    && src.effects[2].effect === DOBJ_EFFECT_MOVE && src.effects[2].target === run.dstWin
  drag.theMovesSourceIsGone = fs.afterDrags.moveSource.exit !== 0
  drag.theMoveLandedInTheTarget = isExactly(fs.afterDrags.moveLanded)
    && dst.dropped.some((d) => d.name === MOVE_ME && d.into === DST)
  /* AND THE ORIGINAL IS IN THE BIN WITH ITS RECORD, which is the whole reason the source may offer
   * a MOVE at all: the receipt says the drop was DELIVERED and not that it was collected, so an
   * `unlink` here would destroy a file on the strength of a fact the kernel does not report. */
  const movedBin = src.bin.binned.find((b) => b.name === MOVE_ME) || null
  drag.theMovedOriginalIsInTheBin = src.movedOut.includes(MOVE_ME)
    && Boolean(movedBin) && movedBin.from === `${SRC}/${MOVE_ME}`
    && isExactly(fs.afterDrags.moveBinned)
  drag.theMovedOriginalKeptItsRecord = fs.afterDrags.moveRecord.exit === 0
    && fs.afterDrags.moveRecord.type === 'symbolic link'
  /* AND THE SOURCE WINDOW SHOWS IT GONE. The drawing is not the proof — the two clauses above are —
   * but a row the filesystem has lost and the window still draws is a listing patched in place. */
  drag.theSourceWindowLostTheRow = !move.srcAfter.names.includes(MOVE_ME)
    && move.srcAfter.names.includes(CTRL_ME)

  drag.ok = drag.theTwoWindowsAreTheFixture && drag.everyDropLandedOnTheTarget
    && drag.everyGestureBeganAKernelSession && drag.theKernelDeliveredEveryDrop
    && drag.theTargetWasEnteredWithAnOffer
    && drag.ctrlOfferedACopy && drag.theKernelAnsweredCopy
    && drag.theCopysSourceIsStillPresent && drag.theCopyLandedInTheTarget
    && drag.theCopyBinnedNothing
    && drag.theSecondDropSaysEEXIST && drag.theSecondDropLandedNothing
    && drag.theTargetsCopySurvivedTheSecondDrop
    && drag.thePlainDragOfferedAMove && drag.theKernelAnsweredMove
    && drag.theMovesSourceIsGone && drag.theMoveLandedInTheTarget
    && drag.theMovedOriginalIsInTheBin && drag.theMovedOriginalKeptItsRecord
    && drag.theSourceWindowLostTheRow
  globalThis.M21.proofs.drag = { ok: drag.ok, evidence: drag }
  say((drag.ok ? 'ok  ' : 'BAD ') + 'drag: offered ['
    + src.effectsOffered.map((e) => `${e.name}=${e.effect}`).join(' ') + '], the kernel answered ['
    + src.effects.map((e) => e.effect).join(' ') + '] (COPY=' + DOBJ_EFFECT_COPY + ' MOVE='
    + DOBJ_EFFECT_MOVE + '); ' + CTRL_ME + ' is still in src='
    + (fs.afterDrags.ctrlSource.exit === 0) + ' and the target\'s copy reads '
    + fs.afterDrags.ctrlLanded.bytes + ' of ' + fs.afterDrags.ctrlLanded.want
    + ', ' + MOVE_ME + ' is in src=' + (fs.afterDrags.moveSource.exit === 0) + ' and in the Bin as ['
    + src.bin.binned.map((b) => b.name).join(' ') + ']; the second drop said '
    + ((dropRefusal && dropRefusal.errno) || 'NOTHING'))
}

/* --------------------------------------------------------------------------------------------
   PROOF 4: F5 — it re-lists, and the selection survives for the rows that survive.

   `docs/PLAN-SHELL.md` §M21: "F5 re-lists and the selection survives for the rows that survive."

   THE SELECTION IS READ AS NAMES AND NEVER AS INDICES, which is the clause rather than a
   convenience: `reread` restores a selection BY NAME precisely because index order is what a
   mutation moves, so a page comparing indices across the re-list would be asserting the defect.

   THE KEY IS SYNTHESISED AND THE PAGE MEASURES THAT IT WAS. `scripts/cdp.py`'s `KEYS` table has no
   `F5`, so the clause below asserts that `synthetic` rose by exactly one and `trusted` did not —
   the honest reading of a key this harness cannot send, and the same gap M20 records for F2 and
   Delete. The SELECTION it survives was made with two real clicks, which is the part that matters.
   -------------------------------------------------------------------------------------------- */
function proofRefresh (run) {
  const a = run.account
  const refresh = {
    before: run.selected.names,
    stale: run.stale.names,
    after: run.refreshed.names,
    selectedNames: selectedNames(a),
    selected: a.selected,
    rows: a.rows.map((r) => r.name),
    refreshes: a.refreshes,
    refreshKept: a.refreshKept,
    keysyms: a.keysyms,
    selects: a.selects,
    refreshedMs: run.refreshedMs,
    keys: { before: run.keysBefore, after: run.keysAfter },
    mutation: run.mutation,
    refusals: a.refusals,
    controls: a.controls,
  }

  /* THE FIXTURE, AND THE MUTATION REALLY HAPPENED. `rm` reports what it removed and `touch` reports
   * what it CREATED as against what it merely stamped — the two arrays are disjoint by contract
   * (`src/bin/touch.mjs`), which is what lets this clause tell a created row from a touched one. */
  refresh.theTwoRowsAreTheFixture = sameSet(run.start.names, F5_ROWS_BEFORE)
  refresh.theDirectoryChangedUnderTheWindow = run.mutation.removed.exit === 0
    && run.mutation.added.exit === 0
    && sameSet(run.mutation.added.created, [`${F5D}/${NEW_ROW}`])
    && run.mutation.added.stamped.length === 0
  /* AND THE WINDOW HAD NOT NOTICED. `files` holds no watch and is parked in `poll`, which is the
   * whole reason F5 exists: a listing that had already refreshed itself would make the clause below
   * pass over a gesture nobody needed. */
  refresh.theWindowShowedTheStaleRows = sameSet(run.stale.names, F5_ROWS_BEFORE)

  /* TWO ROWS WERE SELECTED BY REAL INPUT. `selects` counts the selection changes the program made,
   * so two clicks are two — and a Ctrl+click that was delivered as a PLAIN click would have replaced
   * the set rather than adding to it, which is visible in the names below and not here. */
  refresh.twoRowsWereSelectedByRealInput = a.selects >= 2
  /* AND THE KEY WAS THE ONE SYNTHETIC EVENT IN THE RUN. `trusted` must not move: the two clicks are
   * POINTER events and the only other key this window gets is the `q` that quits it, which is sent
   * after the account is read. */
  refresh.theF5WasSynthesisedAndSaysSo =
    run.keysAfter.synthetic === run.keysBefore.synthetic + 1
    && run.keysAfter.trusted === run.keysBefore.trusted
  /* AND IT ARRIVED AS A KEYSYM. `keysymOf` answers 0 for every byte key, so a program that received
   * `F5` as bytes would count no keysym at all — this window is given no arrow and no F2, so one
   * keysym is exactly the F5. */
  refresh.theKeysymReachedTheProgram = a.keysyms === 1 && a.refreshes === 1
    && run.refreshedMs >= 0

  /* THE LISTING CAME BACK FRESH: the new row is there and the removed one is not. Read off the
   * DISPLAY LIST, which is what a reader sees — `--stale-listing` serves the rows already in hand,
   * and this is the clause that measures it. */
  refresh.theListingCameBackFresh = sameSet(run.refreshed.names, F5_ROWS_AFTER)

  /* AND THE SELECTION SURVIVED FOR THE ROW THAT SURVIVED — by NAME, out of the program's own
   * account. Two clauses and not one: that the survivor is still selected, and that the row which is
   * gone was not re-selected. A single clause over the set would pass for a program that selected
   * nothing at all. */
  refresh.theSurvivorIsStillSelected = sameSet(selectedNames(a), [KEEP_SEL])
  refresh.theLostRowWasNotReselected = a.refreshKept === 1
    && !selectedNames(a).includes(GONE_SEL)
  /* AND NOTHING WAS RESURRECTED. A selection restored by INDEX would highlight whatever landed in
   * the slot — which here is `new-row.txt`, a row the reader never touched — so the name NOT being
   * in the set is the reading that separates the two implementations. */
  refresh.theNewRowIsNotSelected = !selectedNames(a).includes(NEW_ROW)
  /* AND F5 REFUSED NOTHING. `refresh` is not a `runVerb` verb and no menu row runs it, so there is
   * nothing for it to have declined; a refusal here would be a re-read that failed. */
  refresh.theRefreshRefusedNothing = a.refusals.length === 0

  refresh.ok = refresh.theTwoRowsAreTheFixture && refresh.theDirectoryChangedUnderTheWindow
    && refresh.theWindowShowedTheStaleRows && refresh.twoRowsWereSelectedByRealInput
    && refresh.theF5WasSynthesisedAndSaysSo && refresh.theKeysymReachedTheProgram
    && refresh.theListingCameBackFresh && refresh.theSurvivorIsStillSelected
    && refresh.theLostRowWasNotReselected && refresh.theNewRowIsNotSelected
    && refresh.theRefreshRefusedNothing
  globalThis.M21.proofs.refresh = { ok: refresh.ok, evidence: refresh }
  say((refresh.ok ? 'ok  ' : 'BAD ') + 'refresh: [' + run.stale.names.join(' ') + '] -> ['
    + run.refreshed.names.join(' ') + '] after ' + a.refreshes + ' F5; ' + a.refreshKept
    + ' of the selected row(s) survived as [' + selectedNames(a).join(' ') + ']; keys synthetic '
    + run.keysBefore.synthetic + '->' + run.keysAfter.synthetic + ', trusted '
    + run.keysBefore.trusted + '->' + run.keysAfter.trusted)
}

/* ---- the filesystem readings ---------------------------------------------------------------- */

/** EVERY READING THE BIN PROOFS ARE ASSERTED ON, TAKEN THE MOMENT EACH IS TRUE. None of these can
 *  be taken at the end: a restore moves the payload, so what is in the Bin has to be read while it
 *  is there. Each comes out of a SEPARATE PROCESS — `wc`, `grep`, `stat`, `ls` — so none is a
 *  program's belief about its own call. */
async function readAfterDelete (k) {
  return {
    source: await statOf(k, `${ROOT}/${BIN_ME}`),
    payload: await fileIs(k, `${BIN}/${BIN_ME}`, BIN_TEXT),
    /* THE SAME PAYLOAD READ FOR THE WRONG TEXT, which is this comparison's own negative control. */
    payloadWrongText: await fileIs(k, `${BIN}/${BIN_ME}`, OCCUPIED_TEXT),
    payloadStat: await statOf(k, `${BIN}/${BIN_ME}`),
    record: await statOf(k, FILES_METRICS.originRecordOf(`${BIN}/${BIN_ME}`)),
    binList: await listCount(k, BIN),
  }
}

async function readAfterRestore (k) {
  return {
    source: await fileIs(k, `${ROOT}/${BIN_ME}`, BIN_TEXT),
    payload: await statOf(k, `${BIN}/${BIN_ME}`),
    record: await statOf(k, FILES_METRICS.originRecordOf(`${BIN}/${BIN_ME}`)),
  }
}

async function readAfterDrags (k) {
  const binned = `${BIN}/${MOVE_ME}`
  return {
    ctrlSource: await statOf(k, `${SRC}/${CTRL_ME}`),
    /* THE SOURCE'S REWRITTEN BYTES, which are NOT the target's: that difference is what makes
     * `theTargetsCopySurvivedTheSecondDrop` a reading rather than an assertion over a constant. */
    ctrlSourceRewritten: await fileIs(k, `${SRC}/${CTRL_ME}`, CTRL2_TEXT),
    ctrlLanded: await fileIs(k, `${DST}/${CTRL_ME}`, CTRL_TEXT),
    moveSource: await statOf(k, `${SRC}/${MOVE_ME}`),
    moveLanded: await fileIs(k, `${DST}/${MOVE_ME}`, MOVE_TEXT),
    moveBinned: await fileIs(k, binned, MOVE_TEXT),
    moveRecord: await statOf(k, FILES_METRICS.originRecordOf(binned)),
  }
}

/* ---- the live desktop ---------------------------------------------------------------------- */

/**
 * THE TWO WINDOWS THE LIVE DESKTOP OPENS, as specs `www/shell.mjs` stages.
 *
 * `files` TAKES NO OPERAND, which is D40's answer: the program resolves `std.sessionDir` for itself
 * — the session's WRITABLE copy of the read-only base — so every verb this milestone adds is
 * reachable from the window a reader is handed, and so is the Bin the deletes go to.
 *
 * CLEAR OF THE ICON COLUMN, because the shared staging runs the `desktop` process and that process
 * publishes rows: a window at the desktop's left edge sits on top of the icons, which is constraint
 * 289's own failure. `term` is LAST because it spawns `sh` by syscall.
 */
const LIVE_X = 120
const LIVE_PROGRAMS = [
  {
    ...PROGRAMS.files,
    name: 'files',
    box: () => ({ x: LIVE_X, y: 20, w: 620, h: 300 }),
  },
  {
    ...PROGRAMS.term,
    box: (wa) => ({ x: LIVE_X, y: 340, w: 620, h: Math.max(160, wa.h - 360) }),
  },
]

/** WHAT THIS MILESTONE ADDED, appended to the shared help. ADDED rather than substituted, so a
 *  reader here still learns what the rest of the shell does — and in a second engine this log is the
 *  only channel there is. */
const M21_HELP = [
  '  a Delete inside the session tree now goes to the Recycle Bin, not away: the bytes move',
  '  and a symlink beside them records where they came from',
  `  type \`files ${BIN}\` at the prompt to open it,`,
  '  then right-click a row for Restore — the Bin is the one place that verb exists',
  '  a restore onto a path something else now holds refuses by name, and says which path',
  '  F5 re-lists, and a row you had selected stays selected if it is still there',
  '  drag a file row onto another `files` window to copy it in; a plain drag inside the',
  '  session tree MOVES it, and the original goes to the Bin rather than being unlinked',
  '  THE DESKTOP\'S Recycle Bin ICON OPENS NOTHING YET: `src/bin/desktop.mjs` publishes it as',
  '  `files --bin` and `src/bin/files.mjs` has no such option, so the spawn exits with a usage',
  '  complaint. Use the prompt until that flag lands.',
]

/** THE ONE DEFECT A READER OF THIS DESKTOP MEETS, stated where a driver reads it as well as where a
 *  reader does. See this page's header, note 2, for the measurement. */
const BIN_ICON_NOTE = 'the desktop\'s Recycle Bin icon opens nothing: src/bin/desktop.mjs '
  + 'publishes it as `files --bin` and src/bin/files.mjs has no such option, so std.getopt answers '
  + 'bad: "--" and the program exits 2 with a usage complaint and no window. Measured on this page: '
  + 'a double-click left the shell at 2 taskbar buttons before and 2 after, with no error or fault. '
  + `Until the flag lands, \`files ${BIN}\` at the prompt is the route.`

async function live () {
  globalThis.M21.notes.push(BIN_ICON_NOTE)
  const { host, shell } = await stageDesktop({
    into: desktop,
    report: globalThis.M21,
    say,
    label: 'm21',
    tap: captureBatch,
    programs: LIVE_PROGRAMS,
    help: DESKTOP_HELP.concat(M21_HELP),
  })
  publish(host, shell)
}

/**
 * WHAT THIS PAGE PUBLISHES FOR A DRIVER THAT IS NOT THIS PAGE, whichever path built the host.
 *
 * `LAST_BATCH` is module-private and the proofs read it directly, so a driver in ANOTHER ENGINE has
 * no other route to which rows a program drew. The precedent is `FILES_METRICS` and the lesson is in
 * CLAUDE.md: a bench script's excuse for restating a program's geometry was that it sits outside the
 * process and cannot import the module, which was "true of the PROCESS and false of the page it
 * drives".
 *
 * `aimAt` hands back the VIEWPORT point, which is the only unit `input.performActions` and
 * `Input.dispatchMouseEvent` both take, and REPORTS the reason rather than throwing across the
 * evaluate boundary: a thrown error arrives at a driver as `null`.
 */
function publish (host, shell) {
  HOST = host
  SHELL = shell
  globalThis.M21.host = host
  globalThis.M21.shell = shell
  globalThis.M21.dpr = dpr()
  globalThis.M21.viewport = { w: window.innerWidth, h: window.innerHeight }
  /* THE TWO PATHS THIS MILESTONE IS ABOUT, PUBLISHED AS DATA. A driver in another engine must not
   * spell `$Recycle.Bin`: the name is `FILES_METRICS.BIN_NAME` and the directory is `binDirIn`, and
   * a bench script's copy of either is the drift CLAUDE.md's table exists to stop. */
  globalThis.M21.paths = { home: HOME_DIR, root: ROOT, bin: BIN, src: SRC, dst: DST, f5: F5D }
  const frameOf = (what) => {
    for (const entry of host.frames.values()) {
      if (entry.win.titleText.includes(String(what))) return entry
    }
    return null
  }
  globalThis.M21.listState = (what) => {
    const entry = frameOf(what)
    return entry && entry.surface ? listState(entry) : null
  }
  globalThis.M21.aimAt = (what, kind, key) => {
    const entry = frameOf(what)
    if (!entry || !entry.surface) return { error: `no surfaced window named ${what}` }
    try {
      const state = listState(entry)
      if (kind === 'row') return pointAtRow(entry, state, String(key))
      if (kind === 'empty') return pointLowOnEmptySpace(entry, state, 'a driver in another engine')
      if (kind === 'popup') {
        if (!shell) return { error: 'this page has no shell, so there is no popup' }
        return aimPopupRow(shell, String(key), 'a driver in another engine')
      }
    } catch (e) {
      return { error: String((e && e.message) || e) }
    }
    return { error: `no aim named ${kind}; row, empty and popup are the three` }
  }
}

async function main () {
  if (!CFG.proofs) {
    globalThis.M21.state = 'done'
    globalThis.M21.verdict = 'live'
    await live()
    return
  }

  const controls = programFlags()
  say('M21 — the Recycle Bin, refresh, and a drop target.'
    + (controls.length ? ' CONTROL: ' + controls.join(' ') : ''))
  say('dpr ' + dpr() + ', viewport ' + window.innerWidth + 'x' + window.innerHeight + '.')
  say('Every right-click, popup click, selection click and DRAG below is REAL input, performed by')
  say('something that is not this page: a synthesised event is isTrusted === false (175). The one')
  say('synthetic key is F5, which scripts/cdp.py cannot send — the page measures that it was')
  say('synthetic rather than claiming it was not. Every byte figure comes out of wc and grep.')

  /* THE PROOFS PATH STAGES A TASKBAR, which M19's did not. `WinHost.#menu` hands its rows to
   * `this.shell.openContextMenu` and a host with no shell reports the DISMISSAL instead — so the
   * shell is the renderer under test here, not scenery. No `desktop` PROCESS is staged: the start
   * menu and the icons are its rows and no clause reads them. */
  const { k, host, shell } = await bootShell({
    into: desktop, report: globalThis.M21, say, label: 'm21', tap: captureBatch, taskbar: true,
  })
  publish(host, shell)
  globalThis.M21.kernelIsolated = true
  globalThis.M21.controlsInForce = host.report().controls

  /* THE SESSION'S TREE IS A PRECONDITION AND NOT A HOPE. Every clause on this page is about a path
   * under `HOME_DIR`, and a volume whose seed did not run has none — so a run there would report a
   * page of red clauses with the cause three layers down. `bootShell` already published the kernel's
   * own seed report; this is the reading that refuses. */
  const seeded = await statOf(k, HOME_DIR)
  if (seeded.exit !== 0 || seeded.type !== 'directory') {
    throw new Error(`${HOME_DIR} is not a directory (stat exit ${seeded.exit}, type `
      + `${JSON.stringify(seeded.type)}): the session's writable copy of the read-only base is what `
      + 'the Bin lives in, so every clause on this page would be about a tree that is not there. '
      + `The kernel reported ${JSON.stringify(globalThis.M21.seed || null)}`)
  }

  globalThis.M21.tree = await makeTree(k)
  const t = globalThis.M21.tree
  say('staged ' + ROOT + ' and cleared ' + BIN + ': rm exits ' + t.binRm + ',' + t.rootRm
    + ', mkdir exit ' + t.mkdir + ', echo exits ' + t.echoes.join(',') + ' for ' + t.rows
    + ' opening row(s)')

  /* ---- 1 and 2: the Bin -------------------------------------------------------------------- */
  const del = await driveDeletes(k, host, shell)
  globalThis.M21.deletes = del
  const afterDelete = await readAfterDelete(k)

  /* THE TWO THINGS THAT MUST HAPPEN BETWEEN THE DELETE AND THE RESTORE, and both are the FIXTURE
   * for a clause rather than tidying. The origin path is re-created with DIFFERENT bytes, which is
   * the only world an occupied-path refusal is about; and a payload is `touch`ed straight into the
   * Bin with no record beside it, which is the row whose Restore must be published disabled. */
  const occupied = await writeLine(k, `${ROOT}/${TAKEN_BACK}`, OCCUPIED_TEXT)
  const orphaned = await runProgram(k, TOUCH, ['touch', `${BIN}/${ORPHAN}`])
  globalThis.M21.between = {
    occupied: { exit: occupied.exit }, orphaned: { exit: orphaned.exit,
      created: [...(orphaned.created || [])] },
  }
  say('between: re-created ' + ROOT + '/' + TAKEN_BACK + ' with other bytes (exit '
    + occupied.exit + ') and touched a record-less payload into the Bin (exit '
    + orphaned.exit + ')')

  const binRun = await driveBin(k, host, shell)
  globalThis.M21.binRun = binRun
  const afterRestore = await readAfterRestore(k)
  const refuseFs = {
    occupant: await fileIs(k, `${ROOT}/${TAKEN_BACK}`, OCCUPIED_TEXT),
    blockedPayload: await fileIs(k, `${BIN}/${TAKEN_BACK}`, BACK_TEXT),
    blockedRecord: await statOf(k, FILES_METRICS.originRecordOf(`${BIN}/${TAKEN_BACK}`)),
  }

  proofBin(del, binRun, { afterDelete, afterRestore })
  proofRefuse(binRun, refuseFs)

  /* ---- 3: the drag ------------------------------------------------------------------------- */
  const dragRun = await driveDrag(k, host, shell)
  globalThis.M21.dragRun = dragRun
  const afterDrags = await readAfterDrags(k)
  proofDrag(dragRun, { afterDrags })

  /* ---- 4: F5 ------------------------------------------------------------------------------- */
  const refreshRun = await driveRefresh(k, host)
  globalThis.M21.refreshRun = refreshRun
  proofRefresh(refreshRun)

  globalThis.M21.fs = { afterDelete, afterRestore, refuse: refuseFs, afterDrags }

  const proofs = globalThis.M21.proofs
  const bad = Object.entries(proofs).filter(([, p]) => p && !p.ok).map(([n]) => n)
  const notDriven = Object.entries(proofs).filter(([, p]) => !p).map(([n]) => n)
  globalThis.M21.notDriven = notDriven
  globalThis.M21.verdict = (bad.length ? 'bad: ' + bad.join(', ') : 'ok')
    + (notDriven.length ? '; not driven: ' + notDriven.join(', ') : '')
  out.className = bad.length ? 'bad' : 'ok'
  say('')
  say('verdict ' + globalThis.M21.verdict)
  globalThis.M21.state = 'done'
  globalThis.M21.phase = 'rendered'
}
/* THE ENTRY POINT RUNS AT THE BOTTOM OF THIS MODULE, and that is not a style choice (constraint
 * 301).
 *
 * `main()` is called synchronously, and on the BARE URL it reaches `live()` before the first
 * `await` — so an entry point above `LIVE_PROGRAMS` hands `stageDesktop` an object literal that
 * reads that `const` while it is still in its temporal dead zone:
 * `Cannot access 'LIVE_PROGRAMS' before initialization`, in BOTH engines. That is M17's bill, paid
 * once: the registered suite loads `?proofs=1`, whose branch of `main()` touches nothing live until
 * long after the module has evaluated, so the thing a reader opens was the one path with no check
 * on it at all. */
if (requireIsolation(globalThis.M21, say, out)) {
  main().catch((e) => {
    globalThis.M21.state = 'error'
    /* THE MESSAGE AND THE STACK, in that order, because `e.stack` ALONE LOSES THE MESSAGE IN
     * FIREFOX: V8 prefixes its stack with "TypeError: ...", SpiderMonkey does not. */
    globalThis.M21.why = String(e && e.message ? `${e.message}\n${e.stack || ''}`
      : (e && e.stack) || e)
    out.className = 'bad'
    say(globalThis.M21.why)
  })
}
</script>
