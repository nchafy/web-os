      deleted: account.deleted, pasted: account.pasted, pastes: account.pastes,
      copies: account.copies, clipboard: account.clipboard,
    },
    stem: FILES_METRICS.NEW_FOLDER_STEM,
  }

  /* NEW FOLDER: A FRESH `readdir` HAS IT, AND `stat` SAYS IT IS A DIRECTORY. The count is the
   * readdir the clause names and the `stat` is what makes it the right entry — `listed` rising by
   * one is also what a `touch` would do.
   *
   * THE READDIR IS THE ONE TAKEN IMMEDIATELY AFTER THE VERB, mid-drive. An end-of-run comparison is
   * NOT this reading: the run also deletes a row, so the two cancel and the count reads 6 against 6
   * over a folder that was really created. That is what the first run of this page reported, and it
   * is `theEndListingIsWhatTheVerbsLeft` below that owns the end state. */
  verbs.theCreatedFolderIsInAFreshReaddir = Boolean(verbs.afterCreate)
    && verbs.afterCreate.exit === 0
    && verbs.afterCreate.listed === fs.before.list.listed + 1
  verbs.theCreatedFolderIsADirectory = fs.after.created.exit === 0
    && fs.after.created.type === 'directory'
  /* AND THE END LISTING IS EXACTLY WHAT THE VERBS LEFT: one folder created, one file deleted, one
   * file renamed in place — so the count comes back to where it started. The arithmetic is written
   * out because a clause reading "unchanged" would also be satisfied by a run in which neither
   * happened. */
  verbs.theEndListingIsWhatTheVerbsLeft = fs.after.list.exit === 0
    && fs.after.list.listed === fs.before.list.listed + 1 - 1
  verbs.theProgramNamedTheFolderItMade =
    sameSet(account.created, [FILES_METRICS.NEW_FOLDER_STEM])

  /* THE RENAME MOVED THE INODE. Three readings and all three are needed: the same `st_ino` under the
   * new name, a non-zero inode (so two failed `stat`s cannot agree by both being empty), and the OLD
   * NAME GONE. A copy-and-delete satisfies the third alone. */
  verbs.theRenameMovedTheInode = fs.before.renameMe.exit === 0 && fs.before.renameMe.ino !== ''
    && fs.after.renamed.exit === 0 && fs.after.renamed.ino === fs.before.renameMe.ino
  verbs.theOldNameIsGone = fs.after.renameMe.exit !== 0 && fs.after.renameMe.ino === ''
  verbs.theProgramNamedTheRename = account.renames === 1
    && account.renamed.length === 1 && account.renamed[0].from === RENAME_ME
    && account.renamed[0].to === RENAMED

  /* THE PASTE PRODUCED EQUAL BYTES. The three readings of `MARKER`'s docstring, on the source AND on
   * the paste, with the arithmetic stated there. */
  verbs.theByteCountsAgree = fs.after.source.exit === 0 && fs.after.paste.exit === 0
    && fs.after.source.bytes === MARKER_BYTES && fs.after.paste.bytes === MARKER_BYTES
  verbs.everyLineOfBothIsTheMarker =
    fs.after.sourceGrep.matched === 1 && fs.after.sourceGrep.matchExit === 0
    && fs.after.sourceGrep.unmatched === 0 && fs.after.sourceGrep.missExit === 1
    && fs.after.pasteGrep.matched === 1 && fs.after.pasteGrep.matchExit === 0
    && fs.after.pasteGrep.unmatched === 0 && fs.after.pasteGrep.missExit === 1
  /* AND THE COMPARISON CAN FAIL. The same three readings over a file whose bytes are NOT the
   * marker's: a check that reports success must be shown capable of failing, and a grep that matched
   * everything would satisfy the clause above over any two files at all. */
  verbs.theComparisonFailsOnDifferentBytes =
    fs.after.otherGrep.matched === 0 && fs.after.otherGrep.matchExit === 1
    && fs.after.otherGrep.unmatched === 1 && fs.after.other.bytes !== MARKER_BYTES
  /* AND THE PROGRAM CALLS IT A COPY AND NOT A MOVE. THE INTENT ONLY: how many landed is
   * `theRefusedPasteLandedNothing`'s, because `--paste-clobbers` moves that number and must not
   * reach a clause about Copy against Cut. A Cut pasted here would be a `rename` of the source,
   * which is a different syscall and leaves the original gone. */
  verbs.theProgramNamedThePasteAsACopy = account.pastes === 2 && account.copies === 1
    && account.cuts === 0 && account.clipboard !== null
    && account.pasted[0] !== undefined
    && account.pasted[0].name === COPY_ME && account.pasted[0].moved === false

  /* AND THE DELETE REMOVED THE ROW IT NAMED AND NOTHING ELSE. The refused one is proof 5's; this is
   * the pair that says the verb works at all — `TAKEN` gone, `FULL` still there. */
  verbs.theDeleteRemovedTheFile = fs.after.taken.exit !== 0
    && sameSet(account.deleted, [TAKEN])
  verbs.theRefusedDeleteLeftTheFolder = fs.after.full.exit === 0
    && fs.after.full.type === 'directory' && fs.after.keep.exit === 0

  verbs.ok = verbs.theCreatedFolderIsInAFreshReaddir && verbs.theCreatedFolderIsADirectory
    && verbs.theEndListingIsWhatTheVerbsLeft && verbs.theProgramNamedTheFolderItMade
    && verbs.theRenameMovedTheInode && verbs.theOldNameIsGone && verbs.theProgramNamedTheRename
    && verbs.theByteCountsAgree && verbs.everyLineOfBothIsTheMarker
    && verbs.theComparisonFailsOnDifferentBytes && verbs.theProgramNamedThePasteAsACopy
    && verbs.theDeleteRemovedTheFile && verbs.theRefusedDeleteLeftTheFolder
  globalThis.M20.proofs.verbs = { ok: verbs.ok, evidence: verbs }
  say((verbs.ok ? 'ok  ' : 'BAD ') + 'verbs: readdir ' + fs.before.list.listed + ' -> '
    + (verbs.afterCreate ? verbs.afterCreate.listed : '?') + ' after New folder -> '
    + fs.after.list.listed + ' entries; inode ' + fs.before.renameMe.ino + ' -> '
    + fs.after.renamed.ino + ' (' + RENAME_ME + ' now exit ' + fs.after.renameMe.exit + '); '
    + fs.after.source.bytes + ' bytes pasted as ' + fs.after.paste.bytes + ', '
    + fs.after.pasteGrep.matched + ' line(s) matching and ' + fs.after.pasteGrep.unmatched
    + ' not')
}

/* --------------------------------------------------------------------------------------------
   PROOF 5: EACH REFUSAL'S ERRNO, SEPARATELY.

   `docs/PLAN-SHELL.md` §M20: "Each refusal's errno is asserted separately, because a single 'it
   refused' passes for a filesystem that refused for the wrong reason — M3's `truncate` answered
   ENOENT where it owed EROFS."

   FOUR REFUSALS AND FOUR CLAUSES, three with an errno and one WITHOUT. The fourth is the one that
   makes the other three mean something: `src/bin/files.mjs`'s `refuse` writes `errno` ONLY where the
   kernel named one, so a refusal that is the program's own carries no such key at all — and a clause
   that merely checked for a truthy `errno` would pass for a program that defaulted it.

   THE EROFS ONE IS AN EDGE CASE AND NO LONGER THE DEFAULT. D40 and M19a made the session a writable
   copy of the read-only base, so there is no read-only case in the directory a reader lands in. The
   mounts are unchanged and a reader still reaches them, so the refusal is asserted where it lives —
   in a second window opened on `/usr/share` (`driveReadOnly`).
   -------------------------------------------------------------------------------------------- */
function proofRefusals (run, rofs) {
  const { account } = run
  const refusals = {
    writable: account.refusals,
    readOnly: rofs.account.refusals,
    refusalWhy: account.refusalWhy,
    readOnlyWhy: rofs.account.refusalWhy,
    readOnlyDir: rofs.account.dir,
    readOnlyMenus: rofs.account.menus,
  }

  /* THE RENAME ONTO AN OCCUPIED NAME OWES EEXIST. `rename(2)` REPLACES its destination by contract
   * (`src/fs/vfs.mjs`), so the kernel cannot refuse it and a file manager's only place to do so is
   * before the call — the errno is the program naming what the reader would otherwise have lost. */
  const occupied = refusalFor(account, TAKEN)
  refusals.theOccupiedNameSaysEEXIST = Boolean(occupied) && occupied.errno === 'EEXIST'
  /* AND THE FIELD HELD WHAT WAS TYPED BEFORE IT WAS COMMITTED, which is what says the refusal is
   * about the NAME and not about a field that never received the keys. Read off the display list:
   * the one left-aligned MONOSPACED run inside the clip is the draft (`draftOf`). */
  refusals.theFieldHeldWhatWasTyped = run.at.typedTaken.draft === TAKEN
    && run.at.typedNew.draft === RENAMED
  /* AND THE REFUSED RENAME CHANGED NOTHING. The row is still there under its old name, and the field
   * is closed — `commitRename` closes the edit before the call, whatever happens, because a reader
   * typing into a box whose last attempt they have already been told about is the defect. */
  refusals.theRefusedRenameLeftTheRow = run.at.refusedRename.names.includes(RENAME_ME)
    && run.at.refusedRename.draft === null

  /**
   * THE PASTE ONTO A NAME THE DESTINATION ALREADY HOLDS OWES EEXIST, AND IT IS THE KERNEL'S.
   *
   * THE TWO EEXISTs ARRIVE FROM OPPOSITE SIDES, which is why both are asserted. A copy opens with
   * `O_CREAT | O_EXCL` and the KERNEL answers, with no window between a test and a create; a rename
   * has no such flag — `rename(2)` REPLACES its destination by contract — so its only test is an
   * `lstat` first, which races and says so where it is written. Same errno, two mechanisms, and
   * `--paste-clobbers` removes exactly one of them.
   *
   * AND THE BYTES ARE STILL THE FIRST PASTE'S. `--paste-clobbers` is "the one world in which a
   * reader's own file is destroyed by a paste that reports success", so the clause has to say the
   * file is intact and not only that something refused.
   */
  const pasteTwice = refusalFor(account, COPY_ME)
  refusals.thePasteOntoAnOccupiedNameSaysEEXIST = Boolean(pasteTwice)
    && pasteTwice.errno === 'EEXIST'
  refusals.theRefusedPasteLandedNothing = account.pastes === 2
    && account.pasted.length === 1
    && run.at.pastedTwice.bytes.exit === 0
    && run.at.pastedTwice.bytes.bytes === MARKER_BYTES

  /* THE NON-EMPTY FOLDER OWES ENOTEMPTY. `rmdir` answers it and that is the answer the reader gets:
   * recursing on a folder somebody selected by accident is the worst outcome available here. */
  const full = refusalFor(account, FULL)
  refusals.theFullFolderSaysENOTEMPTY = Boolean(full) && full.errno === 'ENOTEMPTY'

  /* THE READ-ONLY MOUNT OWES EROFS, in its own window. The refusal is on the STEM and not on a path,
   * because that is what `newFolder` refuses by — `freeName`'s answer, which is the name the reader
   * would have seen. */
  const rofsRefusal = refusalFor(rofs.account, FILES_METRICS.NEW_FOLDER_STEM)
  refusals.theReadOnlyMountSaysEROFS = Boolean(rofsRefusal) && rofsRefusal.errno === 'EROFS'
  /* AND THE MENU WAS RAISED THERE, which is what makes the refusal a reading of the VERB rather than
   * of a gesture that never reached one. A read-only mount is still browsable (D40), so its context
   * menu is drawn like any other and only the call is refused. */
  refusals.theReadOnlyMountStillRaisedAMenu = rofs.account.menus === 1
    && rofs.account.chosen.length === 1
  /* AND NOTHING LANDED. The listing is unchanged either side of the gesture, so the refusal is not a
   * folder created and then hidden. */
  refusals.theReadOnlyMountIsUnchanged = rofs.account.created.length === 0
    && sameSet(rofs.after.names, rofs.before.names)

  /* AND THE PROGRAM'S OWN REFUSAL CARRIES NO ERRNO AT ALL. A right press on the HEADER: there is no
   * menu for a column label, and no syscall was made, so there is nothing for the kernel to have
   * named. `'errno' in entry` and not `entry.errno` — a falsy value and an absent key are the two
   * readings this clause exists to separate. */
  const headerRefusal = refusalFor(account, 'the header')
  refusals.theProgramsOwnRefusalHasNoErrno = Boolean(headerRefusal)
    && !('errno' in headerRefusal)
  /* AND IT RAISED NOTHING. `account.menus` counts the raises that reached the kernel, and a header
   * press must not be one: the count is the same before and after. */
  refusals.theHeaderRaisedNoMenu =
    run.at.header.kernel.menus === run.at.fullMenu.kernel.menus - 1
    && run.at.header.shell.popupKind === '0'

  /* AND THE SET OF REFUSALS IS EXACTLY THESE. A clause naming one refusal passes for a program that
   * also refused three things nobody asked about, which in a file manager means three verbs a reader
   * pressed and did not get. */
  refusals.nothingElseWasRefused = account.refusals.length === 4
    && rofs.account.refusals.length === 1

  refusals.ok = refusals.theOccupiedNameSaysEEXIST && refusals.theFieldHeldWhatWasTyped
    && refusals.theRefusedRenameLeftTheRow
    && refusals.thePasteOntoAnOccupiedNameSaysEEXIST && refusals.theRefusedPasteLandedNothing
    && refusals.theFullFolderSaysENOTEMPTY
    && refusals.theReadOnlyMountSaysEROFS && refusals.theReadOnlyMountStillRaisedAMenu
    && refusals.theReadOnlyMountIsUnchanged && refusals.theProgramsOwnRefusalHasNoErrno
    && refusals.theHeaderRaisedNoMenu && refusals.nothingElseWasRefused
  globalThis.M20.proofs.refusals = { ok: refusals.ok, evidence: refusals }
  say((refusals.ok ? 'ok  ' : 'BAD ') + 'refusals: '
    + account.refusals.map((r) => `${r.what}=${r.errno || 'no errno'}`).join(', ')
    + ' | /usr/share: '
    + rofs.account.refusals.map((r) => `${r.what}=${r.errno || 'no errno'}`).join(', '))
}

/* ---- staging ------------------------------------------------------------------------------- */

/** The program flags the two argv controls select, as `src/bin/files.mjs` spells them. ONE list,
 *  read by BOTH spawns: a control a page applied to one fixture and not the other is a page running
 *  two different worlds at once. */
function programFlags () {
  const flags = []
  if (CFG.menuInSurface) flags.push('--menu-in-surface')
  if (CFG.pasteClobbers) flags.push('--paste-clobbers')
  return flags
}

/** The one window the four display-list proofs drive, on the tree this page built. */
async function stage (k, host) {
  const pids = {}
  const argv = ['files', ...programFlags(), ROOT_DIR]
  pids.files = (await spawnProgram(k, FILES, argv)).pid
  if (!await surfaced(host, 'files')) throw new Error('files never surfaced')
  globalThis.M20.pids = pids
  globalThis.M20.argv = argv
  return pids
}

/** EVERY FILESYSTEM READING THE VERBS ARE ASSERTED ON, taken BEFORE the drive. The inode is the one
 *  that cannot be taken afterwards: a rename moves it, so the value it moved FROM has to be read
 *  while the old name still exists. */
async function readBefore (k) {
  return {
    list: await listCount(k, ROOT_DIR),
    renameMe: await statOf(k, `${ROOT_DIR}/${RENAME_ME}`),
    source: await byteCount(k, `${ROOT_DIR}/${COPY_ME}`),
  }
}

/** And every one taken AFTER it. `COPY_ME` is never renamed or deleted, which is why the byte
 *  comparison can be taken here rather than mid-drive. */
async function readAfter (k) {
  return {
    list: await listCount(k, ROOT_DIR),
    created: await statOf(k, `${ROOT_DIR}/${FILES_METRICS.NEW_FOLDER_STEM}`),
    renamed: await statOf(k, `${ROOT_DIR}/${RENAMED}`),
    renameMe: await statOf(k, `${ROOT_DIR}/${RENAME_ME}`),
    taken: await statOf(k, `${ROOT_DIR}/${TAKEN}`),
    full: await statOf(k, `${ROOT_DIR}/${FULL}`),
    keep: await statOf(k, `${ROOT_DIR}/${FULL}/${KEEP}`),
    source: await byteCount(k, `${ROOT_DIR}/${COPY_ME}`),
    paste: await byteCount(k, `${ROOT_DIR}/${SUB}/${COPY_ME}`),
    other: await byteCount(k, `${ROOT_DIR}/${OTHER}`),
    sourceGrep: await grepBoth(k, `${ROOT_DIR}/${COPY_ME}`, MARKER),
    pasteGrep: await grepBoth(k, `${ROOT_DIR}/${SUB}/${COPY_ME}`, MARKER),
    otherGrep: await grepBoth(k, `${ROOT_DIR}/${OTHER}`, MARKER),
  }
}

/* ---- the live desktop ---------------------------------------------------------------------- */

/**
 * THE THREE WINDOWS THE LIVE DESKTOP OPENS, as specs `www/shell.mjs` stages.
 *
 * `files` TAKES NO OPERAND, which is M19a's row and D40's answer: the program resolves
 * `std.sessionDir` for itself — the session's WRITABLE copy of the read-only base — so every verb
 * this milestone adds is reachable from the window a reader is handed. A page that pointed it at
 * `/usr/share` would be handing a reader a file manager in which New folder, Rename, Delete and
 * Paste all refuse, which is exactly the world M19a removed.
 *
 * CLEAR OF THE ICON COLUMN, because the shared staging runs the `desktop` process and that process
 * publishes rows: a window at the desktop's left edge sits on top of the icons, which is constraint
 * 289's own failure. `term` is LAST because it spawns `sh` by syscall (`PROGRAMS.term`).
 */
const LIVE_X = 120
const LIVE_PROGRAMS = [
  {
    ...PROGRAMS.files,
    name: 'files',
    box: () => ({ x: LIVE_X, y: 20, w: 620, h: 320 }),
  },
  {
    ...PROGRAMS.term,
    box: (wa) => ({ x: LIVE_X, y: 360, w: 620, h: Math.max(160, wa.h - 380) }),
  },
]

/** WHAT THIS MILESTONE ADDED, appended to the shared help. ADDED rather than substituted, so a
 *  reader here still learns what the rest of the shell does — and in a second engine this log is the
 *  only channel there is. */
const M20_HELP = [
  '  right-click a file row for Open, Cut, Copy, Delete and Rename',
  '  right-click empty space for New folder and Paste — the menu is the SHELL\'s popup,',
  '  drawn from rows the process published, so it reaches past the window\'s own edge',
  '  F2 renames in place, Delete removes, ctrl-N makes a folder, ctrl-X/C/V cut, copy, paste',
  '  Esc closes a menu, and the program is told that nothing was chosen',
  '  a delete is permanent until the Recycle Bin exists — the window says so',
]

async function live () {
  const { host, shell } = await stageDesktop({
    into: desktop,
    report: globalThis.M20,
    say,
    label: 'm20',
    tap: captureBatch,
    programs: LIVE_PROGRAMS,
    help: DESKTOP_HELP.concat(M20_HELP),
  })
  publish(host, shell)
}

/**
 * WHAT THIS PAGE PUBLISHES FOR A DRIVER THAT IS NOT THIS PAGE, whichever path built the host.
 *
 * `LAST_BATCH` is module-private and the proofs read it directly, so a driver in ANOTHER ENGINE has
 * no other route to which rows a program drew or what a rename field holds. The precedent is
 * `FILES_METRICS` and the lesson is in CLAUDE.md: a bench script's excuse for restating a program's
 * geometry was that it sits outside the process and cannot import the module, which was "true of the
 * PROCESS and false of the page it drives".
 *
 * AND THE AIM IS PUBLISHED BESIDE THE READING, which is the half M17's and M18's pages left out: a
 * second engine that can read the rows but has to compute a popup row's rect for itself is a second
 * engine with its own copy of that layout. `aimAt` hands back the VIEWPORT point, which is the only
 * unit `input.performActions` and `Input.dispatchMouseEvent` both take, and reports the reason rather
 * than throwing across the evaluate boundary: a thrown error arrives at a driver as `null`.
 */
function publish (host, shell) {
  HOST = host
  SHELL = shell
  globalThis.M20.host = host
  globalThis.M20.shell = shell
  globalThis.M20.dpr = dpr()
  globalThis.M20.viewport = { w: window.innerWidth, h: window.innerHeight }
  const frameOf = (what) => {
    for (const entry of host.frames.values()) {
      if (entry.win.titleText.includes(String(what))) return entry
    }
    return null
  }
  globalThis.M20.listState = (what) => {
    const entry = frameOf(what)
    return entry && entry.surface ? listState(entry) : null
  }
  globalThis.M20.aimAt = (what, kind, key) => {
    const entry = frameOf(what)
    if (!entry || !entry.surface) return { error: `no surfaced window named ${what}` }
    try {
      const state = listState(entry)
      if (kind === 'row') return pointAtRow(entry, state, String(key))
      if (kind === 'empty') return pointLowOnEmptySpace(entry, state, 'a driver in another engine')
      if (kind === 'header') return pointOnHeader(entry, 'a driver in another engine')
      if (kind === 'popup') {
        if (!shell) return { error: 'this page has no shell, so there is no popup' }
        return aimPopupRow(shell, String(key), 'a driver in another engine')
      }
    } catch (e) {
      return { error: String((e && e.message) || e) }
    }
    return { error: `no aim named ${kind}; row, empty, header and popup are the four` }
  }
}

async function main () {
  if (!CFG.proofs) {
    globalThis.M20.state = 'done'
    globalThis.M20.verdict = 'live'
    await live()
    return
  }

  const controls = [...programFlags(),
    ...(CFG.noMenuGuard ? ['no_menu_guard'] : []),
    ...(CFG.silentDismiss ? ['silent_dismiss'] : [])]
  say('M20 — a menu a process raises, and the mutating verbs.'
    + (controls.length ? ' CONTROL: ' + controls.join(' ') : ''))
  say('dpr ' + dpr() + ', viewport ' + window.innerWidth + 'x' + window.innerHeight + '.')
  say('Every right-click, popup click and key below is REAL input, performed by something that is')
  say('not this page: a synthesised event is isTrusted === false (175). Every verb is asserted on')
  say('the FILESYSTEM, through ls, stat, wc and grep — never on the drawing.')

  /* THE PROOFS PATH STAGES A TASKBAR, which M19's did not. `WinHost.#menu` hands its rows to
   * `this.shell.openContextMenu` and a host with no shell reports the DISMISSAL instead — so the
   * shell is the renderer under test here, not scenery. No `desktop` PROCESS is staged: the start
   * menu and the icons are its rows and no clause reads them. */
  const { k, host, shell } = await bootShell({
    into: desktop, report: globalThis.M20, say, label: 'm20', tap: captureBatch, taskbar: true,
  })
  publish(host, shell)
  globalThis.M20.kernelIsolated = true
  globalThis.M20.controlsInForce = host.report().controls

  globalThis.M20.tree = await makeTree(k)
  const t = globalThis.M20.tree
  say('staged ' + ROOT_DIR + ': rm exit ' + t.rm + ', mkdir exit ' + t.mkdir + ', touch exits '
    + t.keep + ',' + t.touch + ', echo exits ' + t.marked + ',' + t.other + ' for ' + t.rows
    + ' row(s)')
  await stage(k, host)

  const before = await readBefore(k)
  const run = await drive(k, host, shell)
  globalThis.M20.run = run

  proofMenu(run)
  proofPast(run)
  /* THE LAST THREE PROOFS NEED A ROW TO HAVE BEEN PICKED, and `--menu-in-surface` is the world
   * where none can be. `run.short` carries the reason the drive stopped (see `drive`), and these
   * stay NULL rather than being scored over gestures nobody could perform — a check whose
   * measurement does not exist must declare that, with a reason (CLAUDE.md), and the alternative
   * was a control that turned all forty-two clauses and therefore verified nothing. */
  if (!run.short) {
    const after = await readAfter(k)
    const fs = { before, after }
    globalThis.M20.fs = fs
    const rofs = await driveReadOnly(k, host, shell)
    globalThis.M20.readOnly = rofs
    proofItem(run)
    proofVerbs(run, fs)
    proofRefusals(run, rofs)
  } else {
    globalThis.M20.fs = { before, after: null }
    globalThis.M20.notes.push(`not driven: ${run.short}`)
    say('')
    say('NOT DRIVEN: item, verbs, refusals — ' + run.short)
  }

  /* THE KEYBOARD THE POPUP TOOK, SAID OUT LOUD. A popup row is a `<button>` and `closePopup` empties
   * the popup behind it, so the focus can land on whatever is left — and the rename field reads the
   * keyboard. It is a note and not a clause because the fix is in `src/wm/taskbar.mjs`, which this
   * page does not own; the number is what a reader of a failure needs. */
  const restored = run.reclaims.filter((r) => r.restored)
  if (restored.length) {
    const note = `the shell's popup took the keyboard off the window ${restored.length} time(s) `
      + `(${restored.map((r) => `${r.what}: ${r.was}`).join('; ')}); the page restored it, as `
      + '`WinHost.#surface` restores it after a resurface. A reader who chose Rename from the menu '
      + 'and then typed would type into whatever closePopup left focused.'
    globalThis.M20.notes.push(note)
    say('NOTE: ' + note)
  }

  /* THE VERDICT COUNTS WHAT RAN AND NAMES WHAT DID NOT, separately. A proof left null by
   * `run.short` is NOT a failed proof: folding the two would make `--menu-in-surface` look like a
   * control that turned five proofs when what it turned is two, which is the whole reason the drive
   * declares its own stopping point. `notDriven` is empty on every other path. */
  const proofs = globalThis.M20.proofs
  const bad = Object.entries(proofs).filter(([, p]) => p && !p.ok).map(([n]) => n)
  const notDriven = Object.entries(proofs).filter(([, p]) => !p).map(([n]) => n)
  globalThis.M20.notDriven = notDriven
  globalThis.M20.verdict = (bad.length ? 'bad: ' + bad.join(', ') : 'ok')
    + (notDriven.length ? '; not driven: ' + notDriven.join(', ') : '')
  out.className = bad.length ? 'bad' : 'ok'
  say('')
  say('verdict ' + globalThis.M20.verdict)
  globalThis.M20.state = 'done'
  globalThis.M20.phase = 'rendered'
}
/* THE ENTRY POINT RUNS AT THE BOTTOM OF THIS MODULE, and that is not a style choice (constraint
 * 301).
 *
 * `main()` is called synchronously, and on the BARE URL it reaches `live()` before the first
 * `await` — so an entry point above `LIVE_PROGRAMS` hands `stageDesktop` an object literal that
 * reads that `const` while it is still in its temporal dead zone:
 * `Cannot access 'LIVE_PROGRAMS' before initialization`, in BOTH engines. That is M17's bill, paid
 * once: the registered suite loads `?proofs=1`, whose branch of `main()` touches nothing live until
 * long after the module has evaluated, so the thing a reader opens was the one path with no check
 * on it at all.
 *
 * Below every declaration is the only position where a module's entry point cannot be in a dead
 * zone, so it is the position it keeps. */
if (requireIsolation(globalThis.M20, say, out)) {
  main().catch((e) => {
    globalThis.M20.state = 'error'
    /* THE MESSAGE AND THE STACK, in that order, because `e.stack` ALONE LOSES THE MESSAGE IN
     * FIREFOX: V8 prefixes its stack with "TypeError: ...", SpiderMonkey does not. A diagnostic
     * that works in one engine is the kind of gap CLAUDE.md records four milestones of. */
    globalThis.M20.why = String(e && e.message ? `${e.message}\n${e.stack || ''}`
      : (e && e.stack) || e)
    out.className = 'bad'
    say(globalThis.M20.why)
  })
}
</script>
