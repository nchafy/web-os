    const up = await k.expect('up', 20000)
    out.second = { mode: up.fs.mode, read: await once(k, ['cas', path + '|read'], 30000) }
  } catch (e) {
    out.second = { threw: String((e && e.message) || e) }
  } finally {
    await shut(k)
  }
  const row = out.row || {}
  const after = (out.second && out.second.read) || {}
  out.publishedSizeHeld = row.ok === true && row.nothingResurrected === true
    && row.fdSize === S && after.size === S && after.read === S
  // fsck SEES IT. The bytes are still on disk — a mount must not write — so the clause is that the
  // sweep names them as slack and counts them reclaimable, which is the arm it did not have.
  const b = (out.fsck && out.fsck.blobs) || {}
  out.fsckReportedTheSlack = Array.isArray(b.long) && b.long.length === 1
    && b.long[0].name === out.planted.name && b.long[0].want === S
    && b.long[0].have === S + CAS_SLACK && b.reclaimableBytes >= CAS_SLACK
  out.ok = out.slackOnDisk === true && out.publishedSizeHeld === true
    && out.fsckReportedTheSlack === true
  return out
}

/** Two processes, one path, two opens with no await between them. */
async function casOpens(path) {
  const out = {}
  await wipe()
  const k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { at: 'mount', mode: up.fs.mode }
    await install(k)
    const made = await once(k, ['mkfiles', '4'])
    if (!made.ok) return { at: 'mkfiles', errors: made.errors }
    const p1 = await spawnProcess(k, ['casopen', path])
    const p2 = await spawnProcess(k, ['casopen', path])
    // BOTH AT ONCE, which is the whole scenario: `runPid` awaits one `results` event and would
    // serialise them, so the two gos go out together and the rows are collected by pid.
    k.post({ t: 'go', go: { mode: 'park', pid: p1, argv: ['casopen', path] } })
    k.post({ t: 'go', go: { mode: 'park', pid: p2, argv: ['casopen', path] } })
    const a = await rowFor(k, p1, 60000, 'casopen 1')
    const b = await rowFor(k, p2, 60000, 'casopen 2')
    out.a = { ok: a.ok, at: a.at, errno: a.errno, size: a.size, close: a.close }
    out.b = { ok: b.ok, at: b.at, errno: b.errno, size: b.size, close: b.close }
    out.errors = (k.events || []).flatMap((m) => (m.t === 'io-note' && m.why ? [m.why] : []))
    out.ok = a.ok === true && b.ok === true && a.size === b.size
  } catch (e) {
    out.threw = String((e && e.message) || e)
  } finally {
    await shut(k)
  }
  return out
}

/**
 * ALL THREE SUPERBLOCK SLOTS CORRUPTED ON A NON-EMPTY VOLUME: refuse, and write nothing.
 *
 * `src/fs/fsck.mjs` returning 'refuse' is checked under Node, but the RESEED lives in the caller
 * — and the caller's refuse arm was exercised by nothing. Replacing it with the fresh-volume body
 * (seed an empty VFS, write a snapshot, mount read-write) is constraint 28's named defect and
 * webxp's exact behaviour, and it passed all three proofs and every host test.
 *
 * Three snapshots first, so all three slots hold live copies of a real volume: one or two corrupt
 * slots is the case fsck is built to SURVIVE (it falls back and says so), and corrupting all three
 * is the case constraint 28 is about. The bytes are then read back after the refused mount, because
 * "it wrote nothing" is a claim about the volume rather than about the report.
 */
async function refusedMount() {
  say('--- all three superblock slots corrupt: the mount must REFUSE and write nothing')
  await wipe()
  const k = kernelBoot(BOOT_CFG)
  let before = null
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    const made = await once(k, ['mkfiles', '8'])
    if (!made.ok) return { ok: false, evidence: { at: 'mkfiles', errors: made.errors } }
    for (let i = 0; i < SUPER_SLOTS.length; i += 1) {
      k.post({ t: 'snapshot' })
      const snap = await k.expect('snapshot', 60000)
      if (!snap.ok) return { ok: false, evidence: { at: 'snapshot', i, r: snap.r } }
    }
    // Ops AFTER the last snapshot, flushed by the idle timer, so the journal is NOT empty when
    // the volume is wrecked. A reseed truncates the journal, and against an empty one that clause
    // could not tell a refusal from a reseed.
    const extra = await once(k, ['modebits'])
    if (!extra.ok) return { ok: false, evidence: { at: 'modebits', bad: extra.bad } }
    await new Promise((r) => setTimeout(r, JOURNAL_IDLE_MS * 3))
    k.post({ t: 'fs-state' })
    before = (await k.expect('fs-state', 10000)).fs
  } finally {
    await shut(k)
  }

  // Corrupt every slot IN PLACE, keeping each file's length: a short slot would be refused by the
  // length check instead of by the magic, and this proof is about the volume's verdict rather than
  // about which guard produced it.
  const wrecked = []
  for (const name of SUPER_SLOTS) {
    let bytes = null
    try { bytes = await readRaw(name) } catch (e) { bytes = null }
    if (!bytes || bytes.length === 0) {
      wrecked.push({ name, present: false })
      continue
    }
    const junk = new Uint8Array(bytes.length).fill(0x5a)
    await writeRaw(name, junk)
    wrecked.push({ name, present: true, length: junk.length, sum: sum16(junk) })
  }
  const journalBefore = await waitForJournal()
  const blobsBefore = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()

  // The second kernel, over a volume whose every superblock slot is garbage.
  const k2 = kernelBoot(BOOT_CFG)
  let fs2 = null
  try {
    fs2 = (await k2.expect('up', 20000)).fs
  } finally {
    await shut(k2)
  }

  // Read the volume back. A reseed writes a slot and truncates the journal, so both are measured.
  const slotsAfter = []
  for (const name of SUPER_SLOTS) {
    let bytes = null
    try { bytes = await readRaw(name) } catch (e) { bytes = null }
    slotsAfter.push(bytes
      ? { name, present: true, length: bytes.length, sum: sum16(bytes) }
      : { name, present: false })
  }
  const journalAfter = await waitForJournal()
  const blobsAfter = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()

  const allThreeCorrupted = wrecked.filter((s) => s.present).length === SUPER_SLOTS.length
  const refused = !!(fs2 && fs2.mode === 'refuse')
  const slotsUnchanged = JSON.stringify(wrecked) === JSON.stringify(slotsAfter)
  const journalUnchanged = (journalBefore ? journalBefore.length : -1)
    === (journalAfter ? journalAfter.length : -2)
  const blobsUnchanged = JSON.stringify(blobsBefore) === JSON.stringify(blobsAfter)
  const wroteFalse = !!(fs2 && fs2.report && fs2.report.wrote === false)
  // A reseeded volume is a volume with one inode in it. The refusing kernel has NO tree at all,
  // which is the honest state: there is no image to read without a valid slot.
  const noInventedTree = !!(fs2 && (fs2.inodes === null || fs2.inodes === undefined))
  return {
    ok: allThreeCorrupted && refused && slotsUnchanged && journalUnchanged && blobsUnchanged
      && wroteFalse && noInventedTree,
    evidence: {
      slots: SUPER_SLOTS.length,
      inodesBefore: before && before.inodes ? before.inodes.inodes : -1,
      generationBefore: before ? before.generation : '',
      generationAfter: fs2 ? fs2.generation : '',
      slotBefore: wrecked, slotAfter: slotsAfter,
      journalBytesBefore: journalBefore ? journalBefore.length : -1,
      journalBytesAfter: journalAfter ? journalAfter.length : -1,
      blobsBefore: blobsBefore.length, blobsAfter: blobsAfter.length,
      mode: fs2 ? fs2.mode : '',
      wrote: fs2 && fs2.report ? fs2.report.wrote : null,
      problems: (fs2 && fs2.report && fs2.report.problems ? fs2.report.problems : [])
        .map((p) => p.what),
      why: (fs2 && fs2.report && fs2.report.problems ? fs2.report.problems : [])
        .map((p) => String(p.why).slice(0, 160)),
      inodesAfter: fs2 ? fs2.inodes : null,
      allThreeCorrupted, refused, slotsUnchanged, journalUnchanged, blobsUnchanged,
      wroteFalse, noInventedTree,
    },
  }
}

/**
 * A SLOT NAME TURNED INTO A DIRECTORY, which is how this page makes a slot read REFUSE against a
 * real OPFS. The kernel reads a slot with `getFileHandle(name, {create: false})`, and the File
 * System spec has that refuse a directory entry with `TypeMismatchError` — not `NotFoundError`,
 * which is the whole distinction src/kernel/iocore.mjs `readAll` keeps. No hook inside the kernel,
 * no bench flag: the volume is genuinely in a state where a slot exists and cannot be read.
 */
async function slotToDirectory(name) {
  const root = await navigator.storage.getDirectory()
  try { await root.removeEntry(name, { recursive: true }) } catch (e) { /* gone is fine */ }
  await root.getDirectoryHandle(name, { create: true })
  /* What the read actually does, read back from the page: the clause below must not pass because
   * the name was merely missing. */
  try {
    await readRaw(name)
    return 'the read SUCCEEDED'
  } catch (e) {
    return String((e && e.name) || e)
  }
}

/**
 * A SUPERBLOCK SLOT THAT CANNOT BE READ. Read-only or refuse — never a first boot.
 *
 * WHY THIS IS THE DANGEROUS ONE. A healthy volume's journal is EMPTY: the last snapshot truncates
 * it. So on a volume that has just taken a snapshot, the superblock slots are the only evidence
 * left that the volume exists at all — and an errno read as "this slot is absent" makes all of that
 * evidence vanish at once. fsck then sees no bytes anywhere, answers FRESH, and FRESH is the one
 * verdict whose caller is allowed to write: a new superblock over live blobs, mounted read-write,
 * `problems` empty. Constraint 28's named defect and webxp's exact behaviour, reached through an
 * error path instead of a bad image.
 *
 * TWO ARMS, because the honest verdict is not the same one twice:
 *
 *   ONE SLOT REFUSED   the other two still carry the volume, so it mounts READ-ONLY at the
 *                      generation they name, says which slot and why, and keeps its tree.
 *   ALL THREE REFUSED  there is no image, so REFUSE and keep every byte.
 *
 * MEASURED AGAINST THE PRE-FIX READER on this same page, which is what the clauses are sized
 * against rather than reasoning: one slot refused mounted READ-WRITE with `problems` EMPTY, and
 * all three produced a tree of ONE inode — the bare root — over a volume holding 28 inodes and 10
 * blobs, with those 10 blobs still on disk and nothing left naming them. The reseed got as far as
 * publishing that invented tree; only its superblock write was refused, because the slot name this
 * page turned into a directory is also where the new superblock was going.
 */
async function unreadableSlot() {
  say('--- a superblock slot that cannot be READ: read-only or refuse, never a first boot')
  await wipe()
  let before = null
  const k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    const made = await once(k, ['mkfiles', '8'])
    if (!made.ok) return { ok: false, evidence: { at: 'mkfiles', errors: made.errors } }
    // One snapshot per slot, so all three hold a live copy and the arm below can refuse the OLDEST
    // and still be read: a clause on the generation cannot then pass by falling back.
    for (let i = 0; i < SUPER_SLOTS.length; i += 1) {
      k.post({ t: 'snapshot' })
      const snap = await k.expect('snapshot', 60000)
      if (!snap.ok) return { ok: false, evidence: { at: 'snapshot', i, r: snap.r } }
    }
    k.post({ t: 'fs-state' })
    before = (await k.expect('fs-state', 10000)).fs
  } finally {
    await shut(k)
  }

  const journalBefore = await waitForJournal()
  const blobsBefore = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()
  const oldest = SUPER_SLOTS[(before.slot + 1) % SUPER_SLOTS.length]
  const refusedWith = await slotToDirectory(oldest)

  const k2 = kernelBoot(BOOT_CFG)
  let one = null
  try {
    one = (await k2.expect('up', 20000)).fs
  } finally {
    await shut(k2)
  }
  const journalAfterOne = await waitForJournal()
  const blobsAfterOne = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()

  // Now every slot. The journal is still empty, so this is the shape that used to read as a volume
  // nobody had ever written.
  for (const name of SUPER_SLOTS) await slotToDirectory(name)
  const k3 = kernelBoot(BOOT_CFG)
  let all = null
  try {
    all = (await k3.expect('up', 20000)).fs
  } finally {
    await shut(k3)
  }
  const journalAfterAll = await waitForJournal()
  const blobsAfterAll = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()

  const named = (fs) => (fs && fs.report && fs.report.problems ? fs.report.problems : []).some(
    (p) => p.what === 'superblock' && /could not be READ/.test(String(p.why)))
  // THE ANTI-VACUITY CLAUSE, and it carries the whole scenario: an absent slot is a different
  // volume, and a read that came back NotFoundError would be testing that other volume.
  const readRefusedNotAbsent = refusedWith !== 'the read SUCCEEDED'
    && refusedWith !== 'NotFoundError'
  const journalWasEmpty = !!journalBefore && journalBefore.length === 0
  const oneReadOnly = !!(one && one.mode === 'ro' && one.readOnly === true)
  const oneSameGeneration = !!(one && before && one.generation === before.generation)
  const oneKeptItsTree = !!(one && one.inodes && before && before.inodes
    && one.inodes.inodes === before.inodes.inodes)
  const allRefused = !!(all && all.mode === 'refuse')
  const allInventedNothing = !!(all && (all.inodes === null || all.inodes === undefined))
  const wroteNothing = !!(one && one.report && one.report.wrote === false)
    && !!(all && all.report && all.report.wrote === false)
  const blobsUntouched = JSON.stringify(blobsBefore) === JSON.stringify(blobsAfterOne)
    && JSON.stringify(blobsBefore) === JSON.stringify(blobsAfterAll)
  const journalUntouched = (journalAfterOne ? journalAfterOne.length : -1) === 0
    && (journalAfterAll ? journalAfterAll.length : -1) === 0

  return {
    ok: readRefusedNotAbsent && journalWasEmpty && oneReadOnly && oneSameGeneration
      && oneKeptItsTree && named(one) && allRefused && allInventedNothing && named(all)
      && wroteNothing && blobsUntouched && journalUntouched,
    evidence: {
      refusedWith,
      oldest,
      generationBefore: before ? before.generation : '',
      generationOne: one ? one.generation : '',
      modeBefore: before ? before.mode : '',
      modeOne: one ? one.mode : '',
      modeAll: all ? all.mode : '',
      inodesBefore: before && before.inodes ? before.inodes.inodes : -1,
      inodesOne: one && one.inodes ? one.inodes.inodes : -1,
      inodesAll: all ? all.inodes : null,
      journalBytesBefore: journalBefore ? journalBefore.length : -1,
      journalBytesOne: journalAfterOne ? journalAfterOne.length : -1,
      journalBytesAll: journalAfterAll ? journalAfterAll.length : -1,
      blobsBefore: blobsBefore.length,
      blobsAfterOne: blobsAfterOne.length,
      blobsAfterAll: blobsAfterAll.length,
      problemsOne: (one && one.report && one.report.problems ? one.report.problems : [])
        .map((p) => p.what),
      problemsAll: (all && all.report && all.report.problems ? all.report.problems : [])
        .map((p) => p.what),
      whyOne: (one && one.report && one.report.problems ? one.report.problems : [])
        .map((p) => String(p.why).slice(0, 200)),
      whyAll: (all && all.report && all.report.problems ? all.report.problems : [])
        .map((p) => String(p.why).slice(0, 200)),
      unreadableSlotsOne: one && one.report && one.report.superblock
        ? one.report.superblock.unreadableSlots : -1,
      readRefusedNotAbsent, journalWasEmpty, oneReadOnly, oneSameGeneration, oneKeptItsTree,
      allRefused, allInventedNothing, wroteNothing, blobsUntouched, journalUntouched,
    },
  }
}

/**
 * THE WRITE ORDERING, MEASURED, and the directory-handle budget with it.
 *
 * Constraint 23's ordering is blob -> flush -> journal -> flush -> apply, and it was asserted by
 * nothing: swapping the commit to journal-then-blob-flush passed every proof. The honest reason
 * is recorded in the no-cow-order control — an in-session read cannot see an unflushed write,
 * because `flush()` buys durability past a process death and not visibility — but the conclusion
 * drawn from it was too weak. THE ORDER IS OBSERVABLE WITHOUT A CRASH: the storage edge records
 * the sequence of operations it performed, and for a commit the blob's flush must carry a lower
 * sequence number than the journal append that points at it.
 *
 * Constraint 24 rides along on the same read. `getDirectoryHandle` is 85 us per component, and
 * this kernel's claim is stronger than "few": ONE for the life of the module, because path
 * resolution runs over the in-memory inode tree and a blob is one flat name. Structurally sound
 * is not the same as checked.
 */
/* O_APPEND's file. One directory level under the tree `setup` hands to the user. */
const APPENDED = '/d/0/appended'

/**
 * O_APPEND, WHICH IS AN OFFSET PER WRITE AND NOT A SEEK AT OPEN.
 *
 * One process, four calls, nothing concurrent: an 8-byte file, two descriptions opened for append,
 * one 4-byte write and one fsync through each. POSIX puts both ranges in the file. Read once at
 * open — which is what `calls.mjs` used to do — both descriptions get the same end, the second
 * writes over the first, and every call returns success: 12 bytes where 16 were acknowledged, with
 * an explicit fsck reporting the volume clean. That last part is why this is a section and not a
 * row in `apicheck`: the failure is silent, so the clause has to read the BYTES back.
 */
async function appendPerWrite() {
  say('--- O_APPEND: two appending descriptions, and the bytes of both')
  await wipe()
  const k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    const row = await once(k, ['append', APPENDED], 60000)
    k.post({ t: 'fsck' })
    const ck = await k.expect('fsck', 30000).catch(() => null)
    const report = ck && ck.report ? ck.report : null
    const clean = !!(report && report.mountable === 'rw'
      && (report.problems || []).length === 0)
    return {
      ok: !!(row && row.ok && clean),
      evidence: {
        acknowledged: row && row.acknowledged === true,
        bothRangesSurvived: row && row.whole === true,
        size: row && row.size, wantSize: row && row.wantSize,
        wrote: row && row.wrote, synced: row && row.synced,
        got: row && row.got, want: row && row.want,
        at: row && row.at, errno: row && row.errno,
        clean,
        fsck: report
          ? { mountable: report.mountable, problems: (report.problems || []).map((p) => p.what),
              blobs: report.blobs }
          : null,
      },
    }
  } finally {
    await shut(k)
  }
}

async function ordering() {
  say('--- the write ordering, measured: the blob flush precedes the journal append')
  await wipe()
  const k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    // Four files, each opened, written once, fsynced and closed. The clause below reads the LAST
    // commit's entries, so what matters is that nothing else is running: the trace is this
    // kernel's whole storage history.
    const made = await once(k, ['mkfiles', '4'])
    if (!made.ok) return { ok: false, evidence: { at: 'mkfiles', errors: made.errors } }
    k.post({ t: 'io-stats' })
    const got = await k.expect('io-stats', 10000)
    const io = (got && got.io) || {}
    const trace = io.trace || []
    const counts = io.counts || {}

    const lastWrite = lastEntry(trace, (e) => e.op === 'write')
    const flush = lastWrite ? firstAfter(trace, lastWrite.n, (e) => e.op === 'flush') : null
    const append = lastWrite
      ? firstAfter(trace, lastWrite.n, (e) => e.op === 'journal-append') : null
    const jflush = append ? firstAfter(trace, append.n, (e) => e.op === 'journal-flush') : null
    const ordered = !!(lastWrite && flush && append && jflush
      && flush.n > lastWrite.n && append.n > flush.n && jflush.n > append.n)
    // The thing flushed must be the BLOB, not the journal: a trace that proved an ordering
    // between two journal operations would prove nothing about the data.
    const flushedBlob = !!(flush && /^\d+\.\d+$/.test(flush.name))
    const oneDirectoryHandle = counts.getDirectoryHandle === 1 && (counts.opens || 0) >= 4
    return {
      ok: ordered && flushedBlob && oneDirectoryHandle,
      evidence: {
        ordered, flushedBlob, oneDirectoryHandle,
        commit: {
          write: lastWrite, blobFlush: flush, journalAppend: append, journalFlush: jflush,
        },
        counts, traced: io.traced, dropped: io.dropped,
        handles: io.handles, names: io.names, pendingFree: io.pendingFree,
        // The tail itself, so a failure says what the edge actually did.
        tail: trace.slice(-10).map((e) => e.n + ':' + e.op + (e.name ? ' ' + e.name : '')),
      },
    }
  } finally {
    await shut(k)
  }
}

/** The last trace entry matching a predicate, and the first one after a sequence number. The
 *  trace is a ring, so `n` is the ordering and an index into the array is not. */
function lastEntry(trace, pick) {
  for (let i = trace.length - 1; i >= 0; i -= 1) if (pick(trace[i])) return trace[i]
  return null
}

function firstAfter(trace, n, pick) {
  for (const e of trace) if (e.n > n && pick(e)) return e
  return null
}

/** A cheap byte sum, for "these bytes are the bytes I left there". Not a checksum with a claim —
 *  the length is compared beside it, and the volume is a few kilobytes. */
function sum16(bytes) {
  let s = 0
  for (let i = 0; i < bytes.length; i += 1) s = (s + bytes[i] * (1 + (i & 7))) & 0xffff
  return s
}

/**
 * The rest of the ABI, exercised once each.
 *
 * NOT a fourth proof — the milestone owes three — but a call the suite never issues is a call
 * nobody has shown works. The three proofs reach twelve of the thirty-nine syscalls; this reaches
 * the others: pread not moving the cursor, dup sharing a description, readdir's cookie,
 * ftruncate's copy-up, rename's bookkeeping, statfs, and nine refusals including the two that make
 * constraint 29's credential mean something (mkdir in a root this uid does not own, and a chown
 * away from one's own uid).
 */
async function apiSurface() {
  say('--- the rest of the ABI: one call each, as uid ' + USER)
  await wipe()
  const k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    const row = await once(k, ['apicheck'], 60000)
    return { ok: row.ok === true, evidence: { calls: row.calls, bad: row.bad, rows: row.rows } }
  } finally {
    await shut(k)
  }
}

/**
 * THE DROP SECTION: what `close()` reports, and what it leaves behind.
 *
 * Four routes through one question — does a description's last act tell the truth about the bytes
 * it was holding — and each one was a separate silent loss.
 *
 * (1) THE ACKNOWLEDGED APPEND. B appends four bytes AT the committed size: `pwrite` returns 4 and
 *     B's own `fstat` reports the longer file, so the caller has been told twice. A then writes
 *     BELOW the committed size and fsyncs, which stages a generation and swings. B closes.
 *     Measured against the old code: `close()` returned 0, a fresh open reported the ORIGINAL
 *     size, the four bytes were gone, and the explicit fsck afterwards came back `rw` with no
 *     problems — because the blob's length matched the size the metadata published. The cause was
 *     in the copy: it asked for the COPYING description's view of the length while the shared blob
 *     was physically longer, so the swing published a generation B's bytes were not in.
 *
 * (2) THE REFUSED COMMIT. The same shape reached through `ftruncate` instead: fd1 grows the file
 *     and stages a generation, fd2 writes below and swings PAST it, and fd1's commit then names a
 *     generation the VFS has superseded. Refusing is correct. Reporting 0 from `close()` for it is
 *     not, and neither is leaving the staged blob on disk for the life of the volume.
 *
 * (3) UNLINK UNDER AN OPEN DESCRIPTION. M2 does not implement POSIX's "the file lives until the
 *     last descriptor closes" — that needs an orphan table in the VFS and a journal that can
 *     replay one — so it REFUSES, and the clause is that it refuses CONSISTENTLY. The old mix of
 *     working reads and -EIO writes was the worst of both. The blob's directory entry still
 *     survives until the last close, which is where the DEFERRED free is now reachable.
 *
 * (4) THE CALLER THAT CANNOT READ A RETURN VALUE. A writer is KILLED holding a staged generation
 *     while a second writer contends on the same inode, twelve times, each with its own byte.
 *     Teardown closes the fd and `closeFd` commits, and teardown cannot await — so the errno has
 *     nowhere to go and the NOTE is the only report. Measured unserialized: 3 of 12 acknowledged
 *     writes destroyed, the volume clean afterwards, every one of them named in a note that
 *     nothing asserted on. This route asserts the kernel's note COUNT, which is what makes the
 *     channel a report rather than a log line.
 */
async function dropAndClose() {
  say('--- drop: what close() reports, and what it leaves behind')
  const path = pathFor(TWO_WRITERS.index)
  const size0 = bytesFor(TWO_WRITERS.index).length
  const evidence = { path, size0, plan: { ...DROP_APPEND, grow: DROP_GROW,
    below: TWO_WRITERS.bLen, belowByte: TWO_WRITERS.bByte } }

  /* ---- route 1: the acknowledged append, on its own volume ---- */
  await wipe()
  let k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') return { ok: false, evidence: { at: 'mount', mode: up.fs.mode } }
    await install(k)
    const made = await once(k, ['mkfiles', '4'])
    if (!made.ok) return { ok: false, evidence: { at: 'mkfiles', errors: made.errors } }

    const a = await spawnProcess(k, ['wopen', path])
    const b = await spawnProcess(k, ['wopen', path])
    const openA = await runPid(k, a, 30000, 'wopen A')
    const openB = await runPid(k, b, 30000, 'wopen B')
    // B's append. Acknowledged twice: the count, and B's own fstat.
    const tail = await runPid(k, b, 30000, 'wtail B', ['wtail'])
    // A writes below the committed size and fsyncs: a copy-up and a SWING.
    const below = await runPid(k, a, 30000, 'wbelow A', ['wbelow'])
    // THE CLOSE. Its return value is the clause.
    const closeB = await runPid(k, b, 30000, 'wclose B', ['wclose'])
    const closeA = await runPid(k, a, 30000, 'wclose A', ['wclose'])
    const seen = await once(k, ['dcheck', path], 30000)
    k.post({ t: 'fsck' })
    const ck = await k.expect('fsck', 30000).catch(() => null)
    evidence.append = {
      openA: { ok: openA.ok, size: openA.size }, openB: { ok: openB.ok, size: openB.size },
      tail: { ok: tail.ok, at: tail.at, wrote: tail.wrote, want: tail.want,
        fdSize: tail.fdSize, wantFdSize: tail.wantFdSize },
      below: { ok: below.ok, publishedSize: below.publishedSize },
      closeB: closeB.close, closeA: closeA.close,
      check: { ok: seen.ok, size: seen.size, wantSize: seen.wantSize, belowOk: seen.belowOk,
        tailOk: seen.tailOk, atS: seen.atS, wantAtS: seen.wantAtS },
      fsck: ck && ck.report
        ? { mountable: ck.report.mountable, problems: (ck.report.problems || []).map((x) => x.what) }
        : null,
      blobs: (await listBlobs()).map((x) => x.name + ':' + x.size).sort(),
    }
    evidence.acknowledged = tail.ok === true && tail.wrote === DROP_APPEND.len
      && tail.fdSize === tail.wantFdSize
    evidence.closeReportedSuccess = closeB.close === 0 && closeA.close === 0
    evidence.acknowledgedBytesKept = seen.ok === true
      && seen.size === size0 + DROP_APPEND.len && seen.atS === DROP_APPEND.byte
    evidence.volumeStillClean = !!(ck && ck.report && ck.report.mountable === 'rw'
      && (ck.report.problems || []).length === 0)
  } catch (e) {
    evidence.threw = String((e && e.message) || e)
  } finally {
    await shut(k)
  }

  /* ---- route 2: a staged grow another description's swing superseded ---- */
  await wipe()
  k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') { evidence.refused = { at: 'mount', mode: up.fs.mode } } else {
      await install(k)
      const made = await once(k, ['mkfiles', '4'])
      if (!made.ok) { evidence.refused = { at: 'mkfiles', errors: made.errors } } else {
        const c = await spawnProcess(k, ['wopen', path])
        const e2 = await spawnProcess(k, ['wopen', path])
        await runPid(k, c, 30000, 'wopen C')
        await runPid(k, e2, 30000, 'wopen E')
        const blobsBefore = (await listBlobs()).map((x) => x.name).sort()
        const grown = await runPid(k, c, 30000, 'wstage C', ['wstage'])
        const swung = await runPid(k, e2, 30000, 'wbelow E', ['wbelow'])
        // C's staged generation was copied from a base E has since superseded. The commit's
        // compare-and-swap must notice, re-stage onto E's generation and replay C's own
        // modification — so BOTH acknowledged changes survive and neither close reports a loss.
        const closeC = await runPid(k, c, 30000, 'wclose C', ['wclose'])
        const closeE = await runPid(k, e2, 30000, 'wclose E', ['wclose'])
        k.post({ t: 'fs-state' })
        const st = (await k.expect('fs-state', 10000)).fs
        const blobs = (await listBlobs()).map((x) => x.name + ':' + x.size).sort()
        const merged = await once(k, ['gcheck', path], 30000)
        evidence.refused = {
          grown: { ok: grown.ok, ftruncate: grown.ftruncate, want: grown.want,
            fdSize: grown.fdSize },
          swung: { ok: swung.ok, publishedSize: swung.publishedSize },
          closeC: closeC.close, closeE: closeE.close, merged,
          casRefusals: st.stats.casRefusals, restages: st.stats.restages,
          casExhausted: st.stats.casExhausted, refusedCommits: st.stats.refusedCommits,
          blobsBefore, blobs,
        }
        // THE GROW AND THE WRITE BOTH SURVIVED. `ftruncate` returned 0 and E's `fsync` returned
        // 0, so POSIX has a 72-byte file with E's bytes at the head and zeroes above the original
        // length. Against the old code the grow was discarded entirely and `close` reported the
        // loss — correct for a commit that could not be published, and the loss itself was the
        // defect: the base had moved and nothing re-derived the staged generation from it.
        evidence.bothChangesSurvived = merged.ok === true
          && st.stats.casRefusals > 0 && st.stats.restages > 0 && st.stats.casExhausted === 0
          && closeC.close === 0 && closeE.close === 0
        // STILL ONE GENERATION PER FILE. The count comes from the directory BEFORE the attack
        // rather than from a literal, so a change to how many files `setup` and `mkfiles` leave
        // cannot make this pass by arithmetic. A re-stage opens a second staged blob and must free
        // the one it replaced; leaking it would show up here.
        evidence.noStagedBlobLeft = blobs.length === blobsBefore.length
      }
    }
  } catch (e) {
    evidence.refusedThrew = String((e && e.message) || e)
  } finally {
    await shut(k)
  }

  /* ---- route 3: unlink under an open description ---- */
  await wipe()
  k = kernelBoot(BOOT_CFG)
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') { evidence.unlinked = { at: 'mount', mode: up.fs.mode } } else {
      await install(k)
      const made = await once(k, ['mkfiles', '4'])
      if (!made.ok) { evidence.unlinked = { at: 'mkfiles', errors: made.errors } } else {
        const u = await spawnProcess(k, ['wopen', path])
        const openU = await runPid(k, u, 30000, 'wopen U')
        const before = (await listBlobs()).map((x) => x.name).sort()
        const row = await runPid(k, u, 30000, 'wunlink U', ['wunlink', path])
        // STILL ON DISK, because the description still holds a reference: this is the deferred
        // free, and it is reachable here and nowhere else now that a reader follows a swing.
        const during = (await listBlobs()).map((x) => x.name).sort()
        k.post({ t: 'fs-state' })
        const st = (await k.expect('fs-state', 10000)).fs
        const closeU = await runPid(k, u, 30000, 'wclose U', ['wclose'])
        const after = (await listBlobs()).map((x) => x.name).sort()
        const gone = before.filter((n) => !during.includes(n))
        evidence.unlinked = {
          openSize: openU.size, row, closeU: closeU.close,
          deferredFrees: st.stats.deferredFrees,
          blobsBefore: before, blobsDuring: during, blobsAfter: after,
        }
        // CONSISTENTLY REFUSED: every operation on the fd failed, and all under one errno.
        const codes = row.errnos || []
        evidence.refusedConsistently = row.ok === true && codes.length === 5
          && new Set(codes).size === 1
        // The blob outlived the unlink and went with the last close.
        evidence.blobOutlivedTheUnlink = gone.length === 0 && st.stats.deferredFrees > 0
          && during.length === before.length && after.length === before.length - 1
        evidence.closeAfterUnlinkSucceeded = closeU.close === 0
      }
    }
  } catch (e) {
    evidence.unlinkedThrew = String((e && e.message) || e)
  } finally {
    await shut(k)
  }

  /* ---- route 4: a writer KILLED holding a staged generation, against a contender ----
   *
   * THE ONE CALLER THAT CANNOT READ A RETURN VALUE. A process's teardown closes its fds
   * synchronously — it cannot await, because the pid's ~2 s quarantine is what gives the commit
   * time to land (constraint 14) — so `closeFd`'s errno has nowhere to go and the note channel is
   * the only report. Measured against the unserialized kernel: 3 of 12 rounds destroyed a 4-byte
   * write that `pwrite` had acknowledged, the volume came back clean, and the only trace was
   * `close of inode 22 could not publish its write: errno 8` in a log nothing asserted on.
   *
   * SO THIS ROUTE ASSERTS THE NOTE COUNT, which is why the kernel counts notes at all. Nothing
   * here may be refused: the victim's range is disjoint from the contender's, the contender is a
   * live process whose every call must succeed, and a note would mean one of them was turned away.
   */
  await wipe()
  k = kernelBoot(BOOT_CFG)
  const kills = []
  try {
    const up = await k.expect('up', 20000)
    if (up.fs.mode !== 'rw') { evidence.killed = { at: 'mount', mode: up.fs.mode } } else {
      await install(k)
      const made = await once(k, ['mkfiles', '4'])
      if (!made.ok) { evidence.killed = { at: 'mkfiles', errors: made.errors } } else {
        const spec = path + '|' + KILLED.hamRounds
        for (let r = 0; r < KILLED.rounds; r += 1) {
          const value = KILLED.values[r]
          const victim = await spawnProcess(k, ['kstage', path + '|' + value])
          const ham = await spawnProcess(k, ['kham', spec])
          // The contender is released FIRST and is not awaited, so the victim's stage and its kill
          // land inside the contender's loop. Rows are collected by pid because both are running.
          k.post({ t: 'go', go: { mode: 'park', pid: ham, argv: ['kham', spec] } })
          k.post({ t: 'go', go: { mode: 'park', pid: victim, argv: ['kstage', path + '|' + value] } })
          const stage = await rowFor(k, victim, 60000, 'kstage')
          // KILLED, holding the staged generation.
          k.post({ t: 'end-process', pid: victim })
          const hamRow = await rowFor(k, ham, 300000, 'kham')
          const after = await onceByPid(k, ['kread', path], 60000)
          kills.push({ r, value, wrote: stage.wrote,
            at0: after.at0, atVictim: after.atVictim, size: after.size,
            survived: after.atVictim === value,
            hamWrote: hamRow.wrote, hamSynced: hamRow.synced,
            hamWriteErrs: hamRow.writeErrs, hamSyncErrs: hamRow.syncErrs })
        }
        k.post({ t: 'fs-state' })
        const st = (await k.expect('fs-state', 10000)).fs
        k.post({ t: 'fsck' })
        const ck = await k.expect('fsck', 30000).catch(() => null)
        const acknowledged = kills.filter((x) => x.wrote === KILLED.len).length
        const vanished = kills.filter((x) => x.wrote === KILLED.len && x.survived !== true)
        evidence.killed = {
          rounds: KILLED.rounds, acknowledged, vanished: vanished.length, vanishedRounds: vanished,
          liveFdErrs: kills.flatMap((x) => [...(x.hamWriteErrs || []), ...(x.hamSyncErrs || [])]),
          // THE KERNEL'S OWN COUNT, not the page's collection of strings: one number, counted at
          // the single exit every note leaves through.
          notes: st.notes, noteTexts: st.noteTexts,
          stats: st.stats,
          fsck: ck && ck.report
            ? { mountable: ck.report.mountable,
                problems: (ck.report.problems || []).map((x) => x.what) }
            : null,
        }
        // EVERY ACKNOWLEDGED WRITE IS STILL THERE, and all twelve were acknowledged. Both halves:
        // a round whose `pwrite` failed would otherwise make this pass by writing nothing.
        evidence.killedWriterKeptEveryByte = acknowledged === KILLED.rounds
          && vanished.length === 0
        // AND NOTHING WAS REFUSED. The note count is zero and no call on the contender's live fd
        // returned an errno.
        evidence.killedWriterLeftNothingUnpublished = st.notes === 0
          && evidence.killed.liveFdErrs.length === 0
        evidence.killedVolumeClean = !!(ck && ck.report && ck.report.mountable === 'rw'
          && (ck.report.problems || []).length === 0)
      }
    }
  } catch (e) {
    evidence.killedThrew = String((e && e.message) || e)
  } finally {
    await shut(k)
  }

  return {
    ok: evidence.acknowledged === true && evidence.closeReportedSuccess === true
      && evidence.acknowledgedBytesKept === true && evidence.volumeStillClean === true
      && evidence.bothChangesSurvived === true && evidence.noStagedBlobLeft === true
      && evidence.refusedConsistently === true && evidence.blobOutlivedTheUnlink === true
      && evidence.closeAfterUnlinkSucceeded === true
      && evidence.killedWriterKeptEveryByte === true
      && evidence.killedWriterLeftNothingUnpublished === true
      && evidence.killedVolumeClean === true,
    evidence,
  }
}

async function main() {
  const pre = await globalThis.__m2Preflight
  if (!pre.ok) throw new Error(globalThis.M2.why)
  globalThis.M2.pageFingerprint = ABI_FINGERPRINT
  globalThis.M2.config = {
    bootLockBudgetMs: BOOT_LOCK_BUDGET_MS,
    journalIdleMs: JOURNAL_IDLE_MS,
    superSlots: SUPER_SLOTS.length,
    noCowOrder: BOOT_CFG.noCowOrder,
    noCrc: BOOT_CFG.noCrc,
    files: num('a_n', 10000),
  }

  /* Each proof boots its own kernels so one cannot carry state into another, and each wipes the
   * OPFS first so a previous run's files cannot make a proof pass by accident. */
  for (const [name, fn] of [['proof_a', proof_a], ['proof_b', proof_b], ['proof_c', proof_c],
    ['proof_d', proof_d], ['pending', pendingAppend], ['drop', dropAndClose],
    ['cas', casCommit], ['orphan', orphanedGeneration],
    ['refuse', refusedMount], ['unreadable', unreadableSlot], ['append', appendPerWrite],
    ['order', ordering], ['api', apiSurface]]) {
    globalThis.M2.proofs[name] = await fn()
    const p = globalThis.M2.proofs[name]
    say(name.replace('_', ' (') + ') ' + (p.ok ? 'ok' : 'FAIL') + ': ' +
      JSON.stringify(p.evidence))
  }

  const allOk = Object.values(globalThis.M2.proofs).every((p) => p && p.ok)
  globalThis.M2.verdict = allOk ? 'ok' : 'FAIL'
  globalThis.M2.state = 'done'
  if (allOk) out.className = 'ok'
  say('verdict: ' + globalThis.M2.verdict)
}
