  // THE WARM-UP, AND THE BASELINE AFTER IT. See this proof's header.
  await gesture(entry, { kind: 'hover', name: 'warm-up-hover', at: aim(0) },
    { wantRepaint: false })
  const geomsBefore = host.report().geoms
  const before = await kernelWin(k, entry.id)
  if (!before) throw new Error(`the kernel has no window ${entry.id} to measure`)
  const hostBefore = hostCounts(host)

  const preStreamMs = performance.now() - spawnedAt
  /* THE STREAM ASKS AND DOES NOT SETTLE, which is a deliberate departure from every other gesture
   * on this page and the one place the difference matters. `gesture`'s 600 ms settle exists so a
   * step can READ the consequence of the gesture it just asked for; here there is nothing to read
   * until the whole stream is in, and settling per sample made the stream outlast its own fixture
   * (see `HOLD_MS`). ONE settle follows the loop, before the counters are read. */
  const t0 = performance.now()
  for (let i = 1; i <= HOVER_SAMPLES; i += 1) {
    await ask({ kind: 'hover', name: `hover-sample-${i}`, at: aim(i) })
  }
  const streamMs = performance.now() - t0
  // THE LAST SAMPLE STILL HAS TO CROSS THE KERNEL before its counters are read, and nothing
  // repaints to say so: a held program draws nothing.
  await pause(600)
  const after = await kernelWin(k, entry.id)
  const hostAfter = hostCounts(host)
  const delta = {
    queued: (after.queued | 0) - (before.queued | 0),
    coalesced: (after.coalesced | 0) - (before.coalesced | 0),
    dropped: (after.dropped | 0) - (before.dropped | 0),
    delivered: (after.delivered | 0) - (before.delivered | 0),
    leaves: (after.leaves | 0) - (before.leaves | 0),
    geoms: hostAfter.geoms - geomsBefore,
    hovers: hostAfter.hovers - hostBefore.hovers,
    dragAts: hostAfter.dragAts - hostBefore.dragAts,
  }

  /* `/proc`, WHILE THE PROGRAM IS STILL NOT DRAINING. The patterns are built from the numbers the
   * kernel just reported, so a line that merely EXISTS does not satisfy them — `grep -c` with a
   * FIXED string (constraint 138) and its exit status is the answer. This is what ties the page's
   * reading to the one a person has at a prompt. */
  const path = `/proc/${held.pid}/win/${entry.id}`
  const greps = {}
  for (const [name, value] of [['queued', after.queued | 0], ['coalesced', after.coalesced | 0],
    ['dropped', after.dropped | 0], ['leaves', after.leaves | 0]]) {
    greps[name] = await grepFor(k, path, `${name}:\t${value}`)
  }

  /* NOW LET THE HOLD EXPIRE AND THE PROGRAM DRAIN, so its account can be collected. One repaint
   * after the hold is the whole stream landing: the queue holds one merged hover record, so the
   * program reads one position and lights one row. */
  const had = BATCHES.get(entry.id) || 0
  const drainedMs = await until(() => (BATCHES.get(entry.id) || 0) > had, HOLD_MS + 8000)
  const heldAccount = accountOf(await quitAndReport(k, entry, held.pid))

  const hover = {
    pid: held.pid, win: entry.id, path, argv,
    samples: HOVER_SAMPLES, queueCap: WIN_EVENT_CAP,
    holdMs: HOLD_MS, preStreamMs: Math.round(preStreamMs), streamMs: Math.round(streamMs),
    quietMs: Math.round(quietMs), drainedMs: Math.round(drainedMs),
    before: { queued: before.queued, coalesced: before.coalesced, dropped: before.dropped,
      leaves: before.leaves },
    after: { queued: after.queued, coalesced: after.coalesced, dropped: after.dropped,
      leaves: after.leaves, pending: after.pending, parked: after.parked },
    delta,
    greps,
    held: heldAccount,
    // The LIGHT half, as `drive` recorded it off the draining window.
    lit: {
      before: at.reversed.lit,
      first: { row: at.litA.lit, cursor: at.litA.cursor, selected: at.litA.selected },
      second: { row: at.litB.lit, cursor: at.litB.cursor, selected: at.litB.selected },
      afterLeave: at.left.lit,
      hostHovers: at.litB.host.hovers - at.reversed.host.hovers,
      hostLeaves: at.left.host.leaves - at.litB.host.leaves,
      hostDragAts: at.left.host.dragAts - at.reversed.host.dragAts,
      account: run.account,
    },
  }

  /* ---- THE LIGHT ------------------------------------------------------------------------- */
  /* NOTHING WAS LIT BEFORE THE HOVER, which is what makes the next clause about the move. A header
   * press clears the light, and the two header clicks are what came before. */
  hover.nothingWasLitBeforeTheHover = at.reversed.lit === null
  /* THE FIRST MOVE LIT A ROW AND THE SECOND MOVED THE LIGHT. The pair, because one lit row is also
   * what a program that lit a row at startup looks like — and the rows are named, so a light that
   * stayed put is visible as the same name twice. */
  hover.aButtonlessMoveLitTheRow = at.litA.lit === at.reversed.names[2]
    && at.litA.litCount === 1
  hover.aSecondMoveMovedTheLight = at.litB.lit === at.reversed.names[0]
    && at.litB.litCount === 1 && at.litB.lit !== at.litA.lit
  /* AND IT MOVED NOTHING ELSE. A hover is not a press: the selection and the keyboard cursor are
   * where the earlier gestures left them, which is why the light is a fill under the row's text and
   * not a change of its ink. */
  hover.theLightIsNotASelection = at.litA.selected.length === 0 && at.litB.selected.length === 0
    && at.litA.cursor === at.reversed.cursor && at.litB.cursor === at.reversed.cursor
  /* THE PAGE SENT EXACTLY TWO HOVERS AND NOT ONE DRAG POSITION. `#dragMove` seeing a buttonless
   * sample would post a drag position for a gesture nobody started, and `dragAts` is the counter
   * that says it did not. */
  hover.theHoversWereSentAsHovers = hover.lit.hostHovers === 2 && hover.lit.hostDragAts === 0
  /* THE POINTER LEFT AND THE LIGHT WENT OUT. One leave for one exit, and the light cleared rather
   * than moved: `WPTR_LEAVE` carries no usable position, so a program that hit-tested it would light
   * whatever row row 0 happens to be. */
  hover.theLeaveClearedTheLight = at.left.lit === null && hover.lit.hostLeaves === 1
  /* AND THE PROGRAM COUNTED BOTH KINDS SEPARATELY. `hovers` against `leaves` in its own account is
   * what separates "a record arrived" from "the right record arrived". */
  hover.theProgramCountedThem = run.account.hovers >= 2 && run.account.leaves >= 1
    && run.account.lit === -1

  /* ---- THE STREAM ------------------------------------------------------------------------ */
  /* THE FIXTURE CLAUSES. Each stream clause is vacuous without them: a program that really held, a
   * stream that really arrived, a window nothing resized, and a stream that did NOT lap the ring —
   * which is deliberate, because `dropped:` is not one of this proof's instruments (plan §M19, for
   * M17's reason) and a lapped ring would make `queued:` a reading of the cap instead of the
   * coalescing. */
  hover.theProgramHeldItsLoop = heldAccount.heldMs >= HOLD_MS - 50
    && heldAccount.noDrainMs === HOLD_MS
  /* AND IT HELD WITH `S = 1`, WHICH IS WHAT `aim` CONVERTS AGAINST. `WEV_CLIENT` is a program's
   * only route to the ratio, so one that has drained none is still on 1 — and the creation-time
   * client record is still in its queue, below the stream, because the hold is taken before the
   * first `win_read`. `clients` and `resurfaces` count what the program drained, so both being 1
   * here is the program refitting AFTER the hold, which is also why no clause below names the row
   * it lit (see `theProgramSawOneRecord`). */
  hover.theProgramHeldBeforeItsFirstRead = heldAccount.clients === 1
    && heldAccount.resurfaces === 1
  hover.theHoldOutlastedTheStream = preStreamMs + streamMs < HOLD_MS
  hover.thePageRoutedEverySample = delta.hovers === HOVER_SAMPLES
    && delta.dragAts === 0
  hover.theStreamStayedInsideTheQueue = HOVER_SAMPLES < WIN_EVENT_CAP && delta.dropped === 0
  hover.nothingResizedMidStream = delta.geoms === 0
  // AND NO LEAVE RODE ALONG. A leave's `mods` is exactly `WPTR_LEAVE` and merges with nothing, so
  // one in the middle of the stream would split the run and `queued:` would rise for a reason that
  // is not the coalescing.
  hover.noLeaveSplitTheStream = delta.leaves === 0

  /* THE TWO NUMBERS THE PLAN NAMES. `queued` counts records that ENTERED the ring and `coalesced`
   * counts the offers that did not, so a stream that was replaced moves the second and leaves the
   * first exactly where it was. The warm-up is what makes `+0` the prediction rather than `+1`. */
  hover.queuedStoodStill = delta.queued === 0
  hover.coalescedRoseByTheWholeStream = delta.coalesced === HOVER_SAMPLES
  hover.procPublishesTheSameNumbers = Object.values(greps)
    .every((g) => g.exit === 0 && g.matched === 1)
  /**
   * AND THE RING HELD ONE HOVER: the program resuming after the hold reads ONE record where an
   * appending stream would hand it forty. That is the replacement seen from the program's side.
   *
   * WHICH ROW IT LIT IS NOT ASSERTED, and the reason is measured rather than a shrug. The resumed
   * program drains its creation-time `WEV_CLIENT` FIRST — it is below the stream in the same queue —
   * so it refits to `S = 2` and then reads the queued pointer record, whose surface coordinate
   * belonged to the 420x228 store that `win_surface` has just replaced. It lit row 2 for a point
   * aimed at row 5, and that is correct arithmetic over a coordinate whose surface no longer exists.
   * A clause naming the row would be asserting which of two surfaces a stale record belongs to,
   * which is a question this proof is not about.
   *
   * THE NEWEST-WINS HALF IS PROVEN ON THE DRAINING WINDOW INSTEAD, where it is well defined:
   * `aSecondMoveMovedTheLight` is the light following the SECOND of two moves, which a replacement
   * that kept the older sample could not do.
   */
  hover.theProgramSawOneRecord = heldAccount.hovers === 1

  hover.ok = hover.nothingWasLitBeforeTheHover && hover.aButtonlessMoveLitTheRow
    && hover.aSecondMoveMovedTheLight && hover.theLightIsNotASelection
    && hover.theHoversWereSentAsHovers && hover.theLeaveClearedTheLight
    && hover.theProgramCountedThem
    && hover.theProgramHeldItsLoop && hover.theProgramHeldBeforeItsFirstRead
    && hover.theHoldOutlastedTheStream
    && hover.thePageRoutedEverySample && hover.theStreamStayedInsideTheQueue
    && hover.nothingResizedMidStream && hover.noLeaveSplitTheStream
    && hover.queuedStoodStill && hover.coalescedRoseByTheWholeStream
    && hover.procPublishesTheSameNumbers && hover.theProgramSawOneRecord
  globalThis.M19.proofs.hover = { ok: hover.ok, evidence: hover }
  say((hover.ok ? 'ok  ' : 'BAD ') + 'hover: the light went ' + String(at.reversed.lit) + ' -> '
    + String(at.litA.lit) + ' -> ' + String(at.litB.lit) + ' -> ' + String(at.left.lit)
    + ' on 2 driven moves and 1 leave; ' + HOVER_SAMPLES + ' more into a held program queued +'
    + delta.queued + ', coalesced +' + delta.coalesced + ', dropped +' + delta.dropped
    + ' and it read ' + heldAccount.hovers + ' record(s), lighting row '
    + (heldAccount.lit + 1) + ' of ' + heldAccount.rows.length)

  /* THE CONTROL IS MEASURED, NOT ASSUMED. `setHoverCoalesce` is exported from
   * `src/kernel/wins.mjs` and nothing in `src/kernel/kernel.mjs` consumes a `noHoverCoalesce` boot
   * cfg — `cfg.noWheelCoalesce` has such a branch at `:1705` and this has none — so a page that
   * merely passed the key would report green proofs over an unmodified kernel, with the kernel's own
   * coalescing silently credited as the thing under test. FAIL CLOSED. */
  if (CFG.noHoverCoalesce && delta.coalesced > 0) {
    throw new Error('no_hover_coalesce was asked for and the kernel coalesced anyway: '
      + `coalesced rose by ${delta.coalesced} over ${HOVER_SAMPLES} samples. `
      + 'src/kernel/kernel.mjs needs a bench-gated `cfg.noHoverCoalesce` branch calling '
      + '`setHoverCoalesce(false)`, beside the `cfg.noWheelCoalesce` branch that calls '
      + '`setWheelCoalesce(false)`. Until it has one there is no world for this control.')
  }
}

/* ---- staging ------------------------------------------------------------------------------- */

/** The program flags the four argv controls select, as `src/bin/files.mjs` spells them. ONE list,
 *  read by both spawns: the held window gets them too, because a control a page applied to one
 *  fixture and not the other is a page running two different worlds at once. */
function programFlags () {
  const flags = []
  if (CFG.stableSortOff) flags.push('--stable-sort-off')
  if (CFG.foldersLast) flags.push('--folders-last')
  if (CFG.noDirStat) flags.push('--no-dir-stat')
  if (CFG.bandFromRow) flags.push('--band-from-row')
  return flags
}

/** The one window the four display-list proofs drive, on the tree this page built. */
async function stage (k, host) {
  const pids = {}
  const argv = ['files', ...programFlags(), ROOT_DIR]
  pids.files = (await spawnProgram(k, FILES, argv)).pid
  if (!await surfaced(host, 'files')) throw new Error('files never surfaced')
  globalThis.M19.pids = pids
  globalThis.M19.argv = argv
  return pids
}

/* ---- the live desktop ---------------------------------------------------------------------- */

/**
 * THE THREE WINDOWS THE LIVE DESKTOP OPENS, as specs `www/shell.mjs` stages.
 *
 * `files` OPENS ON `/usr/share` AND NOT ON `/usr/bin`, which is the one place this page overrides a
 * `PROGRAMS` row, and M19's columns are the reason. `/usr` is a PROVIDER mount: its inodes publish
 * mtime 0, so a Date modified column over `/usr/bin` is thirty-three rows of the unknown mark — the
 * column working exactly as specified and showing nothing a reader can use. `/usr/share` is a
 * handful of rows with real formats, so the Type and Size columns say something; the Date column
 * still reads `—` there, and that is the mount rather than the feature.
 *
 * CLEAR OF THE ICON COLUMN, because the shared staging runs the `desktop` process and that process
 * publishes rows: a window at the desktop's left edge sits on top of the icons, which is constraint
 * 289's own failure. `aero.ICON_CELL_W` is the cell's width, imported rather than guessed at.
 *
 * `taskmgr` IS HERE BECAUSE IT HAS THE SAME SELECTION RULES NOW (plan §M19) and its table is the
 * other list a reader can hover, band and Shift-click. `term` is LAST because it spawns `sh` by
 * syscall (`PROGRAMS.term`).
 */
const LIVE_X = aero.ICON_CELL_W + 20
const LIVE_PROGRAMS = [
  {
    ...PROGRAMS.files,
    name: 'files',
    argv: () => ['files', '/usr/share'],
    box: () => ({ x: LIVE_X, y: 20, w: 560, h: 280 }),
  },
  {
    ...PROGRAMS.taskmgr,
    name: 'taskmgr',
    box: (wa) => ({ x: LIVE_X + 580, y: 20, w: 620, h: Math.max(240, wa.h - 40) }),
  },
  {
    ...PROGRAMS.term,
    box: (wa) => ({ x: LIVE_X, y: 320, w: 560, h: Math.max(160, wa.h - 340) }),
  },
]

/** WHAT THIS MILESTONE ADDED, appended to the shared help. ADDED rather than substituted, so a
 *  reader here still learns what the rest of the shell does. */
const M19_HELP = [
  '  `files` is a DETAILS view: Name, Date modified, Type and Size',
  '  click a column header to sort by it, click it again to reverse — folders stay first',
  '  the row under the pointer lights up, and the light goes out when the pointer leaves',
  '  shift-click for a range, ctrl-click to add one row, drag from empty space to band-select',
  '  `taskmgr` has the same selection rules, and t or x signals every selected process',
]

async function live () {
  const { host } = await stageDesktop({
    into: desktop,
    report: globalThis.M19,
    say,
    label: 'm19',
    /* THE URL'S KERNEL CONTROL REACHES THE LIVE KERNEL TOO, because a flag a page accepts on one
     * path and drops on the other is how a reader comes to believe a world was selected when it was
     * not. It is still unconsumed by `src/kernel/kernel.mjs`; `proofHover` is what measures that. */
    cfg: CFG.noHoverCoalesce ? { noHoverCoalesce: 1 } : {},
    tap: captureBatch,
    programs: LIVE_PROGRAMS,
    help: DESKTOP_HELP.concat(M19_HELP),
  })
  publishHost(host)
}

async function main () {
  if (!CFG.proofs) {
    globalThis.M19.state = 'done'
    globalThis.M19.verdict = 'live'
    await live()
    return
  }

  const controls = [...programFlags(), ...(CFG.noHoverCoalesce ? ['no_hover_coalesce'] : [])]
  say('M19 — details, sort, selection, hover.'
    + (controls.length ? ' CONTROL: ' + controls.join(' ') : ''))
  say('dpr ' + dpr() + '. Every click, move and band below is REAL input, performed by something')
  say('that is not this page: a synthesised event is isTrusted === false (175). Every clause is')
  say('read back off the display list the page replayed.')

  const { k, host } = await bootHost()
  globalThis.M19.kernelIsolated = true
  globalThis.M19.controlsInForce = host.report().controls
  globalThis.M19.tree = await makeTree(k)
  say('staged ' + ROOT_DIR + ': rm exit ' + globalThis.M19.tree.rm + ', mkdir exit '
    + globalThis.M19.tree.mkdir + ', cp exits ' + globalThis.M19.tree.copies.join(',')
    + ', touch exit ' + globalThis.M19.tree.touch + ' for ' + ROW_COUNT + ' row(s)')
  await stage(k, host)

  const run = await drive(k, host)
  globalThis.M19.run = run

  proofSort(run)
  proofCells(run)
  proofSelect(run)
  proofBand(run)
  /* THE STREAM GOES LAST because it spawns a SECOND `files` and holds it for `HOLD_MS`: a proof that
   * costs twenty seconds of wall time belongs after the ones that can fail in two. */
  await proofHover(k, host, run)

  const proofs = globalThis.M19.proofs
  const bad = Object.entries(proofs).filter(([, p]) => !p || !p.ok).map(([n]) => n)
  globalThis.M19.verdict = bad.length ? 'bad: ' + bad.join(', ') : 'ok'
  out.className = bad.length ? 'bad' : 'ok'
  say('')
  say('verdict ' + globalThis.M19.verdict)
  globalThis.M19.state = 'done'
  globalThis.M19.phase = 'rendered'
}
/* THE ENTRY POINT RUNS AT THE BOTTOM OF THIS MODULE, and that is not a style choice (constraint
 * 301).
 *
 * `main()` is called synchronously, and on the BARE URL it reaches `live()` before the first
 * `await` — so an entry point above `LIVE_PROGRAMS` hands `stageDesktop` an object literal that
 * reads that `const` while it is still in its temporal dead zone:
 * `Cannot access 'LIVE_PROGRAMS' before initialization`, in BOTH engines. That is M17's bill, paid
 * once: the registered suite loads `?proofs=1`, whose branch of `main()` touches nothing live until
 * long after the module has evaluated, so the thing a reader opens was the one path with no check
 * on it at all.
 *
 * Below every declaration is the only position where a module's entry point cannot be in a dead
 * zone, so it is the position it keeps. */
if (self.crossOriginIsolated !== true || typeof SharedArrayBuffer !== 'function') {
  globalThis.M19.state = 'aborted'
  globalThis.M19.why = 'crossOriginIsolated === ' + self.crossOriginIsolated
