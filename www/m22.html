<script type="module">
/**
 * M22's page: THE SHELL'S REMAINDER — a band that reaches every button, a pin that survives a
 * reload, a tray icon withdrawn by a KILL, a save that writes bytes, and the chord the measurement
 * selected.
 *
 * THE PRODUCT IS AT THE BARE URL and `?proofs=1` is the harness (constraint 283).
 *
 *   PROOF 1  pins: A PINNED BUTTON SURVIVES A RELOAD AND LAUNCHES. The pin is made by a REAL click
 *            on a REAL start-menu row in load 1, the page then NAVIGATES, and load 2 asserts the
 *            button is back — read off the band's DOM, off the shell's report, and off the FILE's
 *            own bytes through `wc` and `grep` in separate processes. The subject is `editor`,
 *            which is NOT in `src/bin/desktop.mjs`'s `DEFAULT_PINS`: a pin list that never
 *            persisted publishes the defaults, so this clause fails against exactly that world
 *   PROOF 2  save: `editor`'s SAVE WRITES BYTES TO THE FILE, read back through a fresh `open` — the
 *            program's own (`commitSave` re-reads before it reports) and the page's, out of `wc`
 *            and `grep` processes that hold no fd of the editor's. Three saves on two paths, the
 *            last one driven by REAL INPUT ALONE: the X, then `y` in the close dialog, which is the
 *            exact gesture whose `[saved]` went to the WINDOW fd. A SECOND editor on `/usr` is the
 *            refusal, EROFS asserted by name
 *   PROOF 3  switch: THE CHORD SWITCHES, AND THE MENU LABELS THE REAL ACCELERATOR. Alt+` forward,
 *            Alt+Shift+` backward, Alt+1..9 direct — `src/wm/chords.mjs` is the one table, and the
 *            labels are read off the DOM the shell rendered rather than off that table. Alt+Tab
 *            appears NOWHERE, which is a clause: it is in `BLOCKED`
 *   PROOF 4  band: THE BAND REACHES EVERY BUTTON PAST THE 42 CSS px SHRINK FLOOR, driven and not
 *            photographed — a wheel on each axis, both chevrons clicked, and the last button
 *            hit-tested at its own centre after `revealSlot`
 *   PROOF 5  tray: A TRAY ICON IS WITHDRAWN WHEN ITS PROCESS DIES, asserted by KILLING the process.
 *            `end-process` is SIGKILL through the kernel's own reap, so nothing asks the desktop to
 *            withdraw anything and nothing could have been politely handed back
 *
 * ## THE RELOAD, AND WHY THIS PAGE LOADS TWICE
 *
 * R24's claim is that a pin SURVIVES A RELOAD, and nothing page-side does. So the proofs path runs
 * in two loads of this document: load 1 makes the pin and `location.replace`s to `&phase=2`, load 2
 * asserts it is still there and runs every other proof. Load 1's readings travel in
 * `sessionStorage` — the one store that survives a navigation in the same tab and nothing else —
 * stamped with an EPOCH that load 2's URL carries, so a stash left by a previous run cannot be read
 * as this run's evidence.
 *
 * `window.__m22mark` IS THE INFRASTRUCTURE CLAUSE. It is set in load 1 and cannot survive a
 * navigation, so finding it in load 2 means the page never navigated and the pin clause would be a
 * reading of the still-live first shell. `bench/m19a-seed-firefox/firefox-session.py` states the
 * same clause for the same reason.
 *
 * EVERY GESTURE NAME IS PREFIXED WITH ITS LOAD, and that is not decoration: `scripts/check.py`'s
 * `drive_gestures` skips a `want` whose id equals the last one it performed, and the serial restarts
 * at 1 in a new document — so two loads asking for `click-orb#1` would have the second one silently
 * dropped and the page would time out waiting for a gesture nobody was ever asked for.
 *
 * ## WHAT THIS PAGE CANNOT PROVE, stated rather than quietly skipped
 *
 *   1. THE CHORD AND ctrl-S ARE SYNTHESISED, AND THE PAGE SAYS SO AND MEASURES IT.
 *      `scripts/cdp.py`'s `KEYS` table holds Tab, Enter, Escape, Space, the four arrows and
 *      Backspace, and carries no `code` — so `Backquote`, the digits and a Ctrl+letter are
 *      undrivable through the gesture protocol, exactly as M20 records for F2 and M21 for F5.
 *      `bench/m22-switch/probe.py` is where the chords are dispatched as REAL keys, in BOTH
 *      engines, with their `code`, their modifiers and `isTrusted` read back; what a synthesised
 *      key cannot prove here is the ARRIVAL, not the binding. So the page dispatches
 *      `KeyboardEvent`s carrying the chord's own `code`, asserts `host.keyCounts().synthetic` rose
 *      and `trusted` did not, and drives every pointer gesture and every printable key for real.
 *      `"Backquote": (192, "")` in that table is the one line that would close it — and it works
 *      only BECAUSE the binding is on `code`: `Page.press` sends `key` and `code` as the same
 *      string, so the chord would arrive as `key: "Backquote"`, which no `key`-matching dispatcher
 *      would take. It is a file this slice does not own.
 *   2. THE WITHDRAWAL IS TWO READINGS AND THIS PAGE KEEPS BOTH, because the first one was RED and
 *      the second one explained why. Killing the publisher drew `reaped` out of the kernel and NO
 *      `win-destroy`: a window died on the last close of its DESCRIPTION, and `spawnChild`
 *      (`src/kernel/kernel.mjs`) inherits every fd into a child — window fds included — so a
 *      process with one living child was reaped with `refs` above zero and
 *      `src/kernel/files.mjs`'s `F_WIN.close`, the only thing that called `WinMgr.destroyTree`,
 *      never ran. The desktop spawns every program a reader starts, so ANY running program held
 *      its window, its rows and its tray icon. `WinMgr.reapPid` (`src/kernel/wins.mjs`), called
 *      from `teardown`, is what closed it: the windows a dying process CREATED go regardless of
 *      refs, which is constraint 14's "destroy windows" as a step of its own rather than a
 *      consequence of the fd walk. Both clauses are kept, because the second one is the only
 *      reading that would notice the fix being reverted to a refcount.
 *   3. `tray-outlives` HAS NO WORLD IN `src/wm/taskbar.mjs`, and the shipped shape is the reason:
 *      `trayRows()` DERIVES the tray from `host.frames` every `sync`, so there is no withdrawal
 *      step to skip. A control that turns nothing verifies nothing (CLAUDE.md), so this page builds
 *      the world where the shell REMEMBERS its rows instead of deriving them — `?tray_outlives=1`
 *      wraps the shell's own `trayRows` in a cache, which is the classic tray defect written at the
 *      one place it can live. A `setShellControls({trayOutlives})` key would be the better home and
 *      is a change in a file this slice does not own.
 */
import { setHostControls } from '/src/wm/winhost.mjs'
import { setSurfaceControls } from '/src/wm/surface.mjs'
import { setShellControls } from '/src/wm/taskbar.mjs'
import {
  WITEM_MENU, WITEM_TRAY, WMOD_ALT, WMOD_CTRL, WMOD_SHIFT, WMOD_META,
  isTrayRow, isPinnedRow,
} from '/src/abi.mjs'
/* A14's ONE TABLE. The page reads the chord it must dispatch and the label the menu must show out
 * of the same rows the dispatcher binds and the shell draws — a page that spelled "Alt+`" itself
 * would be a third copy, and the one that drifted would be the one nobody runs. */
import {
  CHORDS, BLOCKED, SWITCH_NEXT, SWITCH_PREV, SELECT_SLOTS, CHORD_SWITCH, CHORD_SELECT,
  slotChord, labelFor,
} from '/src/wm/chords.mjs'
/* THE SHRINK FLOOR AND THE CHEVRON'S WIDTH, imported: the band proof's whole subject is the
 * overflow PAST that floor, and a page that wrote 42 would be asserting against a number the
 * stylesheet no longer uses. */
import { TASK_BTN_MIN_W, BAND_CHEV_W, TASKBAR_H } from '/src/wm/aero.mjs'
/* THE SESSION TREE'S ROOT, IMPORTED AND NEVER WRITTEN — `www/shell.mjs`'s own precedent. The pin
 * file and every fixture below live under it, and `/Users/Default` spelled here would be the second
 * copy that puts a save somewhere the desktop process is not looking. */
import { HOME_DIR } from '/src/libos/std.mjs'
import {
  spawnProgram, resultOf, ask as askKernel, until, gestureAsker,
} from '/www/pagekernel.mjs'
import {
  bootShell, stageDesktop, place, requireIsolation, PROGRAMS, DESKTOP_HELP,
} from '/www/shell.mjs'

const out = document.getElementById('log')
const desktop = document.getElementById('desktop')
/** AND IT SCROLLS TO THE NEWEST LINE. The log is a FIXED-HEIGHT box for M13's reason, so the lines
 *  a reader most needs are the ones that have just scrolled out of it — and in a second engine this
 *  log is the only channel there is (CLAUDE.md), where a screenshot cannot scroll. */
const say = (s) => {
  out.textContent += s + '\n'
  out.scrollTop = out.scrollHeight
}
const params = new URLSearchParams(location.search)

/** A FIXED WAIT, spelled as the one waiting primitive this project has: `until` over a predicate
 *  that never holds returns -1 after `ms`. */
const pause = (ms) => until(() => false, ms)

const CFG = {
  /** THE HARNESS IS THE OPT-IN. The bare URL is the desktop (constraint 283). */
  proofs: params.get('proofs') === '1',
  /** WHICH LOAD THIS IS. 1 makes the pin and navigates; 2 asserts it survived and runs the rest. */
  phase: params.get('phase') === '2' ? 2 : 1,
  /** Load 1's stamp as load 2's URL carries it back. Empty in load 1, which MINTS it. */
  epoch: params.get('epoch') || '',
  /* THE THREE WORLDS, EACH RE-RUNNABLE FROM THE COMMAND LINE WITHOUT A SOURCE EDIT. */
  bandClips: params.get('band_clips') === '1',
  saveToWindowFd: params.get('save_to_window_fd') === '1',
  trayOutlives: params.get('tray_outlives') === '1',
}
globalThis.M22.config = CFG

/** THIS RUN'S STAMP. Load 1 mints it and puts it in the URL it navigates to; load 2 compares the URL
 *  against the stash. A stash from a previous run therefore cannot be read as this run's evidence —
 *  which matters because `sessionStorage` outlives a navigation on purpose and `scripts/check.py`
 *  re-navigates the same document per check. */
const EPOCH = CFG.phase === 1 ? `${Date.now()}-${Math.round(performance.now())}` : CFG.epoch

/* THE PAGE-SIDE CONTROLS, SET IN FULL AND ON BOTH PATHS. They are MODULE state, so a page that sets
 * none still has to say none: otherwise the others are left holding whatever the last page in this
 * realm asked for. `bandClips` is M22's, and `noGroup` is named as false rather than omitted
 * because `setShellControls` rebuilds the whole record from the object it is handed. */
setSurfaceControls({})
setHostControls({})
setShellControls({ noGroup: false, bandClips: CFG.bandClips })

const EDITOR = '/src/bin/editor.mjs'
const SH = '/src/bin/sh.mjs'
const WC = '/src/bin/wc.mjs'
const GREP = '/src/bin/grep.mjs'
const STAT = '/src/bin/stat.mjs'
const MKDIR = '/src/bin/mkdir.mjs'
const RM = '/src/bin/rm.mjs'

/* ---- the fixture's names ---------------------------------------------------------------------- */

/** The tree this page's saves write into, in the session's own WRITABLE copy (D40/M19a). Not
 *  `/tmp`: `std.sessionDir` is where `editor` with no operand puts a document, and a proof about a
 *  reader's save must be about the directory a reader's save lands in. */
const ROOT = `${HOME_DIR}/m22`

/** THE PIN FILE, spelled from `HOME_DIR` and the leaf `src/bin/desktop.mjs` owns. The LEAF is the
 *  one thing this page restates, and it restates it as a constant with that fact attached:
 *  `PINS_LEAF` is module-private in the program, so there is no binding to import. A drift arrives
 *  as `thePinFileHoldsTheList` going red with the button still on the bar, which is the loud end of
 *  the two failure modes. */
const PINS_LEAF = '.taskbar-pins'
const PINS_PATH = `${HOME_DIR}/${PINS_LEAF}`

/**
 * THE PROGRAM THE GESTURE PINS, and the choice is the whole of clause 1's discriminating power.
 *
 * `editor` is pinnable — it is in `/usr/bin`, in `OPENS_OWN_WINDOW` and not in `HIDDEN_FROM_MENU` —
 * and it is NOT in `DEFAULT_PINS`, which is `["files", "term"]`. A pin list that was never written
 * reads back ENOENT and publishes those two, so `editor` on the band after the reload cannot be
 * satisfied by a desktop that merely loaded. `bench/m22-pins/firefox-pins.py` picks the same
 * subject for the same reason.
 */
const PIN_ME = 'editor'

/** What the defaults are, as the only thing this page asserts about them: the subject must not be
 *  one of them. Read off the shell BEFORE the gesture rather than written out, so the clause is
 *  about the list the program actually published. */
const pinsBefore = []

/** The document the save proof writes. Its bytes are the proof, so they are a string whose length
 *  no other string here shares. */
const DOC_NAME = 'notes.txt'
const DOC_TEXT = 'M22-THE-FILE-AS-IT-WAS-OPENED'
/** What a REAL keyboard adds to it. Typed through `scripts/cdp.py`'s own per-character key events,
 *  so these bytes are the ones that have to reach the file. */
const TYPED = 'M22-TYPED-BY-A-REAL-KEYBOARD'
/**
 * AND WHAT IS TYPED AFTER THE SAVE AS, which is a FIXTURE AND NOT A FLOURISH.
 *
 * `src/bin/editor.mjs` breaks out of its loop on a close request when `!dirty` — "a clean buffer
 * closes at once; a dirty one asks" — and a Save As clears `dirty`. So without these bytes the X
 * would close the window with no dialog at all and the `y` clause would be waiting for a window
 * that is never created.
 *
 * It also makes the final file DIFFERENT IN LENGTH from what Save As wrote, so "the close saved"
 * is a byte count and not a path that was written twice with the same contents — the shape M21
 * records at `CTRL2_TEXT`: an assertion over a constant inverts and fires and verifies nothing.
 */
const AFTER_AS = 'M22-TYPED-AFTER-THE-SAVE-AS'
/** What Save As adds to the STEM. `notes.txt` becomes `notes-as.txt`, which is `src/bin/editor.mjs`
 *  splitting the name with `std.extOf` and appending to the stem alone. */
const AS_SUFFIX = '-as'

/** THE READ-ONLY PATH THE REFUSAL IS ABOUT. `/usr` is `MNT_RO` with `mutErrno: "EROFS"` and
 *  `src/share/readme.txt` is a real file with real bytes, so the editor opens it, loads it and then
 *  cannot write it — which is the one reachable save refusal this system has. */
const RO_DOC = '/usr/share/readme.txt'

/** `echo` adds the newline unless `-n`, so a file is one byte longer than the string it was given
 *  (`src/bin/echo.mjs`). */
const echoBytes = (text) => text.length + 1

/* ---- what the proofs are, before any of them has run ------------------------------------------ */

globalThis.M22.proofs = { pins: null, save: null, switch: null, band: null, tray: null }

const ask = gestureAsker(globalThis.M22)

/** The host and the shell, once there are any. Published for a driver in another engine. */
let HOST = null
let SHELL = null
let KERNEL = null

/** The device-pixel ratio, read where it is true. THE DPR AXIS IS THE CHECK'S: a run is loaded at
 *  whatever ratio the harness asked for and this page measures what it was given, so an emulation
 *  that silently failed is visible as a ratio that is not the one asked for (constraint 264). */
const dpr = () => window.devicePixelRatio || 1

/**
 * WHAT THE KERNEL SAID ABOUT A DEATH, kept as a list.
 *
 * THE TRAY PROOF IS A CLAIM ABOUT A KILL, and a kill is three messages: `reaped` for the process,
 * `win-destroy` for its windows, and `error` or `panic` for a kill that could not happen. Without
 * them, a tray icon that did not go looks identical to a message the kernel never received — which
 * is the first thing this page measured wrong, and `error: no such pid` is what it turned out to be
 * saying. `bootShell({tap})` registers this before the host's own listener.
 */
const KMSG = []
const KMSG_KINDS = new Set(['reaped', 'win-destroy', 'error', 'panic', 'note'])
function kernelTap (m) {
  if (!m || !KMSG_KINDS.has(m.t)) return
  KMSG.push({ t: m.t, pid: m.pid, ids: m.ids, why: m.why, kind: m.kind, at: Math.round(
    performance.now()) })
}

/* ---- reading the filesystem through ordinary programs ----------------------------------------- */

/** Run one program to completion and return its result row. */
async function runProgram (k, url, argv) {
  const row = await spawnProgram(k, url, argv)
  return { pid: row.pid, ...(await resultOf(k, row.pid, 20000)) }
}

/**
 * ONE FILE'S BYTE AND LINE COUNT, out of a SEPARATE `wc` PROCESS.
 *
 * THE PAGE CANNOT READ A FILE — it holds no fd and makes no syscall — so "the bytes are in the
 * file" has to be read through a program, and the reading must not be the saving program's own. The
 * editor already re-reads through a fresh `open` before it reports (`commitSave`); this is the
 * SECOND, independent reading, by a process that was not alive when the write happened.
 */
async function bytesOf (k, path) {
  const row = await runProgram(k, WC, ['wc', '-c', '-l', path])
  const total = row.total || {}
  return { path, exit: row.exit, bytes: total.bytes | 0, lines: total.lines | 0 }
}

/** How many lines of `path` contain `needle`, as a FIXED STRING (constraint 138), with the status
 *  beside the count: `grep` answers 1 for a file it read and did not match, which is what makes
 *  "these are NOT the bytes" a measurement rather than an absence. */
async function linesWith (k, path, needle) {
  const row = await runProgram(k, GREP, ['grep', '-c', needle, path])
  return { path, needle, exit: row.exit, matched: row.matched | 0 }
}

/** One `lstat` row, or a row that says the path is not there. */
async function statOf (k, path) {
  const row = await runProgram(k, STAT, ['stat', path])
  const got = (row.rows || [])[0] || null
  return { path, exit: row.exit, type: got ? got.type : '' }
}

/** Write one line into a file through a REAL SHELL REDIRECTION. No path here carries a glob
 *  character, so `expandOne` does no matching and the target is the word (`src/bin/sh.mjs`). */
async function writeLine (k, path, text) {
  const row = await runProgram(k, SH, ['sh', '-c', `echo ${text} > ${path}`])
  return { path, text, exit: row.exit }
}

/* ---- aiming real input ------------------------------------------------------------------------ */

/** THE VIEWPORT BOUND, as ONE test every aim applies. `Input.dispatchMouseEvent` takes a VIEWPORT
 *  coordinate, so a point past `innerWidth` is delivered to nothing — no error, no event, and a
 *  page that waited for an effect simply reports a red clause. A harness MUST fail when it cannot
 *  reach what it was pointed at. */
function onScreen (at, what, where = '') {
  if (!at) throw new Error(`${what}: there is no measurable rect to aim at`)
  if (at.x < 0 || at.y < 0 || at.x >= window.innerWidth || at.y >= window.innerHeight) {
    throw new Error(`${what} is at client ${at.x},${at.y}, outside a `
      + `${window.innerWidth}x${window.innerHeight} viewport — a dispatched mouse event carries a `
      + `VIEWPORT coordinate, so nothing would receive it.${where ? ` ${where}` : ''}`)
  }
  return at
}

/**
 * THE CENTRE OF ONE ELEMENT, IN VIEWPORT COORDINATES, AND THE HIT TEST THAT SAYS A HAND COULD
 * REACH IT.
 *
 * `elementFromPoint` IS THE CLAUSE AND NOT A COURTESY. Every gesture on this page lands on shell
 * chrome — an orb, a menu row, a chevron, a taskbar button, a caption button — and all of it is
 * inside a 40 px strip under a stack of windows. A button in the DOM with a non-zero rect and
 * something else on top of it is exactly the defect the band proof removes, so the aim REPORTS what
 * the point really finds rather than assuming it is the element it was computed from.
 */
function aimEl (el, what) {
  if (!el) throw new Error(`there is no element to aim ${what} at`)
  const r = el.getBoundingClientRect()
  if (!(r.width > 0) || !(r.height > 0)) {
    throw new Error(`${what} has no measurable rect (${JSON.stringify(r.toJSON())})`)
  }
  const at = onScreen({
    x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2),
  }, what)
  const found = document.elementFromPoint(at.x, at.y)
  return {
    at,
    box: { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width),
      h: Math.round(r.height) },
    /* CONTAINMENT AND NOT IDENTITY: a `.task-btn` holds an icon `<svg>` and a label `<span>`, and
     * the hit test finds whichever one is under the centre. */
    hits: Boolean(found && (found === el || el.contains(found))),
    found: found ? String(found.className || found.tagName) : 'nothing',
  }
}

/** ONE ROW OF THE SHELL'S POPUP, BY ITS LABEL — and the index the shell will report with it.
 *  A LABEL THAT IS NOT THERE EXACTLY ONCE IS A THROW, with the whole popup printed: a driver that
 *  clicked whichever row came first would run a verb nobody chose. */
function aimPopupRow (shell, label, what) {
  const rows = [...shell.popup.querySelectorAll('.shell-row')]
  const labels = rows.map((el) => (el.querySelector('.shell-label') || {}).textContent || '')
  const hits = rows.filter((unused, i) => labels[i] === label)
  if (hits.length !== 1) {
    throw new Error(`the popup has ${hits.length} row(s) labelled ${JSON.stringify(label)} among `
      + `[${labels.join(' | ')}] — ${what}`)
  }
  const el = hits[0]
  const aim = aimEl(el, `the popup row ${JSON.stringify(label)}`)
  return {
    label,
    index: Number(el.dataset.menuIndex !== undefined ? el.dataset.menuIndex : -1),
    accel: (el.querySelector('.shell-accel') || {}).textContent || '',
    disabled: el.disabled === true,
    ...aim,
  }
}

/* ---- driving ---------------------------------------------------------------------------------- */

/**
 * ASK FOR A GESTURE AND WAIT FOR WHAT IT WAS FOR.
 *
 * `wait` IS THE GESTURE'S OWN CONSEQUENCE AND NOT A TIMEOUT NOBODY TUNED, which is M19's rule: a
 * predicate the page can read, or `'settle'` where nothing observable is owed. The NAME carries the
 * load, for the `drive_gestures` id-guard reason stated in this page's header.
 */
async function gesture (spec, { wait = 'settle', ms = 8000 } = {}) {
  const named = { ...spec, name: `p${CFG.phase}-${spec.name || spec.kind}` }
  await ask(named)
  if (wait === 'settle') { await pause(350); return -1 }
  return Math.round(await until(wait, ms))
}

const winState = async (k) => (await askKernel(k, 'win-state'))

/** The shell's own numbers, as one row — the ones every proof below reads. */
function shellCounts (shell) {
  const r = shell.report()
  return {
    syncs: r.syncs | 0, buttons: r.buttons | 0, pins: r.pins | 0,
    switches: r.switches | 0, selects: r.selects | 0, raises: r.raises | 0,
    trustedChords: r.trustedChords | 0, syntheticChords: r.syntheticChords | 0,
    buttonClicks: r.buttonClicks | 0, minimizes: r.minimizes | 0, restores: r.restores | 0,
    pinLaunches: r.pinLaunches | 0, trayClicks: r.trayClicks | 0, bandScrolls: r.bandScrolls | 0,
    launches: r.launches | 0, menuOpens: r.menuOpens | 0,
    topmost: r.topmost | 0,
    popupKind: r.popupKind,
    popupRows: [...r.popupRows],
    accels: [...r.accels],
    slotAccels: [...r.slotAccels],
    chords: { ...r.chords },
    band: { ...r.band, chevrons: (r.band.chevrons || []).map((c) => ({ ...c })) },
    slots: (r.slots || []).map((s) => ({ ...s })),
    pinned: (r.pinned || []).map((p) => ({ ...p })),
    tray: (r.tray || []).map((t) => ({ ...t })),
  }
}

/** EVERY FRAME THE HOST HOLDS, the desktop included — which is the point here rather than an
 *  oversight: the tray proof asserts that the desktop's own window went with its process, so the
 *  one row a window list would normally drop is the row that clause reads. */
function framesOf (host) {
  return [...host.frames.values()]
    .map((e) => ({ id: e.id, pid: e.pid, prog: e.prog, role: e.role, title: e.win.titleText }))
    .sort((a, b) => a.id - b.id)
}

/** Wait for a frame whose title contains `title`, and hand back the ENTRY. `skip` is the set of ids
 *  that were already there — this page opens several `editor` windows, so a new one is told from an
 *  old one by exclusion and never by title alone. */
async function framed (host, title, skip = null, ms = 20000) {
  const find = () => {
    for (const entry of host.frames.values()) {
      if (skip && skip.has(entry.id)) continue
      if (entry.win.titleText.includes(title)) return entry
    }
    return null
  }
  const got = await until(() => Boolean(find()), ms)
  return got < 0 ? null : find()
}

/** A TEXT window's transcript, which is every byte its program has written to the window fd. The
 *  only reading the page has of what a windowed program said, and what every wait below is on. */
const screenOf = (entry) => (entry && entry.term ? entry.term.transcript : '')

/** THE WINDOW UNDER TEST GOES TO THE TOP, because a pointer gesture is delivered by DOM
 *  hit-testing. The kernel owns the order (constraint 226), so this asks rather than restyling. */
async function raise (k, entry) {
  HOST.post({ t: 'win-raise', win: entry.id })
  return until(async () => {
    const st = await winState(k)
    const stack = (st.wins || {}).stack || []
    return stack[stack.length - 1] === entry.id
  }, 5000)
}

/* ---- the synthesised keys, and the counting that says they were ------------------------------- */

/**
 * ONE KEYBOARD EVENT CARRYING A CHORD'S `code`, dispatched at the element that has the keyboard.
 *
 * `code` COMES FROM THE CHORD ROW AND THE MODIFIER BOOLEANS ARE DERIVED FROM ITS `mods`, so the
 * page cannot dispatch a gesture the table does not describe. `keyAs` overrides the `key` ALONE,
 * which is what makes the engine-disagreement clause possible: Firefox delivers Shift+Backquote as
 * `key: "~"` and Chrome as `key: "\`"`, and a dispatcher bound on `key` passes in one engine and
 * silently misses the chord in the other.
 *
 * `cancelable: true`, because `defaultPrevented` read back off the event is how this page asserts
 * that `takeChord` called `preventDefault` — a chord the page does not cancel is a chord the host
 * may also act on, which is what F6 measured as `host: "stopped"` in Chrome.
 */
function chordEvent (chord, { keyAs = null } = {}) {
  return new KeyboardEvent('keydown', {
    key: keyAs === null ? '`' : keyAs,
    code: chord.code,
    altKey: (chord.mods & WMOD_ALT) !== 0,
    ctrlKey: (chord.mods & WMOD_CTRL) !== 0,
    shiftKey: (chord.mods & WMOD_SHIFT) !== 0,
    metaKey: (chord.mods & WMOD_META) !== 0,
    bubbles: true,
    cancelable: true,
  })
}

/**
 * DISPATCH ONE CHORD AT THE ELEMENT HOLDING THE KEYBOARD, and report everything the page can see
 * of what happened to it.
 *
 * `into` IS A WINDOW'S OWN WIDGET AND NOT `document`, because the dispatcher is reached on the way
 * INTO a window (`src/wm/winhost.mjs`): the event has to arrive where a reader's key would. It
 * bubbles, so a listener on the desktop or on the document sees it too.
 *
 * `prevented` IS NECESSARY AND NOT SUFFICIENT, and the comment is the measurement: a window's own
 * keydown handler ALSO calls `preventDefault` for any key that produces bytes
 * (`src/wm/terminal.mjs` `#key`, `src/wm/winhost.mjs`'s surface handler), and `bytesForKey` answers
 * one byte for Alt+` — Alt is not Ctrl and the backquote is one character. So a cancelled chord does
 * not by itself say the dispatcher took it. What DOES say so is `screen`: a chord the dispatcher
 * takes never becomes a `WEV_KEY`, so the program with the keyboard echoes nothing. The two
 * readings together are the clause, and the unbound dispatches below are the other half — the same
 * `key` on a different `code` must land in the program as a byte.
 */
function sendChord (into, chord, opts = {}) {
  const event = chordEvent(chord, opts)
  into.el.focus()
  into.el.dispatchEvent(event)
  return {
    id: chord.id, code: chord.code, mods: chord.mods, label: chord.label,
    keyAs: event.key,
    where: String(into.el.className || into.el.tagName),
    /* READ BACK OFF THE EVENT, after dispatch: synchronous dispatch means every listener has run by
     * the time this line is reached. */
    prevented: event.defaultPrevented === true,
  }
}

/** A chord this table does NOT hold, built from a code and a modifier word rather than from a row.
 *  The superset clause's instrument: Alt+Ctrl+` must match nothing. */
const unboundChord = (code, mods) => Object.freeze({
  id: `unbound-${code}-${mods}`, code, mods, label: labelFor(code, mods), action: '', arg: 0,
})

/** One synthesised key into a widget, by `key` and modifiers. `src/wm/terminal.mjs`'s
 *  `bytesForKey` uppercases the letter before the C0 subtraction, so `ctrl+s` is byte 19 and
 *  ctrl-shift-S is the SAME byte with `WMOD_SHIFT` in the record — which is the only thing that
 *  tells Save from Save As apart. */
function synthKey (el, key, { ctrl = false, shift = false } = {}) {
  el.focus()
  el.dispatchEvent(new KeyboardEvent('keydown', {
    key, ctrlKey: ctrl, shiftKey: shift, bubbles: true, cancelable: true,
  }))
}

/* ---- load 1: the pin gesture ------------------------------------------------------------------ */

/** Where load 1 leaves its readings, and the one key it uses. `sessionStorage` and not
 *  `localStorage`: the stash belongs to this TAB and this run, and a store that outlived the tab
 *  would hand a later run an older run's evidence. */
const STASH_KEY = 'm22-load-1'

/**
 * MAKE THE PIN WITH REAL INPUT, READ THE FILE BACK, AND NAVIGATE.
 *
 * THREE REAL GESTURES AND NOTHING SYNTHETIC: a click on the orb, the program's name TYPED into the
 * start menu's own search box, and a click on the row that appears. The search is not a shortcut
 * around a scroll — it is the shell's own filter, and it is what makes the aim independent of how
 * many rows `/usr/bin` happens to have today (42 of them).
 */
async function drivePin (k, host, shell) {
  const before = shellCounts(shell)
  pinsBefore.push(...before.pinned.map((p) => p.label))

  const orb = desktop.querySelector('[data-start]')
  const orbAim = aimEl(orb, 'the start orb')
  await gesture({ kind: 'click', name: 'click-the-orb', at: orbAim.at },
    { wait: () => shell.report().popupKind === 'start', ms: 6000 })
  const opened = shellCounts(shell)

  /* THE NAME, TYPED. The search box has the keyboard the moment the menu opens (`openStart` focuses
   * it), so these keys go where a reader's would. The needle is the ROW's own label, so the filter
   * leaves exactly one `.shell-row` and `aimPopupRow` throws if it does not. */
  const needle = `Pin ${PIN_ME}`
  await gesture({ kind: 'type', name: 'type-the-pin-rows-name', text: needle },
    { wait: () => {
      const list = shell.popup.querySelector('.start-list')
      return Boolean(list) && list.dataset.rows === '1'
    }, ms: 6000 })
  /** HOW MANY ROWS THE START MENU'S PROGRAM LIST IS SHOWING, which is NOT `report().popupRows`:
   *  that is every `.shell-row` in the popup, and the menu's FOOT holds three of its own — the two
   *  switch rows and Log off. `openStart`'s `render` publishes the filtered count on the list
   *  itself, so this is the shell's own statement about its filter. */
  const listRows = () => Number(
    (shell.popup.querySelector('.start-list') || { dataset: {} }).dataset.rows)
  const filtered = { ...shellCounts(shell), listRows: listRows() }
  const row = aimPopupRow(shell, needle, 'the pin gesture')

  await gesture({ kind: 'click', name: 'click-the-pin-row', at: row.at },
    { wait: () => (shell.report().pinned || []).some((p) => p.label === PIN_ME), ms: 10000 })
  const after = shellCounts(shell)

  /* THE FILE, READ BY PROGRAMS THAT HOLD NO FD OF THE DESKTOP'S. This is what "persisted" means
   * before any navigation has happened: the gesture wrote bytes and `fsync`ed them (constraint 23,
   * `writePins`), and a reload is about whether they come back. */
  const file = {
    stat: await statOf(k, PINS_PATH),
    counts: await bytesOf(k, PINS_PATH),
    subject: await linesWith(k, PINS_PATH, PIN_ME),
  }

  return {
    epoch: EPOCH,
    pinsBefore: [...pinsBefore],
    subject: PIN_ME,
    path: PINS_PATH,
    orb: { box: orbAim.box, hits: orbAim.hits, found: orbAim.found },
    row: { label: row.label, index: row.index, box: row.box, hits: row.hits, found: row.found },
    before, opened, filtered, after,
    file,
    keys: { ...host.keyCounts() },
    gestures: [...globalThis.M22.gestureLog],
  }
}

/* ---- load 2, proof 1: the pin came back ------------------------------------------------------- */

/**
 * THE PINNED BUTTON, AFTER THE NAVIGATION — and then a REAL CLICK ON IT, which must start the
 * program.
 *
 * THE LAUNCH IS THE OTHER HALF OF R24 AND IS NOT A BONUS. A pinned button that cannot start
 * anything is the live-looking button defect with a reload in front of it, and the route it takes
 * is the one the start menu already uses: `activateItem(win, index, WITEM_MENU)` into the process
 * that published the row (`Taskbar.launchPin`). So the shell gains no second way to run a program,
 * and this clause is what says the index that came back out of the FILE still names the right row.
 */
async function drivePinBack (k, host, shell) {
  const back = shellCounts(shell)
  const btn = desktop.querySelector(`[data-pin-btn="${PIN_ME}"]`)
  const file = {
    stat: await statOf(k, PINS_PATH),
    counts: await bytesOf(k, PINS_PATH),
    subject: await linesWith(k, PINS_PATH, PIN_ME),
  }
  if (!btn) {
    return { back, file, launched: null, btn: null,
      why: `no [data-pin-btn="${PIN_ME}"] on the band` }
  }
  const aim = aimEl(btn, `the pinned ${PIN_ME} button`)
  const known = new Set(host.frames.keys())
  await gesture({ kind: 'click', name: 'click-the-pinned-button', at: aim.at },
    { wait: () => [...host.frames.values()].some((e) => !known.has(e.id) && e.prog.includes(PIN_ME)),
      ms: 20000 })
  const entry = await framed(host, `${PIN_ME} — `, known)
  const launched = shellCounts(shell)
  return {
    back, file, btn: { box: aim.box, hits: aim.hits, found: aim.found },
    launched,
    window: entry ? { id: entry.id, pid: entry.pid, prog: entry.prog, title: entry.win.titleText }
      : null,
    /* THE SLOT THE PIN OCCUPIES, AFTER THE LAUNCH. Windows 7 MERGES a running pinned program into
     * its own button rather than putting a second one beside it, and `Taskbar.sync` does it by the
     * group key being the pin's label — so the slot's `kind` turning from `pin` to `group` with the
     * SAME key is the merge, read as data. */
    slot: (launched.slots.find((s) => s.key === PIN_ME) || null),
    why: '',
  }
}

/* ---- load 2, proof 2: the save ---------------------------------------------------------------- */

/**
 * THE SAVE, DRIVEN THREE TIMES ON TWO PATHS — and the last one by real input alone.
 *
 * ctrl-S AND ctrl-shift-S ARE SYNTHESISED AND THE PAGE SAYS SO (header note 1): `scripts/cdp.py`
 * has no virtual key code for a Ctrl chord, which is the same gap M20 records for F2. What is NOT
 * synthesised is anything the gap does not force: the text is typed with real per-character key
 * events, the Save As name is typed, Enter is a real `rawKeyDown`, the X is a real click and the
 * `y` that answers the close dialog is a real key. THAT LAST ONE IS THE RETIRED DEFECT'S OWN
 * GESTURE — "save and close" wrote `[saved]` to the window fd and nothing to the file — so the
 * headline clause rests on a route with no synthesised key in it at all.
 */
async function driveSave (k, host) {
  const known = new Set(host.frames.keys())
  const docPath = `${ROOT}/${DOC_NAME}`
  const asPath = `${ROOT}/notes${AS_SUFFIX}.txt`
  /* THE CONTROL IS PER-PROCESS ARGV, armed on THIS editor and not on the `/usr` one below: that is
   * what scopes `--save-to-window-fd` to the bytes clause and leaves the EROFS clause standing. */
  const argv = ['editor', ...(CFG.saveToWindowFd ? ['--save-to-window-fd'] : []), docPath]
  const spawned = await spawnProgram(k, EDITOR, argv)
  const entry = await framed(host, `editor — ${docPath}`, known)
  if (!entry) throw new Error(`the editor window on ${docPath} never opened`)
  await raise(k, entry)
  place(entry, { x: 140, y: 30, w: 520, h: 230 })
  await pause(250)
  const opening = { title: entry.win.titleText, screen: screenOf(entry) }

  /* THE TEXT, TYPED FOR REAL. The widget takes the keyboard when it is focused, and `type_keys`
   * sends one `keyDown` carrying `text` per character — which is what makes `isTrusted` true and
   * what a `insertText` would never deliver. */
  entry.term.focus()
  await gesture({ kind: 'type', name: 'type-into-the-editor', text: TYPED },
    { wait: () => screenOf(entry).includes(TYPED), ms: 8000 })
  const typed = { screen: screenOf(entry), keys: { ...host.keyCounts() } }

  /* ctrl-S. The wait is the editor's OWN REPORT of the save, which it writes to its window fd
   * either way: `[saved N byte(s) to P]` or `P: ERRNO — NOT saved`. Waiting for a byte count alone
   * would hang on exactly the world the refusal clause is about. */
  const SAVED_MARK = '[saved'
  const NOT_SAVED = 'NOT saved'
  const beforeCtrlS = screenOf(entry).length
  synthKey(entry.term.el, 's', { ctrl: true })
  const ctrlSMs = Math.round(await until(() => {
    const screen = screenOf(entry).slice(beforeCtrlS)
    return screen.includes(SAVED_MARK) || screen.includes(NOT_SAVED)
  }, 15000))
  const afterCtrlS = {
    ms: ctrlSMs,
    screen: screenOf(entry).slice(beforeCtrlS),
    file: await bytesOf(k, docPath),
    had: await linesWith(k, docPath, DOC_TEXT),
    gained: await linesWith(k, docPath, TYPED),
    keys: { ...host.keyCounts() },
  }

  /* ctrl-shift-S: the SAVE AS dialog. Byte 19 again, told apart from the save by `WMOD_SHIFT` on
   * the record — so this gesture is also the proof that the modifier survives the trip from a
   * `KeyboardEvent` through `modifierBits` into a `WEV_KEY`. */
  const seen = new Set(host.frames.keys())
  synthKey(entry.term.el, 's', { ctrl: true, shift: true })
  const dialog = await framed(host, 'editor — Save As', seen, 15000)
  if (!dialog) throw new Error('ctrl-shift-S opened no `editor — Save As` window')
  await pause(200)
  dialog.term.focus()
  await gesture({ kind: 'type', name: 'type-the-save-as-name', text: AS_SUFFIX },
    { wait: () => screenOf(dialog).includes(`notes${AS_SUFFIX}`), ms: 8000 })
  const saveAs = { win: dialog.id, title: dialog.win.titleText, screen: screenOf(dialog) }
  /**
   * ENTER IS A REAL KEY: `scripts/cdp.py`'s `KEYS` has it, and it arrives as byte 10 through
   * `bytesForKey`.
   *
   * THE WAIT IS THE TITLE AND NOT THE DIALOG, and the difference is a RACE THIS PAGE MEASURED. Only
   * a save that landed closes the dialog (`commitSaveAs` keeps the field up when the name was
   * refused) — but that function destroys the dialog and only THEN calls `win_set_title`, which is a
   * syscall whose effect reaches this page as a later message. Waiting on the dialog alone read the
   * old title about one run in three, and `theSaveAsWroteTheOtherPath` went red with the save
   * perfectly fine. The title is the LAST thing the gesture produces, so it is the thing to wait for.
   */
  await gesture({ kind: 'key', name: 'press-enter-in-save-as', key: 'Enter' },
    { wait: () => !host.get(dialog.id) && entry.win.titleText === `editor — ${asPath}`,
      ms: 15000 })
  const afterSaveAs = {
    title: entry.win.titleText,
    screen: screenOf(entry),
    file: await bytesOf(k, asPath),
    had: await linesWith(k, asPath, DOC_TEXT),
    gained: await linesWith(k, asPath, TYPED),
    dialogGone: !host.get(dialog.id),
  }

  /* AND THE DOCUMENT IS MADE DIRTY AGAIN, BY REAL KEYS, because a Save As clears `dirty` and
   * `src/bin/editor.mjs` closes a clean buffer at once: without these bytes the X below would
   * destroy the window and the close dialog would never exist (see `AFTER_AS`). */
  await raise(k, entry)
  entry.term.focus()
  await gesture({ kind: 'type', name: 'type-after-the-save-as', text: AFTER_AS },
    { wait: () => screenOf(entry).includes(AFTER_AS), ms: 8000 })
  const dirtied = { screen: screenOf(entry) }

  /* THE X, FOR REAL — and the dialog it raises is the one `y` answers. `Win.closeBtn` is the
   * element; the frame posts `WEV_CLOSE` and nothing else (constraint 44), so the window is still
   * there afterwards and the dialog is the program's answer. */
  const closeAim = aimEl(entry.win.closeBtn, "the editor's Close button")
  const hadFrames = new Set(host.frames.keys())
  await gesture({ kind: 'click', name: 'click-the-editors-X', at: closeAim.at },
    { wait: () => [...host.frames.values()].some((e) => !hadFrames.has(e.id)
      && e.win.titleText === 'Save changes?'), ms: 15000 })
  const askWin = await framed(host, 'Save changes?', hadFrames, 5000)
  if (!askWin) throw new Error('the X raised no `Save changes?` dialog')
  const asked = {
    win: askWin.id, screen: screenOf(askWin),
    /* THE DESTINATION IS IN THE QUESTION, which is `askText`'s own contract: a dialog that said
     * "save and close" without saying where is an instruction a reader cannot check. */
    names: screenOf(askWin).includes(asPath),
  }
  askWin.term.focus()
  await gesture({ kind: 'type', name: 'answer-y-in-the-close-dialog', text: 'y' },
    { wait: () => !host.get(entry.id) && !host.get(askWin.id), ms: 20000 })
  const account = await resultOf(k, spawned.pid, 20000)
  const afterClose = {
    file: await bytesOf(k, asPath),
    gained: await linesWith(k, asPath, TYPED),
    editorGone: !host.get(entry.id),
    dialogGone: !host.get(askWin.id),
  }

  return {
    argv, pid: spawned.pid, docPath, asPath,
    opening, typed, afterCtrlS, saveAs, afterSaveAs, dirtied, asked, afterClose,
    account: accountOfEditor(account),
    keys: { ...host.keyCounts() },
  }
}

/** THE REFUSAL, IN A SECOND PROCESS WITH NO CONTROL ARMED. `/usr` is `MNT_RO` with
 *  `mutErrno: "EROFS"`, so the open succeeds, the document loads and the save cannot land — and the
 *  errno is asserted BY NAME, separately, because a single "it refused" passes for a refusal for
 *  the wrong reason (M3's `truncate` answered ENOENT where it owed EROFS). */
async function driveRefusedSave (k, host) {
  const known = new Set(host.frames.keys())
  const spawned = await spawnProgram(k, EDITOR, ['editor', RO_DOC])
  const entry = await framed(host, `editor — ${RO_DOC}`, known)
  if (!entry) throw new Error(`the editor window on ${RO_DOC} never opened`)
  await raise(k, entry)
  place(entry, { x: 140, y: 300, w: 520, h: 200 })
  await pause(250)
  const before = screenOf(entry).length
  synthKey(entry.term.el, 's', { ctrl: true })
  const ms = Math.round(await until(
    () => screenOf(entry).slice(before).includes('NOT saved'), 15000))
  const refused = { ms, screen: screenOf(entry).slice(before) }
  /* AND CLOSED WITH THE X ALONE, WHICH RAISES NO DIALOG — because nothing was typed here, so the
   * buffer is CLEAN and `src/bin/editor.mjs` closes a clean one at once. That is a reading rather
   * than a convenience: a refused save must not leave a document the program thinks is unsaved
   * work, and `why` says which of the two doors it went out of. */
  await raise(k, entry)
  await gesture({ kind: 'click', name: 'click-the-ro-editors-X', at:
    aimEl(entry.win.closeBtn, "the read-only editor's Close button").at },
  { wait: () => !host.get(entry.id), ms: 20000 })
  const account = await resultOf(k, spawned.pid, 20000)
  return { path: RO_DOC, pid: spawned.pid, refused, account: accountOfEditor(account) }
}

/** THE M22 FIELDS OF AN `editor` ACCOUNT, with a shape for a program that never reached them. A
 *  refusal path returns an account too, and defaulting rather than letting a clause dereference
 *  `undefined` is what makes such a run report FAILED CLAUSES over a stated exit code instead of a
 *  thrown page — the difference between a proof that failed and a harness that broke. */
function accountOfEditor (row = {}) {
  return {
    exit: row.exit,
    why: String(row.why || ''),
    savePath: String(row.savePath || ''),
    saved: (row.saved || []).map((s) => ({ path: String(s.path), bytes: s.bytes | 0 })),
    /* THE ERRNO ROWS ARE COPIED AND NOT NORMALISED: a defaulted `errno: ""` would make "it refused
     * with an errno" pass for a refusal that had none. */
    saveErrors: (row.saveErrors || []).map((e) => ({ ...e })),
    saveFailures: row.saveFailures | 0,
    docBytes: row.docBytes | 0,
    toWindowFd: row.toWindowFd === true,
    windowFdSaves: row.windowFdSaves | 0,
    saveAsOpened: row.saveAsOpened | 0,
    saveAsCancels: row.saveAsCancels | 0,
    menus: row.menus | 0,
    refusedMenus: row.refusedMenus | 0,
    typePicks: row.typePicks | 0,
    nameFaults: row.nameFaults | 0,
    keys: row.keys | 0,
    closes: row.closes | 0,
    refusals: row.refusals | 0,
    typed: String(row.typed || ''),
    opened: String(row.opened || ''),
    openError: String(row.openError || ''),
  }
}

/* ---- load 2, proof 3: the chord --------------------------------------------------------------- */

/**
 * THE SWITCHER, AND THE MENU THAT LABELS IT.
 *
 * SIX DISPATCHES, EACH ANSWERING ONE QUESTION the measurement left to the dispatcher:
 *
 *   forward      Alt+`        the top window changes to the next one DOWN the stack
 *   back         Alt+Shift+`  and it comes back, which is what makes either direction mean anything
 *   firefox      Alt+Shift+`  with `key: "~"` — FIREFOX'S OWN SPELLING, dispatched in Chrome. A
 *                             dispatcher bound on `key` misses this one and nothing says so
 *   wrong-code   Alt+`        with `code: "KeyQ"` and `key: "\`"` — the mirror: a dispatcher bound
 *                             on `key` would TAKE this one, and the real key is the other. It must
 *                             go THROUGH, which the program's own screen is the reading of
 *   superset     Alt+Ctrl+`   matches nothing, because `chordAt` is exact — and it goes through too
 *   slot         Alt+1        selects the first Superbar button, which is the direct-select set
 *
 * THE CHORDS GO INTO A PROGRAM THAT ECHOES, and that is the instrument rather than the fixture.
 * `editor` writes every printable it receives to its own window, so "the dispatcher TOOK the chord"
 * is readable as a screen that did not grow — and the two unbound dispatches are the positive
 * control for that reading, because the same `key` on a different `code` must arrive as a byte.
 */
async function driveSwitch (k, host, shell) {
  const stackOf = async () => {
    const st = await winState(k)
    return [...((st.wins || {}).stack || [])]
  }
  const open = shellCounts(shell)

  /* THE START MENU'S FOOT, WHERE THE TWO ROWS ARE. The accelerators are read off the DOM the shell
   * rendered — `report().accels` is `.shell-accel` text — because the requirement is that the MENU
   * shows the real accelerator, and asserting the chord table against itself would pass over a menu
   * that printed nothing at all. */
  const orbAim = aimEl(desktop.querySelector('[data-start]'), 'the start orb')
  await gesture({ kind: 'click', name: 'click-the-orb-for-the-switch-rows', at: orbAim.at },
    { wait: () => shell.report().popupKind === 'start', ms: 6000 })
  const menu = shellCounts(shell)
  const rows = {
    next: aimPopupRow(shell, 'Next window', 'the switch rows'),
    prev: aimPopupRow(shell, 'Previous window', 'the switch rows'),
  }
  /* AND IT IS CLOSED WITH A REAL Escape, which the shell binds on the desktop element. A menu left
   * open would sit over the taskbar for every gesture after this one — and it holds the keyboard,
   * which the chords below need. */
  await gesture({ kind: 'key', name: 'close-the-start-menu', key: 'Escape' },
    { wait: () => shell.popup.hidden === true, ms: 6000 })

  /* THE PROGRAM THE CHORDS ARE AIMED INTO: the editor the PINNED BUTTON started, still open. A
   * THROW and not a fallback if it is not there — a chord dispatched at nothing is a green clause
   * about a gesture that reached no handler. */
  /** The desktop's window id, which the cycle EXCLUDES: it is the surface the windows sit on and
   *  `switchWindow` skips `WROLE_DESKTOP` for `groups()`'s reason. Read off the shell so the page
   *  does not decide which window is the desktop. */
  const deskWin = (shell.desktopEntry() || { id: 0 }).id

  const into = await framed(host, 'editor — ', null, 2000)
  if (!into || !into.term) {
    throw new Error('the switch proof needs a text window that ECHOES to read "the chord was taken" '
      + `off; the frames are ${JSON.stringify(framesOf(host))}`)
  }
  await raise(k, into)
  into.term.focus()
  await pause(200)

  /* THE KEY COUNTS BEFORE ANY CHORD, so the clause about them is a DIFFERENCE and not a total: the
   * six dispatches below must raise `synthetic` by six and `trusted` by none, which is the page
   * measuring that it synthesised them rather than claiming it did not (header note 1). */
  const before = {
    stack: await stackOf(), counts: shellCounts(shell), keys: { ...host.keyCounts() },
    screen: screenOf(into).length,
  }
  /**
   * WHICH WINDOW A DIRECTION OWES, GIVEN THE ORDER THAT WAS IN FORCE.
   *
   * ONE MODULO OVER THE KERNEL'S OWN STACK, and it is here because the DIRECTION is what this proof
   * is about: "it switched" is satisfied by a switcher that picks at random. It is not a second copy
   * of `switchWindow` — that function also restores a minimized window, posts the raise and counts
   * — it is the one sentence of that function's docstring, as arithmetic: forward goes one step DOWN
   * the stack, because the window in front is the one you are leaving.
   *
   * AND IT IS COMPUTED PER PRESS, because a RAISE RE-ORDERS THE STACK. Forward then reverse does
   * NOT return a reader to where they started, and that is a property of raising rather than a
   * defect in either direction — Windows 7 holds a transient order only while Alt is down, and this
   * ABI has no held-chord state. The first version of this clause asserted the return and measured
   * `4 -> 3 -> 2`, which is the order moving under it.
   */
  const owed = (stack, top, dir) => {
    const ids = stack.filter((id) => id !== deskWin)
    if (!ids.length) return 0
    const at = ids.indexOf(top) >= 0 ? ids.indexOf(top) : ids.length - 1
    const step = dir >= 0 ? -1 : 1
    return ids[((at + step) % ids.length + ids.length) % ids.length]
  }

  const sends = []
  const topAfter = async (row, dir) => {
    /* WHAT THE PRESS WAS OWED, computed from the state BEFORE it: the stack and the top as the last
     * reading left them. */
    const prev = sends.length ? sends[sends.length - 1] : before
    row.owed = dir === null ? 0
      : owed(prev.stack, (prev.topmost === undefined ? prev.counts.topmost : prev.topmost) | 0, dir)
    await pause(500)
    row.stack = await stackOf()
    row.topmost = shell.report().topmost | 0
    row.switches = shell.report().switches | 0
    row.selects = shell.report().selects | 0
    /* HOW MUCH THE ECHOING PROGRAM'S SCREEN GREW SINCE THE LAST DISPATCH. 0 means the chord never
     * became a `WEV_KEY`, which is what "the dispatcher took it" means from outside the kernel. */
    const now = screenOf(into)
    row.screenGrew = now.length - (sends.length ? sends[sends.length - 1].screenAt : before.screen)
    row.screenAt = now.length
    sends.push(row)
    return row
  }

  const forward = await topAfter(sendChord(into.term, SWITCH_NEXT), SWITCH_NEXT.arg)
  /* THE REVERSE CHORD IS DISPATCHED AT THE SAME WIDGET, which is not a detail: the forward chord
   * raised another window, so a page that re-read the focus would be typing into whatever came up.
   * A reader holding Alt does not re-aim between notches either. */
  const backward = await topAfter(sendChord(into.term, SWITCH_PREV), SWITCH_PREV.arg)
  /* FIREFOX'S SPELLING OF THE SAME PHYSICAL KEY. Measured in `bench/m22-switch/probe.py`: BiDi lets
   * the ENGINE apply the layout, so a shifted backtick arrives as `key: "~"` there and as `key:
   * "\`"` over CDP, while `code` is `Backquote` in both. */
  const firefox = await topAfter(sendChord(into.term, SWITCH_PREV, { keyAs: '~' }),
    SWITCH_PREV.arg)
  /* THE MIRROR: the `key` a Chrome dispatcher would have matched, on the WRONG PHYSICAL KEY. */
  const wrongCode = await topAfter(sendChord(into.term, unboundChord('KeyQ', WMOD_ALT)), null)
  /* AND A SUPERSET, which must match nothing: Alt+Shift+` is its own row, so an Alt+` that fired on
   * any superset would make the reverse chord unreachable. */
  const superset = await topAfter(
    sendChord(into.term, unboundChord('Backquote', WMOD_ALT | WMOD_CTRL)), null)
  /* THE SLOT. `Alt+1` is `slots[0]`, which is the first button on the band — a pinned program with
   * no window LAUNCHES and a live one goes through the same three-way click rule the button has. */
  const slot = await topAfter(sendChord(into.term, slotChord(1)), null)

  return {
    open, menu, rows, before, sends,
    forward, backward, firefox, wrongCode, superset, slot,
    into: { id: into.id, title: into.win.titleText, prog: into.prog },
    after: shellCounts(shell),
    keys: { ...host.keyCounts() },
    /* WHAT THE TABLE SAYS, beside what the DOM showed. Two readings of one fact is the only way to
     * see them disagree. */
    table: {
      next: SWITCH_NEXT.label, prev: SWITCH_PREV.label, slots: SELECT_SLOTS,
      rows: CHORDS.length,
      blocked: BLOCKED.map((b) => ({ id: b.id, label: b.label, why: b.why })),
      slotLabels: Array.from({ length: SELECT_SLOTS }, (unused, i) => slotChord(i + 1).label),
    },
  }
}

/* ---- load 2, proof 4: the band ---------------------------------------------------------------- */

/**
 * THE VIEWPORT SEARCH, APPLIED TO THE DESKTOP ELEMENT RATHER THAN TO THE VIEWPORT.
 *
 * `bench/m22-band/probe.py` narrows the EMULATED VIEWPORT until the band overflows, and records why
 * the width cannot be a constant: the band needs two properties at once — narrower than its content
 * and wider than one button — and the window between them is about ten pixels wide and moves with
 * the tray, whose width moves with how wide the locale's clock renders.
 *
 * A PAGE CANNOT RESIZE ITS OWN VIEWPORT, and it does not have to: the taskbar is `left: 0; right: 0`
 * inside the desktop element (`src/wm/aero.mjs`), so the desktop's width IS the bar's width. So the
 * search runs here, in the product, with no emulation — which also means the clause is re-runnable
 * in a second engine, where `Emulation.setDeviceMetricsOverride` does not exist.
 *
 * `sync()` AFTER EVERY STEP, because `#syncChevrons` runs on a window-table change and on a VIEWPORT
 * resize, and this is neither. A band left un-synced reports `over: N` with both chevrons hidden,
 * which is the exact state the probe measured and reported as a defect.
 */
const BAND_WIDE_W = 560
const BAND_MIN_W = 150
const BAND_STEP_W = 6

function narrowUntilOverflow (shell) {
  const tried = []
  for (let w = BAND_WIDE_W; w >= BAND_MIN_W; w -= BAND_STEP_W) {
    desktop.style.width = `${w}px`
    shell.sync()
    const band = shell.report().band
    tried.push({ w, clientW: Math.round(band.clientW), scrollW: Math.round(band.scrollW),
      over: Math.round(band.over) })
    /* BOTH PROPERTIES, OR THE CLAUSE BELOW IS UNSATISFIABLE RATHER THAN FALSE: a band narrower than
     * one button has no scroll position at which the last button is wholly inside it. */
    if (band.over > 1 && band.clientW >= TASK_BTN_MIN_W) {
      return { width: w, tried, found: true }
    }
  }
  return { width: 0, tried, found: false }
}

/**
 * DRIVE THE BAND: a wheel on each axis, both chevrons, and the last button hit-tested.
 *
 * THE AXIS IS A CLAUSE AND NOT A DETAIL. A `mouseWheel` carrying `deltaY` moves a horizontal-only
 * scroller 0 px in both engines and `deltaX` moves it (`bench/m22-band/probe.py`, constraint 297's
 * shape), so a check that dispatched the wrong axis would assert a constant against a scroller that
 * never moved. The vertical one is driven FIRST and asserted to move nothing, which makes it this
 * clause's own negative control.
 */
async function driveBand (k, host, shell) {
  const wide = shellCounts(shell)
  const search = narrowUntilOverflow(shell)
  if (!search.found) {
    /* A HARNESS MUST FAIL WHEN IT CANNOT REACH WHAT IT WAS POINTED AT. There is no band to drive, so
     * the page says what it tried rather than reporting a clause about a state it never produced. */
    desktop.style.width = ''
    shell.sync()
    throw new Error('no desktop width between '
      + `${BAND_MIN_W} and ${BAND_WIDE_W} CSS px left the band overflowing AND wider than one `
      + `${TASK_BTN_MIN_W} px button. The band is ${wide.buttons} button(s) and ${wide.pins} pin(s) `
      + `wide: ${JSON.stringify(search.tried.slice(-6))}`)
  }
  const narrow = shellCounts(shell)
  const last = narrow.slots.length
  const bandEl = desktop.querySelector('[data-band]')
  const bandAim = aimEl(bandEl, 'the taskbar band')

  /**
   * THE CHEVRONS GO FIRST, AND THE ORDER IS A MEASUREMENT RATHER THAN A PREFERENCE.
   *
   * Each chevron is DISABLED where it has nowhere to go, so each has to be pressed from a position
   * where it is live: `next` from 0 and `prev` from somewhere past it. The first version of this
   * proof wheeled first and then pressed `prev`, which under `band-clips` meant pressing a chevron
   * that was correctly disabled at `scrollLeft: 0` — so a control scoped to the WHEEL turned two
   * chevron clauses as well, and the scope the slice contract asks for was unreachable.
   *
   * NO BRANCH ON THE POSITION, which would be a page deciding what to expect from the state the
   * control produced. Pressing `next` and then `prev` is live in BOTH worlds, because
   * `overflow: hidden` still permits a programmatic `scrollLeft` — measured, both engines.
   */
  const nextEl = desktop.querySelector('[data-band-chev="next"]')
  const prevEl = desktop.querySelector('[data-band-chev="prev"]')
  const nextAim = aimEl(nextEl, 'the next chevron')
  const atNext = shell.report().band.scrollLeft
  await gesture({ kind: 'click', name: 'click-the-next-chevron', at: nextAim.at },
    { wait: () => shell.report().band.scrollLeft > atNext + 0.5, ms: 6000 })
  const afterNext = shellCounts(shell).band
  const prevAim = aimEl(prevEl, 'the prev chevron')
  const atPrev = shell.report().band.scrollLeft
  await gesture({ kind: 'click', name: 'click-the-prev-chevron', at: prevAim.at },
    { wait: () => shell.report().band.scrollLeft < atPrev - 0.5, ms: 6000 })
  const afterPrev = shellCounts(shell).band

  /* THEN THE WHEEL'S VERTICAL AXIS, WHICH MUST MOVE NOTHING. `gapMs` is not needed — one notch is
   * one event and nothing here is counting a stream, so M17's reason for pacing does not apply. */
  await gesture({ kind: 'wheel', name: 'wheel-the-band-vertically', at: bandAim.at,
    deltaX: 0, deltaY: 120 }, { wait: 'settle' })
  const afterDeltaY = shellCounts(shell).band

  /* AND THE HORIZONTAL ONE, WHICH IS THE ONE CLAUSE `band-clips` KILLS: `overflow: hidden` refuses a
   * wheel and still permits a programmatic `scrollLeft`, so every other clause here HOLDS under that
   * control. It is driven from `scrollLeft: 0`, which the `prev` press above left it at. */
  await gesture({ kind: 'wheel', name: 'wheel-the-band-horizontally', at: bandAim.at,
    deltaX: 120, deltaY: 0 }, { wait: 'settle' })
  const afterDeltaX = shellCounts(shell).band

  /* AND THE LAST BUTTON, REVEALED AND HIT-TESTED AT ITS OWN CENTRE. `revealSlot` is the shell's own
   * — the same call `selectSlot` makes for a chord — and `reachable` is `elementFromPoint` finding
   * that button and not the tray or a popup over it, which is what "a hand could click this" means. */
  const revealed = shell.revealSlot(last)
  await pause(200)
  const afterReveal = shellCounts(shell)
  const lastBtnAim = revealed && afterReveal.slots[last - 1]
    ? aimEl(shell.slots[last - 1].btn, `band slot ${last}`)
    : null
  /* AND A REAL CLICK ON IT, because "reachable" is a hit test and "it does something" is a gesture.
   * The slot may be a PIN or a GROUP, so the effect asserted is the shell's own counter rather than
   * a window: `selectSlot`'s two branches are `launchPin` and `clickGroup`, and both of them are
   * what a click on that button already does. */
  let clicked = null
  if (lastBtnAim) {
    const hadClicks = shell.report().buttonClicks + shell.report().pinLaunches
    await gesture({ kind: 'click', name: 'click-the-last-band-button', at: lastBtnAim.at },
      { wait: () => (shell.report().buttonClicks + shell.report().pinLaunches) > hadClicks,
        ms: 8000 })
    clicked = shellCounts(shell)
  }

  /* THE DESKTOP GOES BACK TO ITS FULL WIDTH, and the shell is re-synced: the tray proof below aims
   * at an icon in that bar, and a 230 px desktop is not the one the rest of this page measured. */
  desktop.style.width = ''
  shell.sync()
  await pause(250)
  const restored = shellCounts(shell)

  return {
    wide, search, narrow, last,
    minBtnW: TASK_BTN_MIN_W, chevW: BAND_CHEV_W, barH: TASKBAR_H,
    band: bandAim.box,
    afterDeltaY, afterDeltaX, afterPrev, afterNext,
    revealed, afterReveal, clicked, restored,
  }
}

/* ---- load 2, proof 5: the tray ---------------------------------------------------------------- */

/**
 * THE TRAY ICON, CLICKED — AND THEN ITS PROCESS KILLED.
 *
 * `end-process` IS `reap(p, STAT_KILLED, SIGKILL)` in the kernel (`src/kernel/kernel.mjs`), which is
 * the same teardown a crash gets: fds closed, windows destroyed, nothing asked of the process. So
 * the withdrawal cannot be the desktop politely handing its row back — there is no such call, and
 * the one graceful door `src/bin/desktop.mjs` has (`env.win.items(fd, [])` at the end of `run`) is
 * not reached by a kill.
 *
 * THE CLICK COMES FIRST, because an icon that does nothing is not a tray icon. It is the third
 * rendering of one published list (a start-menu row, a desktop icon, a tray icon), and the verb it
 * runs is `spawn /usr/bin/taskmgr` — so the proof that the click worked is a WINDOW, and the proof
 * that the kill was aimed at the desktop and not at everything is that the window is still there
 * afterwards.
 */
/**
 * HOW LONG A WITHDRAWAL IS GIVEN. Measured on the live desktop: a kill with no inherited
 * description outstanding withdraws the icon in under 250 ms, so five seconds is not a tuned
 * number — it is the difference between a message that is late and one that is never coming.
 */
const TRAY_WAIT_MS = 5000

async function driveTray (k, host, shell, heirs = []) {
  const desk = shell.desktopEntry()
  if (!desk) throw new Error('there is no desktop window, so there is no tray row to withdraw')
  const before = shellCounts(shell)
  /* THE ROW'S FLAGS, READ THROUGH THE ABI'S OWN TWO PREDICATES. `isTrayRow` and `isPinnedRow` are
   * exclusive over all 256 flag words (`src/abi.mjs` asserts it at module load), and the bit that
   * separates them is `WITEM_MENU` — so a status icon that carried it would be drawn in the band as
   * a pin instead, which is the one way this row can be published wrong. */
  const rows = (desk.items || []).map((row, index) => ({
    index, label: row.label, flags: row.flags,
    tray: isTrayRow(row.flags), pinned: isPinnedRow(row.flags),
    hasMenu: (row.flags & WITEM_MENU) !== 0, hasTray: (row.flags & WITEM_TRAY) !== 0,
  }))
  const trayRows = rows.filter((r) => r.tray)
  const iconEls = [...desktop.querySelectorAll('[data-tray-icon]')]

  let clicked = null
  let opened = null
  if (iconEls.length === 1) {
    const aim = aimEl(iconEls[0], 'the tray icon')
    const known = new Set(host.frames.keys())
    await gesture({ kind: 'click', name: 'click-the-tray-icon', at: aim.at },
      { wait: () => [...host.frames.values()].some((e) => !known.has(e.id)), ms: 20000 })
    /* THE WINDOW `src/bin/taskmgr.mjs` OPENS IS TITLED "Task Manager", which is also the tray row's
     * own label — the row names the program it starts, which is what makes the icon legible. */
    opened = await framed(host, 'Task Manager', known, 5000)
    clicked = { aim: { box: aim.box, hits: aim.hits, found: aim.found }, counts: shellCounts(shell) }
  }

  /**
   * THE KILL, IN TWO STEPS, AND THE SECOND ONE IS WHERE A DEFECT THIS PAGE FOUND USED TO LIVE.
   *
   * STEP 1 is the plan's sentence: kill the process that published the row. By PID, through the
   * page's own supervisor route — the same one the start menu's `Log off` row uses — so nothing is
   * sent to the desktop's window and nothing is asked of the process.
   *
   * IT WAS NOT ENOUGH, AND `said` IS WHERE THAT WAS MEASURED: the kernel answered `reaped` and NO
   * `win-destroy`. `src/kernel/kernel.mjs`'s `spawnChild` inherits EVERY fd of the caller into the
   * child, window fds included, so the description's `refs` is 2 — and the fd walk in `teardown`
   * only decrements, so `src/kernel/files.mjs`'s `F_WIN.close` never ran and `WinMgr.destroyTree`
   * was never reached. The desktop spawns every program a reader starts, so ANY program running at
   * the time held its window: the frame stayed, the rows stayed, and the tray icon outlived its
   * process. `WinMgr.reapPid`, called from `teardown`, is the fix — constraint 14's "at
   * `terminate()`: close fds, DESTROY WINDOWS, drop the taskbar button" as two steps and not one.
   *
   * STEP 2 IS KEPT, and it is now the discriminating reading rather than a way around the defect:
   * the heirs hold descriptions on a window that is already gone, so killing them must leave the
   * tray empty and the icon absent. A kernel that went back to trusting the last close would turn
   * step 1 red and leave step 2 green, which is exactly the pair that located this in one run.
   */
  const pid = desk.pid
  const deskWin = desk.id
  const went = () => !host.get(deskWin) && shell.report().tray.length === 0
  const saidBefore = KMSG.length
  host.post({ t: 'end-process', pid })
  const wentMs = Math.round(await until(went, TRAY_WAIT_MS))
  await pause(200)
  const afterOwner = shellCounts(shell)
  const saidOfOwner = KMSG.slice(saidBefore)

  /* THE HEIRS: the pids the DESKTOP PROCESS spawned, which is where the inherited descriptions
   * are. Named by the proofs that caused them rather than guessed at, and filtered to the ones
   * still alive — a pid that has already exited holds nothing. */
  const saidBefore2 = KMSG.length
  /* THE PROGRAM THIS PROOF'S OWN CLICK STARTED IS AN HEIR TOO, and it has to be in the list: the
   * tray icon's verb is `spawn` IN THE DESKTOP PROCESS, so the window the click opened holds the
   * desktop's fd exactly as the pinned button's did. */
  const asked = [...heirs, opened ? opened.pid : 0].filter((p) => p > 0)
  const live = asked.filter((p) => [...host.frames.values()].some((e) => e.pid === p))
  for (const heir of live) host.post({ t: 'end-process', pid: heir })
  const wentAfterHeirsMs = live.length
    ? Math.round(await until(went, TRAY_WAIT_MS))
    : null
  await pause(200)
  const after = shellCounts(shell)
  const said = KMSG.slice(saidBefore)

  return {
    desk: { win: deskWin, pid, items: rows.length },
    rows, trayRows,
    icons: { before: iconEls.length,
      after: desktop.querySelectorAll('[data-tray-icon]').length,
      dataset: (desktop.querySelector('[data-tray-icons]') || { dataset: {} })
        .dataset.trayIcons || '' },
    clicked,
    opened: opened ? { id: opened.id, pid: opened.pid, title: opened.win.titleText } : null,
    heirs: { asked, live, said: KMSG.slice(saidBefore2) },
    before, afterOwner, after, wentMs, wentAfterHeirsMs, said, saidOfOwner,
    /* THE WINDOWS THE PAGE ITSELF SPAWNED, which inherited nothing: they are what says the kill was
     * AIMED rather than a page that ended everything. */
    strangers: framesOf(host).filter((f) => f.prog.includes('winopen')),
    frames: framesOf(host),
  }
}

/* =============================================================================================
   PROOF 1: THE PIN — a pinned button survives a reload, and launches.

   `docs/PLAN-SHELL.md` §M22: "A pinned button survives a reload and launches."

   THE CLAUSE COULD FAIL AGAINST A PIN LIST THAT WAS NEVER PERSISTED, and that is the whole reason
   the subject is `editor`: `src/bin/desktop.mjs`'s `DEFAULT_PINS` is `["files", "term"]` and is used
   when the file is ENOENT, so a world in which the write never landed publishes those two and
   `editor` is absent from the band, from the shell's report and from the file's bytes at once.
   ============================================================================================= */
function proofPins (load1, load2) {
  const pins = {
    load1: {
      pinsBefore: load1.pinsBefore,
      pinned: load1.after.pinned,
      pins: load1.after.pins,
      file: load1.file,
      orb: load1.orb,
      row: load1.row,
      menuRows: load1.opened.popupRows.length,
      filteredRows: load1.filtered.listRows,
      filteredPopup: load1.filtered.popupRows,
    },
    load2: {
      pinned: load2.back.pinned,
      pins: load2.back.pins,
      slots: load2.back.slots,
      file: load2.file,
      btn: load2.btn,
      launched: load2.window,
      slot: load2.slot,
      why: load2.why,
    },
    subject: PIN_ME,
    path: PINS_PATH,
    reloaded: globalThis.M22.reload,
  }

  /* THE RELOAD HAPPENED, AND IT IS INFRASTRUCTURE AS A CLAUSE. `window.__m22mark` is set in load 1
   * and cannot survive a navigation, so its absence here is what makes every clause below a reading
   * of a page built from zero rather than of the still-live first shell. The epoch pins the stash to
   * THIS run. */
  pins.thePageReallyReloaded = globalThis.M22.reload.navigated === true
    && globalThis.M22.reload.markSurvived === false
    && globalThis.M22.reload.epochMatched === true

  /* THE SUBJECT WAS NOT PINNED BEFORE THE GESTURE, which is what stops every clause below passing
   * over a desktop that simply published its defaults. */
  pins.theSubjectWasNotPinnedToBeginWith = !load1.pinsBefore.includes(PIN_ME)
    && load1.pinsBefore.length > 0

  /* THE GESTURE WAS A REAL ROW IN A REAL MENU: the orb and the row were both hit-tested at the point
   * the click went to, and the shell filtered to exactly the row that was clicked. */
  pins.theGestureLandedOnTheRow = load1.orb.hits === true && load1.row.hits === true
    && load1.row.index >= 0 && load1.row.label === `Pin ${PIN_ME}`
    /* THE PROGRAM LIST FILTERED TO ONE ROW, which is the shell's own count on `.start-list` and
     * NOT `popupRows`: that is every row in the popup, and the menu's foot carries three of its
     * own. `aimPopupRow` is the other half — it THROWS unless exactly one row wears the label — so
     * between them the click cannot have gone to a row nobody chose. */
    && load1.filtered.listRows === 1
  /* AND THE PIN APPEARED AT ONCE, before any reload: the desktop re-publishes after it writes, so a
   * button that only arrived on the next load would be a write with no acknowledgement. */
  pins.theBandTookThePinImmediately = load1.after.pinned.some((p) => p.label === PIN_ME)
    && load1.after.pins === load1.before.pins + 1

  /* THE FILE HOLDS THE LIST, AS BYTES, out of `wc` and `grep` processes that hold no fd of the
   * desktop's. The length is DERIVED from the names the shell published rather than written out: the
   * format is one name per line with a trailing newline (`writePins`), so the arithmetic is the
   * names and nothing else. */
  const wantBytes = [...load1.pinsBefore, PIN_ME].reduce((n, name) => n + name.length + 1, 0)
  pins.thePinFileHoldsTheList = load1.file.counts.exit === 0
    && load1.file.counts.bytes === wantBytes
    && load1.file.counts.lines === load1.pinsBefore.length + 1
    && load1.file.subject.matched === 1 && load1.file.subject.exit === 0
  /* AND IT IS A REGULAR FILE AND NOT A DIRECTORY SOMETHING ELSE MADE. */
  pins.thePinFileIsAFile = load1.file.stat.exit === 0
    && load1.file.stat.type === 'regular file'

  /* AFTER THE RELOAD: THE SAME BYTES, AND THE SAME BUTTON. Both, because the file surviving and the
   * band showing it are two facts — a desktop that read the file and dropped the name would satisfy
   * the first alone, which is `pinnable`'s own failure mode. */
  pins.theFileSurvivedTheReload = load2.file.counts.exit === 0
    && load2.file.counts.bytes === load1.file.counts.bytes
    && load2.file.counts.lines === load1.file.counts.lines
    && load2.file.subject.matched === 1
  pins.theButtonCameBack = load2.back.pinned.some((p) => p.label === PIN_ME)
    && load2.btn !== null && load2.btn.hits === true
  /* AND IT IS A BUTTON AND NOT A WINDOW GROUP: before the launch the subject has no window at all,
   * so its slot's `kind` is `pin`. */
  const slotBefore = load2.back.slots.find((s) => s.key === PIN_ME) || null
  pins.thePinnedSlotHadNoWindow = Boolean(slotBefore) && slotBefore.kind === 'pin'

  /* AND IT LAUNCHES. The window is the effect, and the ROUTE is the shell's own counter: a pin
   * launch is a `WITEM_MENU` activation on the publishing process, so `pinLaunches` rising with

   `docs/PLAN-SHELL.md` §M22: "`editor`'s save writes bytes to the file, read back through a fresh
   `open`." And the defect it retires is named at `src/bin/editor.mjs:25`: the save wrote `[saved]`
   to the WINDOW fd, so a reader was told their edit was saved and it was not.

   fresh `open` before it reports — that is the program's clause — and `wc` and `grep` out of
   processes that were not alive when the write happened are the page's. `--save-to-window-fd` leaves
   the editor's own screen, the dialog, the cascade and the reported COUNT identical and moves only
   these readings, which is exactly how the defect shipped.

    argv: run.argv,
    docPath: run.docPath,
    asPath: run.asPath,
    opening: { title: run.opening.title },
    afterCtrlS: run.afterCtrlS,
    saveAs: { win: run.saveAs.win, title: run.saveAs.title },
    afterSaveAs: run.afterSaveAs,
    asked: run.asked,
    afterClose: run.afterClose,

     * typed. `echo` adds the newline, so the opened file is `DOC_TEXT\n` and the document is that
     * plus what the keyboard put there, neither of which ends in a newline of its own.
     *

     * shorter document and the close dialog's `y` writes the longer one, so a `y` that wrote
     * nothing leaves the file at `afterTyped` and is visible as a count rather than as a path that
     * happens to exist. */

   * the program — a save clause over a document the keyboard never reached is a clause about an
   * empty file. */

    && run.account.openError === ''
    && run.opening.title === `editor — ${run.docPath}`

    && run.typed.screen.includes(TYPED)
  /* AND THE KEYS THE PAGE SYNTHESISED ARE COUNTED APART FROM THE ONES IT DID NOT. `WinHost` counts
   * `isTrusted` separately for exactly this reason: the text and the `y` are real and the two Ctrl
   * chords are not, and the page says which is which rather than claiming all of it was real. */

    && run.keys.synthetic >= 2

   * alone passes for a file of the right length holding something else. */

    && run.afterCtrlS.file.bytes === save.want.afterTyped
    && run.afterCtrlS.had.matched === 1
    && run.afterCtrlS.gained.matched === 1

   * before it reports a count, so a row in `saved` is the program's claim and this is the
   * independent one — the two agreeing is what makes either worth reading. */

    && run.account.saved[0].path === run.docPath

   * byte 19 with `WMOD_SHIFT`, which is the only thing that tells it from a save — so this clause is
   * also the proof that the modifier survived the trip into a `WEV_KEY`. */

    && run.saveAs.title === 'editor — Save As'
    && run.account.nameFaults === 0

    && run.afterSaveAs.file.bytes === save.want.afterTyped
    && run.afterSaveAs.gained.matched === 1
    && run.afterSaveAs.dialogGone === true
    && run.afterSaveAs.title === `editor — ${run.asPath}`
  /* AND THE DESTINATION MOVED WITH IT: the close dialog names the NEW path, which is `askText`'s own
   * contract — `y` writes there, so the question has to say so. */

    && run.account.savePath === run.asPath

    && run.account.saved[2].path === run.asPath

     * this path and only the `y` can have made it `final`. */

    && run.afterClose.file.bytes > run.afterSaveAs.file.bytes
    && run.afterClose.gained.matched === 1

   * one number that is not a reading of the bytes: 0 here and 3 under the control. */

    && run.account.toWindowFd === false
    && run.account.saveFailures === 0 && run.account.saveErrors.length === 0

   * separately from the absence of bytes, because "it did not save" passes for a save that failed
   * for the wrong reason. */

    && err.path === ro.path

    && ro.account.saveFailures === 1
    && ro.account.windowFdSaves === 0

     * holding unsaved work: nothing was typed, so the buffer is clean and the X closes it without
     * asking — `why` is which door, and `closed with nothing to save` is the right one. */

    && ro.refused.screen.includes('NOT saved')

    && save.theSyntheticKeysAreCountedApart
    && save.theSaveWroteTheBytes && save.theProgramReportedWhatIsInTheFile
    && save.theScreenReportedTheSave
    && save.theSaveAsDialogOpened && save.theSaveAsWroteTheOtherPath
    && save.theCloseDialogNamedTheDestination && save.theCloseSavedBeforeItClosed
    && save.nothingWasWrittenToTheWindowFdInstead

    + run.afterCtrlS.file.bytes + ' of ' + save.want.afterTyped + ' byte(s) in ' + run.docPath
    + ' and ' + run.afterClose.file.bytes + ' of ' + save.want.final + ' in ' + run.asPath
    + '; window-fd saves ' + run.account.windowFdSaves + '; ' + ro.path + ' answered '
    + ((err && err.errno) || 'NOTHING'))

    && sw.theForwardChordSwitched && sw.theReverseChordWentTheOtherWay
    && sw.theChordsWerePrevented
    && sw.theTakenChordsNeverReachedTheProgram
    && sw.theChordIsBoundToTheCodeAndNotTheKey && sw.theWrongPhysicalKeyDoesNothing
    && sw.theWrongPhysicalKeyReachedTheProgramInstead
