   * only a world if the two agree. */
  band.theBandIsAScroller = run.narrow.band.overflowX === 'auto'
  /* AND THE LAST BUTTON IS OUT OF VIEW TO BEGIN WITH, which is the defect this proof is about: the
   * DOM has every button whether it fits or not. */
  const lastBefore = run.narrow.slots[run.last - 1] || null
  band.theLastButtonStartsOutOfView = Boolean(lastBefore) && lastBefore.inView === false
    && run.narrow.slots.length === run.last && run.last >= 2

  /* THE CHEVRONS ARE SHOWN WHILE IT OVERFLOWS, and the one with nowhere to go is DISABLED — Windows
   * 7's own rule for an inapplicable command, and this project's for a caption button. At
   * `scrollLeft: 0` that is `prev`. */
  const chev = (row, dir) => (row.chevrons || []).find((c) => c.dir === dir) || {}
  band.theChevronsAppearWithTheOverflow = chev(run.narrow.band, 'prev').shown === true
    && chev(run.narrow.band, 'next').shown === true
    && chev(run.narrow.band, 'prev').enabled === false
    && chev(run.narrow.band, 'next').enabled === true

  /* BOTH CHEVRONS WORK, CLICKED FOR REAL: forward from 0 and back to it, through the shell's own
   * `scrollBand` — which the counter says, because a page that had set `scrollLeft` itself would
   * have moved the band without going through the control a reader presses. THEY HOLD UNDER
   * `band-clips`, because `overflow: hidden` does not stop a programmatic scroll. */
  band.aRealChevronClickScrollsItOn = run.afterNext.scrollLeft > 0
  band.aRealChevronClickScrollsItBack = run.afterPrev.scrollLeft < run.afterNext.scrollLeft
  band.theChevronsWentThroughTheShell = run.restored.bandScrolls >= run.narrow.bandScrolls + 2

  /* A DRIVEN WHEEL REACHES PAST THE FLOOR — AND ONLY ON THE HORIZONTAL AXIS. The vertical one is
   * this clause's own negative control: measured, a `deltaY` over a horizontal-only scroller moves
   * it 0 px, so a check that dispatched the wrong axis would be asserting a constant against a
   * scroller that never moved. THESE TWO ARE THE CLAUSES `band-clips` TAKES, with
   * `theBandIsAScroller` — which is the control's own applied-ness reading — and nothing else here
   * moves under it. */
  band.aVerticalWheelMovesItNothing = run.afterDeltaY.scrollLeft === 0
  band.aDrivenHorizontalWheelScrollsIt = run.afterDeltaX.scrollLeft > 0

  /* AND THE LAST BUTTON IS REACHABLE: wholly inside the band's box, and `elementFromPoint` at its
   * own centre finds THAT button. Both, because a button inside the box but under the tray or a
   * popup is still a button a hand cannot click. */
  band.theLastButtonIsReachable = Boolean(run.revealed)
    && run.revealed.slot === run.last
    && run.revealed.inView === true && run.revealed.reachable === true
  /* AND A REAL CLICK ON IT DID SOMETHING. `revealSlot` is a hit test; this is the gesture. */
  band.aRealClickOnItIsTakenByTheShell = Boolean(run.clicked)
    && (run.clicked.buttonClicks + run.clicked.pinLaunches)
      > (run.afterReveal.buttonClicks + run.afterReveal.pinLaunches)

  /* AND THE DESKTOP WENT BACK TO ITS FULL WIDTH, so the proof after this one is aiming at the bar
   * every other reading on this page was taken against. */
  band.theDesktopWasRestored = run.restored.band.over <= 1 && run.restored.band.fits === true

  band.ok = band.theBandOverflowsAndStillHoldsAButton && band.theFloorIsTheOneTheSkinPublishes
    && band.theBandIsAScroller && band.theLastButtonStartsOutOfView
    && band.theChevronsAppearWithTheOverflow
    && band.aVerticalWheelMovesItNothing && band.aDrivenHorizontalWheelScrollsIt
    && band.aRealChevronClickScrollsItBack && band.aRealChevronClickScrollsItOn
    && band.theChevronsWentThroughTheShell
    && band.theLastButtonIsReachable && band.aRealClickOnItIsTakenByTheShell
    && band.theDesktopWasRestored
  globalThis.M22.proofs.band = { ok: band.ok, evidence: band }
  say((band.ok ? 'ok  ' : 'BAD ') + 'band: ' + run.search.width + ' px desktop leaves a '
    + Math.round(run.narrow.band.clientW) + ' px band over ' + Math.round(run.narrow.band.scrollW)
    + ' px of buttons (' + Math.round(run.narrow.band.over) + ' px past it); wheel deltaY -> '
    + run.afterDeltaY.scrollLeft + ', deltaX -> ' + run.afterDeltaX.scrollLeft
    + ', chevrons -> ' + run.afterPrev.scrollLeft + '/' + run.afterNext.scrollLeft
    + '; slot ' + run.last + ' reachable=' + Boolean(run.revealed && run.revealed.reachable))
}

/* =============================================================================================
   PROOF 5: THE TRAY — the icon is withdrawn when its process DIES.

   `docs/PLAN-SHELL.md` §M22: "A tray icon is withdrawn when its process dies — asserted by killing
   the process, not by asking it to withdraw."

   SO THE GESTURE IS A KILL. `end-process` is `reap(p, STAT_KILLED, SIGKILL)`: fds closed, windows
   destroyed, nothing asked of the process (constraint 14 — teardown is not reap). The classic tray
   defect is an icon that outlives its process, and the SHELL has no way to produce one because
   `trayRows()` derives the tray from `host.frames` on every `sync` — the KERNEL had one, and
   header note 2 is where that is recorded. `?tray_outlives=1` is the world where the shell
   REMEMBERS instead, which is this page's own control (header note 3).
   ============================================================================================= */
function proofTray (run) {
  const tray = {
    desk: run.desk,
    rows: run.rows.filter((r) => r.hasTray),
    trayRows: run.trayRows,
    icons: run.icons,
    before: run.before.tray,
    after: run.after.tray,
    clicked: run.clicked,
    opened: run.opened,
    heirs: run.heirs,
    strangers: run.strangers,
    wentMs: run.wentMs,
    wentAfterHeirsMs: run.wentAfterHeirsMs,
    said: run.said,
    saidOfOwner: run.saidOfOwner,
    frames: run.frames,
    controls: { trayOutlives: CFG.trayOutlives },
  }

  /* THE ICON WAS THERE, AND IT WAS A STATUS ICON AND NOT A PIN. `isTrayRow` and `isPinnedRow` are
   * exclusive over the whole flag word and the bit between them is `WITEM_MENU`, so a status icon
   * carrying it would have been drawn in the band — which is the one way this row can be published
   * wrong, and it is a different picture rather than an error. */
  tray.theTrayDrewExactlyOneStatusIcon = run.before.tray.length === 1
    && run.icons.before === 1
    && run.trayRows.length === 1
    && run.trayRows[0].hasMenu === false && run.trayRows[0].pinned === false
  tray.theRowIsTheDesktopProcesses = run.before.tray.length === 1
    && run.before.tray[0].win === run.desk.win
    && run.before.tray[0].pid === run.desk.pid
    && run.before.tray[0].label === 'Task Manager'

  /* AND A REAL CLICK ON IT RAN THE VERB. An icon that does nothing is not a tray icon, and the
   * route is the third rendering of one published list: `activateItem(win, index, WITEM_TRAY)` into
   * the process that published the row, which spawns. The effect is a WINDOW. */
  tray.aRealClickOnTheIconStartedTheProgram = Boolean(run.clicked)
    && run.clicked.aim.hits === true
    && run.clicked.counts.trayClicks === 1
    && run.opened !== null

  /* THE KILL WITHDREW IT — THE PLAN'S SENTENCE. No withdraw call exists to be skipped: the row
   * lives on the desktop's window, so `terminate()` destroys the window (constraint 14) and the
   * next `sync` has nothing to draw. `wentMs` is the OBSERVED transition and not a state read after
   * a pause: a clause reading only `afterOwner.tray.length === 0` would also pass for a tray that
   * was empty the whole time, which is the vacuous reading this pair exists to refuse. */
  tray.theIconWentWhenItsOwnProcessDied = run.afterOwner.tray.length === 0
    && run.wentMs >= 0
  /* AND THE KERNEL SAID BOTH HALVES OF A DEATH. `reaped` alone is a process that died with its
   * windows still up, which is the reading that located the cause. */
  tray.theKernelDestroyedItsWindowsToo = run.saidOfOwner.some((m) => m.t === 'reaped')
    && run.saidOfOwner.some((m) => m.t === 'win-destroy')

  /* AND IT DID GO WHEN THE LAST HOLDER OF THE DESCRIPTION DIED, which is the measurement of the
   * cause rather than a way around it: the heirs are the processes the desktop SPAWNED, and the
   * window outlives its owner exactly as long as one of them holds the fd it inherited. Three
   * readings — the shell's report, the DOM, and the count the element publishes. */
  tray.theIconWentWhenTheLastHolderDied = run.after.tray.length === 0
    && run.icons.after === 0
    && run.icons.dataset === '0'
    && (run.wentAfterHeirsMs === null || run.wentAfterHeirsMs >= 0)
  /* AND THE WINDOW WENT WITH IT, which is what says the withdrawal was teardown and not a program
   * tidying up: the desktop window is gone from the page's own table. */
  tray.theDesktopWindowWentWithTheProcess = !run.frames.some((f) => f.id === run.desk.win)

  /* AND THE KILLS WERE AIMED. The windows the PAGE spawned — `winopen`'s two — inherited nothing
   * from the desktop and are still there, so this is a withdrawal and not a page that ended
   * everything, which a clause reading only the empty tray would have passed for. */
  tray.theProcessesThePageStartedAreStillRunning = run.strangers.length === 2
    && run.strangers.every((f) => run.frames.some((g) => g.id === f.id))

  tray.ok = tray.theTrayDrewExactlyOneStatusIcon && tray.theRowIsTheDesktopProcesses
    && tray.aRealClickOnTheIconStartedTheProgram
    && tray.theIconWentWhenItsOwnProcessDied && tray.theKernelDestroyedItsWindowsToo
    && tray.theIconWentWhenTheLastHolderDied && tray.theDesktopWindowWentWithTheProcess
    && tray.theProcessesThePageStartedAreStillRunning
  globalThis.M22.proofs.tray = { ok: tray.ok, evidence: tray }
  /* THE NOTE NAMES WHICH SIDE FAILED, because the two worlds that produce an icon outliving its
   * process have different addresses and the same picture. `win-destroy` is the discriminator: with
   * it, the kernel tore the window down and what is still drawing a row is the SHELL; without it,
   * teardown did not destroy a window the dying process created. A note that asserted one cause
   * would be wrong in the other world — this page shipped exactly that note and `--negative
   * tray-outlives` printed it claiming "no win-destroy" beside a log containing one. */
  if (!tray.theIconWentWhenItsOwnProcessDied) {
    const said = JSON.stringify(run.saidOfOwner.map((m) => m.t))
    globalThis.M22.notes.push(tray.theKernelDestroyedItsWindowsToo
      ? ('A TRAY ICON OUTLIVED ITS PROCESS WITH ITS WINDOW ALREADY GONE: killing pid '
        + `${run.desk.pid} drew ${said} out of the kernel, so teardown destroyed the window and `
        + 'the row still on screen is one the SHELL is holding. src/wm/taskbar.mjs trayRows() '
        + 'DERIVES the tray from host.frames on every sync, so a remembered row is the only way '
        + 'this picture exists — which is what ?tray_outlives=1 builds.')
      : ('A TRAY ICON OUTLIVED ITS PROCESS AND SO DID ITS WINDOW: killing pid '
        + `${run.desk.pid} drew ${said} out of the kernel — no win-destroy, so `
        + 'WinMgr.reapPid (src/kernel/wins.mjs, called from teardown in src/kernel/kernel.mjs) '
        + 'did not run or did not reach this window. It cannot be the fd walk: '
        + 'spawnChild copies EVERY fd into a child, window fds included, so the description kept '
        + `refs > 0 and F_WIN.close could not fire. Killing its heirs ${JSON.stringify(run.heirs.live)} `
        + 'is what released it before that call existed. Constraint 14 says teardown DESTROYS '
        + 'WINDOWS, as a step of its own.'))
  }
  say((tray.ok ? 'ok  ' : 'BAD ') + 'tray: ' + run.icons.before + ' icon(s) -> click opened '
    + ((run.opened && run.opened.title) || 'NOTHING') + ' -> killed pid ' + run.desk.pid
    + ' -> ' + run.afterOwner.tray.length + ' icon(s) after '
    + JSON.stringify(run.saidOfOwner.map((m) => m.t)) + ' -> killed its heirs '
    + JSON.stringify(run.heirs.live) + ' -> ' + run.icons.after + ' icon(s)')
}

/* ---- the live desktop ------------------------------------------------------------------------- */

/**
 * THE WINDOWS THE LIVE DESKTOP OPENS, as specs `www/shell.mjs` stages.
 *
 * CLEAR OF THE ICON COLUMN, because the shared staging runs the `desktop` process and that process
 * publishes rows: a window at the desktop's left edge sits on top of the icons, which is constraint
 * 289's own failure. `term` is LAST because it spawns `sh` by syscall.
 */
const LIVE_X = 150
const LIVE_PROGRAMS = [
  {
    ...PROGRAMS.files,
    name: 'files',
    box: () => ({ x: LIVE_X, y: 20, w: 600, h: 290 }),
  },
  {
    ...PROGRAMS.term,
    box: (wa) => ({ x: LIVE_X, y: 330, w: 600, h: Math.max(160, wa.h - 350) }),
  },
]

/** WHAT THIS MILESTONE ADDED, appended to the shared help. ADDED rather than substituted, so a
 *  reader here still learns what the rest of the shell does — and in a second engine this log is
 *  the only channel there is. */
const M22_HELP = [
  `  press ${SWITCH_NEXT.label} to go to the next window and ${SWITCH_PREV.label} to go back;`,
  `  Alt+1..Alt+${SELECT_SLOTS} pick a taskbar button directly, and every button shows its own`,
  '  accelerator. Alt+Tab is the browser\'s and is deliberately not offered',
  '  the start menu has a `Pin <program>` row for every program that opens a window: a pinned',
  `  button stays on the bar across a reload, because the list is a file (${PINS_PATH})`,
  '  the notification area has a Task Manager icon; it goes when the desktop process does',
  '  narrow the browser window until the buttons stop shrinking: the band scrolls, with a',
  '  chevron at each end, so no running program is ever out of reach',
  '  `editor <file>` now SAVES: ctrl-S writes the file, ctrl-shift-S is Save As, and the close',
  '  dialog\'s `y` saves before it closes — the bytes are read back before any of them says so',
]

async function live () {
  const { host, shell } = await stageDesktop({
    into: desktop,
    report: globalThis.M22,
    say,
    label: 'm22',
    programs: LIVE_PROGRAMS,
    help: DESKTOP_HELP.concat(M22_HELP),
  })
  publish(host, shell)
}

/**
 * WHAT THIS PAGE PUBLISHES FOR A DRIVER THAT IS NOT THIS PAGE, whichever path built the host.
 *
 * `aimAt` hands back the VIEWPORT point, which is the only unit `input.performActions` and
 * `Input.dispatchMouseEvent` both take, and REPORTS the reason rather than throwing across the
 * evaluate boundary: a thrown error arrives at a driver as `null`.
 */
function publish (host, shell) {
  HOST = host
  SHELL = shell
  globalThis.M22.host = host
  globalThis.M22.shell = shell
  globalThis.M22.dpr = dpr()
  globalThis.M22.viewport = { w: window.innerWidth, h: window.innerHeight }
  globalThis.M22.paths = { home: HOME_DIR, root: ROOT, pins: PINS_PATH, doc: `${ROOT}/${DOC_NAME}` }
  /* THE CHORD TABLE, PUBLISHED AS DATA. A driver in another engine must not spell "Alt+`": the
   * label is `src/wm/chords.mjs`'s and a bench script's copy of it is the drift CLAUDE.md's table
   * exists to stop. */
  globalThis.M22.chords = {
    next: { ...SWITCH_NEXT }, prev: { ...SWITCH_PREV },
    slots: Array.from({ length: SELECT_SLOTS }, (unused, i) => ({ ...slotChord(i + 1) })),
    blocked: BLOCKED.map((b) => ({ ...b })),
    actions: { switch: CHORD_SWITCH, select: CHORD_SELECT },
  }
  globalThis.M22.aimAt = (what, key) => {
    try {
      if (what === 'orb') return aimEl(desktop.querySelector('[data-start]'), 'the orb')
      if (what === 'band') return aimEl(desktop.querySelector('[data-band]'), 'the band')
      if (what === 'chevron') {
        return aimEl(desktop.querySelector(`[data-band-chev="${String(key)}"]`), 'a chevron')
      }
      if (what === 'pin') {
        return aimEl(desktop.querySelector(`[data-pin-btn="${String(key)}"]`), 'a pin button')
      }
      if (what === 'tray') {
        return aimEl(desktop.querySelectorAll('[data-tray-icon]')[Number(key) || 0], 'a tray icon')
      }
      if (what === 'popup') {
        if (!shell) return { error: 'this page has no shell, so there is no popup' }
        return aimPopupRow(shell, String(key), 'a driver in another engine')
      }
    } catch (e) {
      return { error: String((e && e.message) || e) }
    }
    return { error: `no aim named ${what}; orb, band, chevron, pin, tray and popup are the six` }
  }
}

/* ---- the two loads --------------------------------------------------------------------------- */

/** The query string this page reloads itself with: the proofs, load 2, the epoch, and every control
 *  that was in force — a world that evaporated at the navigation would make load 2 the unmodified
 *  one and the run green over a control nobody applied. */
function phase2Url (epoch) {
  const next = new URLSearchParams({ proofs: '1', phase: '2', epoch })
  if (CFG.bandClips) next.set('band_clips', '1')
  if (CFG.saveToWindowFd) next.set('save_to_window_fd', '1')
  if (CFG.trayOutlives) next.set('tray_outlives', '1')
  return `${location.pathname}?${next.toString()}`
}

/**
 * LOAD 1: BOOT, CLEAR THE PIN FILE, STAGE THE DESKTOP, MAKE THE PIN, AND NAVIGATE.
 *
 * THE PIN FILE IS REMOVED FIRST AND IT IS NOT TIDINESS. OPFS outlives a page load, so a second run
 * would find `editor` already pinned and the gesture would UNPIN it — the same clause, inverted,
 * with every reading still green. It is removed BEFORE the desktop process starts, because
 * `publish` reads the file once per publish and the defaults are what a fresh desktop must show.
 */
async function loadOne () {
  say('M22 load 1 of 2 — the pin gesture. Every gesture here is REAL input: a synthesised event is')
  say('isTrusted === false (175). The page then NAVIGATES, which is what R24 is about.')
  sessionStorage.removeItem(STASH_KEY)
  const booted = await bootShell({
    into: desktop, report: globalThis.M22, say, label: 'm22', taskbar: true, tap: kernelTap,
  })
  const { k, host, shell } = booted
  publish(host, shell)
  KERNEL = k

  /* THE SESSION'S TREE IS A PRECONDITION AND NOT A HOPE. The pin file, the saved document and the
   * default save destination are all under `HOME_DIR`, and a volume whose seed did not run has
   * none — so a run there would report a page of red clauses with the cause three layers down. */
  const seeded = await statOf(k, HOME_DIR)
  if (seeded.exit !== 0 || seeded.type !== 'directory') {
    throw new Error(`${HOME_DIR} is not a directory (stat exit ${seeded.exit}, type `
      + `${JSON.stringify(seeded.type)}): the session's writable copy of the read-only base is what `
      + 'the pin list and every save on this page live in. The kernel reported '
      + `${JSON.stringify(globalThis.M22.seed || null)}`)
  }
  const cleared = await runProgram(k, RM, ['rm', '-f', PINS_PATH])
  const tree = await runProgram(k, MKDIR, ['mkdir', '-p', ROOT])
  const wrote = await writeLine(k, `${ROOT}/${DOC_NAME}`, DOC_TEXT)
  say(`staged ${ROOT}: rm ${PINS_LEAF} exit ${cleared.exit}, mkdir exit ${tree.exit}, `
    + `echo exit ${wrote.exit} for ${echoBytes(DOC_TEXT)} byte(s)`)

  await stageDesktop({
    booted, into: desktop, report: globalThis.M22, say, label: 'm22',
    programs: [], help: [], diagnose: false,
  })

  const stash = await drivePin(k, host, shell)
  globalThis.M22.load1 = stash
  say(`pinned ${PIN_ME}: the band now shows [`
    + stash.after.pinned.map((p) => p.label).join(' ') + '] and '
    + `${stash.file.counts.bytes} byte(s) are in ${PINS_PATH}`)

  sessionStorage.setItem(STASH_KEY, JSON.stringify(stash))
  /* THE MARKER THE NAVIGATION HAS TO DESTROY, set LAST so it cannot be set by a load that failed
   * before the gesture. `window` and not `sessionStorage`: the whole point is that it cannot
   * survive. */
  window.__m22mark = stash.epoch
  globalThis.M22.phase = 'navigating'
  say('load 1 done; navigating to phase 2 — a pin that needs this page is not a pin that survived')
  /* `replace` AND NOT `assign`: a history entry nobody can use is a back button that re-runs the
   * gesture against a pin that is already there. */
  location.replace(phase2Url(stash.epoch))
}

/**
 * LOAD 2: ASSERT THE PIN CAME BACK, AND RUN EVERYTHING ELSE.
 *
 * THE ORDER IS FORCED IN TWO PLACES. `tray` is LAST because it kills the desktop process, which
 * takes the pins, the start menu and the icons with it; `band` is after `save` because the editors
 * are gone by then and the band's button count is the one the search was run against.
 */
async function loadTwo () {
  const raw = sessionStorage.getItem(STASH_KEY)
  const load1 = raw ? JSON.parse(raw) : null
  /* THE RELOAD, AS THREE READINGS. A page loaded straight at `&phase=2` has no stash; one whose
   * stash is a previous run's has the wrong epoch; one that never navigated still has the marker.
   * All three are the difference between a proof and a reading of a world that did not happen. */
  globalThis.M22.reload = {
    navigated: Boolean(load1),
    markSurvived: typeof window.__m22mark !== 'undefined',
    epochMatched: Boolean(load1) && load1.epoch === EPOCH && EPOCH !== '',
    epoch: EPOCH,
    stashEpoch: load1 ? load1.epoch : '',
    navigationType: ((performance.getEntriesByType('navigation') || [])[0] || {}).type || '',
  }
  if (!load1 || !globalThis.M22.reload.epochMatched) {
    throw new Error('phase 2 has no load-1 stash for this run: '
      + `${JSON.stringify(globalThis.M22.reload)}. The pin gesture happens in load 1, so this URL `
      + 'cannot be opened on its own — load `?proofs=1` and let the page navigate.')
  }
  say('M22 load 2 of 2 — the pin after the reload, then the save, the chord, the band and the tray.')
  say('dpr ' + dpr() + ', viewport ' + window.innerWidth + 'x' + window.innerHeight + '.')
  const controls = Object.entries({ band_clips: CFG.bandClips,
    save_to_window_fd: CFG.saveToWindowFd, tray_outlives: CFG.trayOutlives })
    .filter(([, on]) => on).map(([name]) => name)
  if (controls.length) say('CONTROL: ' + controls.join(' '))

  const booted = await bootShell({
    into: desktop, report: globalThis.M22, say, label: 'm22', taskbar: true, tap: kernelTap,
  })
  const { k, host, shell } = booted
  publish(host, shell)
  KERNEL = k
  globalThis.M22.kernelIsolated = true
  globalThis.M22.controlsInForce = {
    host: host.report().controls, shell: shell.report().controls,
  }

  /* THE TRAY CONTROL, ARMED HERE AND NOWHERE ELSE (header note 3). `trayRows` is DERIVED from
   * `host.frames` every `sync`, so the shipped shell has no withdrawal step to skip — and a control
   * that turns nothing verifies nothing. This is the defect written where it would live: a shell
   * that REMEMBERS its rows. The page is the supervisor and this is the shell the page built. */
  if (CFG.trayOutlives) {
    const real = shell.trayRows.bind(shell)
    let remembered = []
    shell.trayRows = () => {
      const got = real()
      if (got.length) remembered = got
      return got.length ? got : remembered
    }
    globalThis.M22.notes.push('tray_outlives: the shell was made to remember its tray rows instead '
      + 'of deriving them from host.frames, which is the classic tray defect. The shipped shell has '
      + 'no step to skip, so the world is built here rather than in src/wm/taskbar.mjs.')
  }

  /* TWO WINDOWS OF ONE PROGRAM, STAGED FIRST: the switch proof needs more than one window to switch
   * between, and the band proof needs a button that is not a pin. `winopen` is the program whose
   * window count is an argument, so the number is the spec's and not a repeated spawn. */
  await stageDesktop({
    booted, into: desktop, report: globalThis.M22, say, label: 'm22',
    programs: [{ ...PROGRAMS.winopen, name: 'winopen', count: 2 }],
    help: [], diagnose: false,
  })

  /* ---- 1: the pin came back, and launches -------------------------------------------------- */
  const pinBack = await drivePinBack(k, host, shell)
  globalThis.M22.pinBack = pinBack
  proofPins(load1, pinBack)

  /* ---- 2: the save ------------------------------------------------------------------------- */
  const saveRun = await driveSave(k, host)
  globalThis.M22.saveRun = saveRun
  const roRun = await driveRefusedSave(k, host)
  globalThis.M22.roRun = roRun
  proofSave(saveRun, roRun)

  /* ---- 3: the chord ------------------------------------------------------------------------ */
  const switchRun = await driveSwitch(k, host, shell)
  globalThis.M22.switchRun = switchRun
  proofSwitch(switchRun)

  /* ---- 4: the band ------------------------------------------------------------------------- */
  const bandRun = await driveBand(k, host, shell)
  globalThis.M22.bandRun = bandRun
  proofBand(bandRun)

  /* ---- 5: the tray ------------------------------------------------------------------------- */
  /* THE PIDS THE DESKTOP PROCESS ITSELF SPAWNED, handed to the tray proof because they are the
   * processes that INHERITED its window fd — the editor the pinned button started, and whatever the
   * tray icon starts. `driveTray` kills the desktop first and then these, and the two waits are two
   * clauses. */
  const heirs = [(pinBack.window && pinBack.window.pid) | 0].filter((p) => p > 0)
  const trayRun = await driveTray(k, host, shell, heirs)

  const proofs = globalThis.M22.proofs
  const bad = Object.entries(proofs).filter(([, p]) => p && !p.ok).map(([n]) => n)

  globalThis.M22.notDriven = notDriven

    + (notDriven.length ? '; not driven: ' + notDriven.join(', ') : '')

  say('')
  say('verdict ' + globalThis.M22.verdict)

  globalThis.M22.phase = 'rendered'
}

async function main () {
  if (!CFG.proofs) {
    globalThis.M22.state = 'done'
    globalThis.M22.verdict = 'live'
    await live()
    return
  }
  if (CFG.phase === 1) {

 * `main()` is called synchronously and on the BARE URL it reaches `live()` before the first
 * `await` — so an entry point above `LIVE_PROGRAMS` hands `stageDesktop` an object literal that
 * reads that `const` while it is still in its temporal dead zone:
 * `Cannot access 'LIVE_PROGRAMS' before initialization`, in BOTH engines. That is M17's bill, paid

  })
}
